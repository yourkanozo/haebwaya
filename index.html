<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>폼을 보아하니</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@v2.0/nanumsquare.css">
<style>
  /* ───────── 공통 규칙 (web-rules.md 참고) ───────── */
  :root {
    --cols: 12;
    --cell: calc(100vw / var(--cols));
    --u: calc(100vw / 1920);            /* 1920 화면 기준 1px */
    --gut:      calc(var(--u) * 30);    /* 박스 안쪽 여백 */
    --fs-l:     calc(var(--u) * 25);    /* 큰 글자: 박스 이름, 아이템 이름 */
    --fs-xl:    calc(var(--u) * 40);    /* 숫자 */
    --fs-s:     calc(var(--u) * 15);    /* 작은 글자: 설명, 본문 */
    --lh-s:     calc(var(--u) * 22);
    --ease: cubic-bezier(.3, 0, .2, 1);
    --cold: #000;                       /* 빈 칸 배경 = 검정 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--cold); color: #fff; }
  body {
    font-family: "NanumSquare", -apple-system, sans-serif;
    font-weight: 300;                   /* 전부 라이트 */
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }

  /* ───────── 히트맵: 화면에 고정된 캔버스. 아이템·박스 아래에 깔려서 빈 칸으로만 보임 ───────── */
  #heat { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

  /* ───────── 그리드 ─────────
     박스·빈 칸은 자리를 지정, 아이템은 남은 칸을 왼쪽 위부터 순서대로 채움 */
  .grid {
    position: relative;
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--cell));
    grid-auto-rows: var(--cell);
  }
  .grid > * { position: relative; z-index: 1; }
  .hole { z-index: 0; pointer-events: none; }      /* 빈 칸: 아무것도 없음 → 아래 히트맵이 보임 */

  /* ───────── 아이템 ───────── */
  .item { cursor: pointer; transform-origin: 0 0; }
  .item::before, .item::after { content: ''; position: absolute; inset: 0; }
  .item::before { background: #111 var(--img) center / cover; }
  /* 로딩 (2026-10-17): 단색 → 사진이 '스르륵'. 단색이 한쪽 가장자리로 걷히며 사진이 드러남 (밀려 나오는 설명 창처럼)
     스크롤하는 동안은 단색 그대로, 멈추면 화면에 보이는 것부터 (레이지 로드) */
  .item::after { background: var(--solid); clip-path: inset(0); transition: clip-path var(--reveal, .6s) var(--ease); }
  .item.done.d-r::after { clip-path: inset(0 0 0 100%); }
  .item.done.d-l::after { clip-path: inset(0 100% 0 0); }
  .item.done.d-d::after { clip-path: inset(100% 0 0 0); }
  .item.done.d-u::after { clip-path: inset(0 0 100% 0); }
  .item.now::after { transition: none; }
  .item.open { z-index: 4; cursor: pointer; }   /* 박스를 가려도 됨 */

  /* 상세 설명: 열린 아이템 옆 2×2, 그 사진의 평균색 */
  .info {
    z-index: 3;                         /* 열린 사진(4) 뒤에서 밀려 나옴 */
    background: var(--solid);
    color: var(--fg);
    padding: var(--gut);
    display: flex; flex-direction: column;
    clip-path: inset(0 0 0 0);
    animation: infoIn var(--info-dur, .8s) var(--ease) var(--info-delay, 0s) backwards;
  }
  /* 설명 창은 사진 쪽 가장자리에서 펼쳐짐 */
  .info.from-right  { animation-name: infoIn; }
  .info.from-left   { animation-name: infoInL; }
  .info.from-bottom { animation-name: infoInB; }
  .info.from-top    { animation-name: infoInT; }
  /* 설명 창이 사진 뒤에서 '스르륵' 밀려 나옴: 사진 쪽 가장자리에서 펼쳐지면서 살짝 미끄러져 나옴 */
  @keyframes infoIn  { from { clip-path: inset(0 100% 0 0); transform: translateX(-50%); } }
  @keyframes infoInL { from { clip-path: inset(0 0 0 100%); transform: translateX(50%); } }
  @keyframes infoInB { from { clip-path: inset(0 0 100% 0); transform: translateY(-50%); } }
  @keyframes infoInT { from { clip-path: inset(100% 0 0 0); transform: translateY(50%); } }
  .info .code  { font-size: var(--fs-s); line-height: 1; opacity: .7; }
  .info .name  { font-size: var(--fs-l); line-height: 1.2; margin-top: calc(var(--u) * 14); }
  .info dl     { margin-top: auto; font-size: var(--fs-s); line-height: var(--lh-s); display: grid; grid-template-columns: auto 1fr; column-gap: calc(var(--u) * 16); }
  .info dt     { opacity: .7; }
  .info .desc  { margin-top: calc(var(--u) * 14); font-size: var(--fs-s); line-height: var(--lh-s); }

  /* ───────── 박스 (메뉴) ─────────
     색은 팔레트에서 랜덤, 자리·크기는 고정 (움직이지 않음) */
  .box { color: var(--fg); display: block; z-index: 2; }   /* 밀려나는 아이템은 박스 아래로 지나감 (열린 아이템·설명은 위) */
  /* 예외 규칙 (2026-10-14): 처음 불러올 때 박스는 펼쳐지는 움직임 없이 그냥 '딱' 나타남 (히트맵도 없음). 모든 페이지 같음 */
  .box-in { position: absolute; inset: 0; background: var(--bg); }
  @keyframes boxIn  { from { clip-path: inset(0 100% 100% 0); } to { clip-path: inset(0); } }
  @keyframes boxInR { from { clip-path: inset(0 0 100% 100%); } to { clip-path: inset(0); } }
  .box .t, .box .s, .box .n { position: absolute; line-height: 1; white-space: nowrap; }
  .box .t { left: var(--gut); top: var(--gut); font-size: var(--fs-l); }
  .box .s { right: var(--gut); bottom: var(--gut); font-size: var(--fs-s); display: flex; align-items: center; gap: calc(var(--u) * 10); }
  .box .n { right: var(--gut); bottom: var(--gut); font-size: var(--fs-l); }   /* 10/18: 숫자 40 → 25 (박스 이름과 같은 단계) */
  .box svg { width: calc(var(--u) * 16); height: calc(var(--u) * 16); }
  @keyframes fade { from { opacity: 0; } }

  /* 개요: 프로젝트 이름을 누르면 박스 옆에 펼쳐짐 (박스 크기는 그대로) */
  .overview {
    position: absolute; z-index: 6;
    left: calc(var(--cell) * (var(--c) - 1)); top: calc(var(--cell) * (var(--r) - 1));
    width: calc(var(--cell) * var(--w)); height: calc(var(--cell) * var(--h));
    background: var(--bg); color: var(--fg);
    padding: var(--gut);
    font-size: var(--fs-s); line-height: var(--lh-s);
    clip-path: var(--closed);
    transition: clip-path .5s var(--ease) 0s;            /* 10/18 순서 (사진 열기와 같은 규칙) — 열 때: 이름 박스가 아래로 + 사진들이 밀려남 → 다 끝나면 개요가 옆으로 / 닫을 때: 개요가 먼저 접힘 → 이름 박스 올라감 + 사진들 돌아옴 */
    pointer-events: none;
  }
  .overview.on { clip-path: inset(0); pointer-events: auto; transition: clip-path .6s var(--ease) var(--ov-delay, .5s); }
  /* 글은 안쪽 칸(.ov-text)에서만 스크롤 → 스크롤해도 상하좌우 여백(30)이 항상 같게 유지됨
     아래에 글이 더 남아 있으면 글의 아래쪽이 살짝 흐려짐 */
  .overview { word-break: keep-all; overflow: hidden; }
  .ov-text { height: 100%; overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain; }
  .ov-text::-webkit-scrollbar { display: none; }
  .overview.more .ov-text { -webkit-mask-image: linear-gradient(#000 calc(100% - var(--u) * 44), transparent); mask-image: linear-gradient(#000 calc(100% - var(--u) * 44), transparent); }
  .overview p + p { margin-top: var(--lh-s); }
  /* 개요가 열리면 이름 박스가 글 그대로 아래로 늘어나 개요와 높이가 맞음 (2026-10-17) */
  .box-name { z-index: 7; align-self: start; justify-self: start; width: calc(var(--cell) * var(--w0, 2)); height: calc(var(--cell) * var(--h0, 2)); transition: width .5s var(--ease) .5s, height .5s var(--ease) .5s; }
  /* 10/18: 개요를 열면 이름 박스가 3×2 → 2×3 (좁아지며 아래로 길어짐), 그 옆에 개요 2×3 */
  .box-name.ov-on { width: calc(var(--cell) * (var(--w0, 2) + var(--grow-w, 0))); height: calc(var(--cell) * (var(--h0, 2) + var(--grow, 0))); transition-delay: var(--name-delay, 0s); }

  /* ───────── 스크롤하면 나오는 접이식 메뉴 '폼을 보아하니' (위쪽 정가운데, 화면에서 살짝 띄움) ─────────
     그림자는 묶음(.dock) 전체에 아주 옅게 → 아이템 위에서 분리돼 보임 */
  .dock {
    position: fixed; z-index: 20;
    --float: calc(var(--u) * 24);
    top: var(--float); left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
    filter: drop-shadow(0 calc(var(--u) * 4) calc(var(--u) * 10) rgba(0, 0, 0, .28));
    pointer-events: none;
  }
  .fab, .menu a, .menu button {
    width: calc(var(--cell) * 1.5); height: calc(var(--cell) / 2);
    background: var(--bg); color: var(--fg);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--gut);
    font-size: var(--fs-s);
  }
  .fab {
    clip-path: inset(0 0 100% 0);                /* 위에서 아래로 펼쳐지며 나타남 */
    transition: clip-path .5s var(--ease);
    pointer-events: auto;
  }
  .fab:not(.show) { pointer-events: none; }
  .fab.show { clip-path: inset(0); }
  .fab svg { width: calc(var(--u) * 16); height: calc(var(--u) * 16); transition: transform .3s var(--ease); }
  .fab.open svg { transform: rotate(180deg); }
  .menu { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .menu a, .menu button {
    clip-path: inset(0 0 100% 0);
    transition: clip-path .45s var(--ease) calc(var(--i) * 60ms);
  }
  .menu.on { pointer-events: auto; }
  .menu.on a, .menu.on button { clip-path: inset(0); }
  .menu svg { width: calc(var(--u) * 14); height: calc(var(--u) * 14); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  }
  /* ───────── 메뉴 = 햄버거 아이콘 (2026-10-14): 모든 페이지 같은 자리. 오른쪽 위, 화면 가장자리에서 24만큼 띄움 ─────────
     누르면 아래로 메뉴가 펼쳐지고 아이콘은 ×로 바뀜 */
  .dock { left: auto !important; right: calc(var(--u) * 24) !important; transform: none !important; align-items: flex-end !important; }
  .fab { width: calc(var(--cell) / 2) !important; padding: 0 !important; justify-content: center !important; }
  .fab svg { width: calc(var(--u) * 22) !important; height: calc(var(--u) * 22) !important; transform: none !important; }
  .fab .i-x { display: none; }
  .fab.open .i-x { display: block; }
  .fab.open .i-ham { display: none; }
  /* 맨 위로 ↑: 반 칸 이상 스크롤하면 화면 가운데 아래 (모든 페이지 공통, 메뉴와 같은 크기·간격·그림자) */
  .to-top { position: fixed; z-index: 20; left: 50%; bottom: calc(var(--u) * 24); transform: translateX(-50%);
            width: calc(var(--cell) / 2); height: calc(var(--cell) / 2); display: flex; align-items: center; justify-content: center;
            background: var(--bg); color: var(--fg); border: 0; cursor: pointer; filter: drop-shadow(0 calc(var(--u) * 4) calc(var(--u) * 10) rgba(0,0,0,.28));
            clip-path: inset(100% 0 0 0); transition: clip-path .5s var(--ease); pointer-events: none; }
  .to-top.show { clip-path: inset(0); pointer-events: auto; }
  .to-top svg { width: calc(var(--u) * 22); height: calc(var(--u) * 22); }

  /* ───────── 메뉴 = 화면 오른쪽 끝의 세로 인덱스 탭 (2026-10-15) ─────────
     햄버거 칸도 메뉴 칸과 같은 크기(1.5칸 × 반 칸)로 화면 오른쪽 끝에 붙어, 옆에서 밀려 나옴.
     누르면 홈·아티클·탐색 칸이 그 아래로 하나씩 옆에서 밀려 나와 이어짐 */
  .dock { right: 0 !important; }
  .fab { width: calc(var(--cell) * 1.5) !important; justify-content: flex-start !important; padding: 0 var(--gut) !important;
         clip-path: none !important; transform: translateX(100%); transition: transform .5s var(--ease) !important; }
  .fab.show { transform: none; }
  /* 2026-10-17: 메뉴 칸은 햄버거 칸 밑에서 아래로 펼쳐짐 — 사진이 밀려 내려가는 움직임과 같음 (같은 곡선·0.7초·칸마다 0.04초 차례) */
  .fab { position: relative; z-index: 2; }
  .menu { align-items: flex-end !important; position: relative; z-index: 1; overflow: hidden; }
  .menu a, .menu button { width: calc(var(--cell) * 1.5) !important; height: calc(var(--cell) / 2) !important;
    clip-path: none !important; position: relative; z-index: calc(10 - var(--i)); transform: translateY(calc(-100% * (var(--i) + 1)));   /* 위 칸이 아래 칸을 덮은 채로 차례로 펼쳐짐 */
    transition: transform .7s cubic-bezier(.25, .1, .25, 1) calc(var(--i) * 40ms) !important; }
  .menu.on a, .menu.on button { transform: none; }
</style>
<script src="images/colors.js"></script>   <!-- 사진별 평균색 (없으면 임시 색) -->
</head>
<body>

<canvas id="heat"></canvas>
<main class="grid" id="grid"></main>

<div class="dock">
  <button class="fab" id="fab" type="button" aria-label="메뉴 열기"><svg class="i-ham" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 6h16M3 11h16M3 16h16"/></svg><svg class="i-x" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="m5 5 12 12M17 5 5 17"/></svg></button>
  <nav class="menu" id="menu"></nav>
</div>

<button class="to-top" id="toTop" type="button" aria-label="맨 위로"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M11 19V3M4 10l7-7 7 7"/></svg></button>
<script>
/* ═════════ 설정 ═════════ */
const CONFIG = {
  imageCount: 64,
  itemCount: 1026,           // 아이템 수 (지금은 사진 64장을 반복해서 채움)
  path: id => `images/${id}.webp`,  // 사진 파일 이름 = 시트 id (WebP로 줄인 것)
  spreadTries: 300,          // 박스 배치를 이만큼 뽑아 보고 가장 멀리 떨어진 것을 고름
  haloImage: [0.1, 0.3],    // 박스 둘레 칸 중 사진이 들어가도 되는 비율 (최소, 최대)
  holeRatio: [0.24, 0.30],   // 빈 칸 비율 (아이템·박스 칸 수 대비, 최소) — 2026-10-14: 16% → 24%
  blockSizes: [              // 빈 칸 덩어리 크기(가로×세로)와 나오는 비중
    { w: 2, h: 1, p: 5 }, { w: 2, h: 2, p: 3 }, { w: 2, h: 3, p: 1.5 }, { w: 3, h: 2, p: 1.5 }, { w: 3, h: 3, p: 1 },
  ],
  loadStep: 45,              // 사진이 아이템마다 차례로 드러나는 간격(ms)
  lazyIdle: 100,             // (10/17: 180 → 100) 스크롤이 이만큼(ms) 멈추면 '멈췄다'고 보고 사진을 불러옴 (2026-10-17)
  heat: true,                // 히트맵 켜기/끄기
  heatMax: 0.6,              // 가장 뜨거운 색의 위치 (0.6 = 빨강. 0.75면 주황, 0.9면 노랑, 1이면 흰색까지)
  heatBlob: 0.25,            // 움직이는 사진 열의 가장자리 흐림 (칸 대비). 작을수록 각짐 (10/14: 0.6 둥긂 → 0.1 너무 각짐 → 0.25)
  heatPad: [0.15, 0.25],    // 움직이는 사진의 열을 사진보다 이만큼(칸 대비) 크게 찍음: [밀리는 사진, 커지고 작아지는 사진·설명]. 세기는 그대로, 사진 밖으로 드러남
  heatMove: [0.065, 0.075],  // 10/14: [0.05, 0.07] → [0.065, 0.075] 열이 더 빨리 올라오게. 움직이는 아이템이 지나간 길에 남기는 열: [밀리는 사진, 커지고 작아지는 사진·설명] (10/14 '따라가는 열'로 바꾸며 새로)
  heatSpeed: 0.02,           // 한 프레임에 칸의 이만큼 움직이면 최대 세기 (느리게 움직이면 옅게)
  heatArea: 0.4,             // 자리는 그대로이고 잘려 나오기만 하는 것(설명 접힘·개요 등)의 세기 (0~1)
  heatScroll: [0.16, 90],    // 스크롤 잔상: [최대 세기, 이 속도(px/프레임) 이상일 때 최대]. 속도의 1.5제곱으로 커짐 → 보통 스크롤도 파랑이 보이고, 빠를수록 진해짐
  heatScrollBlob: 0.12,      // 스크롤 잔상의 번짐 크기 (칸 대비). 작을수록 빈 칸 가장자리에만 남음
  heatFollow: 0.7,           // 스크롤할 때 열이 페이지를 따라가는 정도 (1 = 페이지에 붙음, 0 = 화면에 고정 → 잔상이 길게 남음)
  heatSpread: 0.07,           // 식으면서 옆으로 퍼지는 정도. 클수록 둥글게 뭉개짐 (10/14: 0.1 → 0.04 → 0.07)
  heatCoolFast: 0.93,        // 사진 설명이 닫히고 사진이 돌아오는 동안만 쓰는 빠른 식음 (10/17)
  heatEmber: 0.15,           // 이보다 옅은 열은 잔열 — 식는 속도를 0.4배로 늦춤 (10/17)
  heatCool: 0.985,           // 한 프레임마다 남는 열 (1에 가까울수록 늦게 식음). 10/14: 0.986 → 0.975 (더 빨리 식게) → 0.965 (꼬리 짧게) → 0.985 (10/17: 잔열이 오래 남게)
  boxesMove: false,          // true: 박스도 아이템과 같은 규칙으로 아래로 밀려남

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (ch === '"') q = false;
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  const [head, ...body] = rows;
  return body.filter(r => r.some(v => v.trim())).map(r => Object.fromEntries(head.map((h, i) => [h.trim(), (r[i] || '').trim()])));
}

const rand = n => Math.floor(Math.random() * n);

const rgbOf = c => c.startsWith('#') ? [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)) : c.match(/\d+/g).map(Number);

/* 박스끼리: 겹치지 않고 수평·수직으로 맞닿지도 않음 (대각선 모서리는 허용) */

  return (ov(a.c, a.w, b.c, b.w) && to(a.r, a.h, b.r, b.h)) || (ov(a.r, a.h, b.r, b.h) && to(a.c, a.w, b.c, b.w));

/* 박스: 첫 화면(온전히 보이는 행) 안에 랜덤, 서로 맞닿지 않게 */
/* 박스 배치: 랜덤으로 여러 번(CONFIG.spreadTries) 뽑아 보고, 박스끼리 가장 멀리 떨어진 배치를 고름
   (가장 가까운 두 박스 사이 거리가 가장 큰 것 → 같으면 전체 거리 합이 큰 것) */
function gapBetween(a, b) {                      // 두 박스 사이 빈 칸 수 (가로·세로 중 큰 쪽)
  const gx = Math.max(0, b.c - (a.c + a.w), a.c - (b.c + b.w));
  const gy = Math.max(0, b.r - (a.r + a.h), a.r - (b.r + b.h));
  return Math.max(gx, gy);
}
/* 2026-10-17: 위에서 아래로 순서 고정 — 프로젝트 이름(맨 윗줄) → 탐색 → 아티클 → 전체. 가로 자리·색은 랜덤 */
const BOX_ORDER = ['name', 'explore', 'article', 'all'];
function randomBoxes(rows, namePos) {
  const byId = Object.fromEntries(BOXES.map(b => [b.id, b]));
  for (let attempt = 0; attempt < 200; attempt++) {
    const out = {}, placed = [];
    let prevR = 0, ok = true;
    for (let k = 0; k < BOX_ORDER.length && ok; k++) {
      const b = byId[BOX_ORDER[k]], left = BOX_ORDER.length - 1 - k;   // 아래에 더 놓을 박스 수
      const rMin = k === 0 ? 1 : prevR + 1, rMax = k === 0 ? 2 : rows - b.h + 1 - left;   // 이름 박스: 1행 또는 2행에서 시작 (10/18)
      if (rMax < rMin) { ok = false; break; }
      let done = false;
      for (let t = 0; t < 200 && !done; t++) {
        /* 이름 박스 (10/18): 중앙까지 와도 됨. 닫힌 3×2도, 열린 이름 2×3 + 개요 2×3도 7열을 넘지 않게 → 1~4열에서 시작 */
        const c = b.id === 'name' ? 1 + rand(7 - Math.max(b.w, OV_OPEN.name.w + OV_OPEN.ov.w) + 1) : 1 + rand(13 - b.w);
        const r = b.id === 'name' && namePos ? { ...namePos, w: b.w, h: b.h } : { c, r: rMin + rand(rMax - rMin + 1), w: b.w, h: b.h };
        const grown = { c: r.c - 1, r: r.r - 1, w: r.w + 2, h: r.h + 2 };   // 둘레 한 칸(빈 칸 띠)까지 포함해 다른 박스와 겹치지 않게
        if (placed.some(o => overlap(grown, o))) continue;
        out[b.id] = r; placed.push(b.id === 'name' ? { c: r.c, r: r.r, w: Math.max(r.w, OV_OPEN.name.w + OV_OPEN.ov.w), h: Math.max(r.h, OV_OPEN.name.h, OV_OPEN.ov.h) } : r);   // 이름: 열렸을 때 자리(이름 2×3 + 개요 2×3)까지 비워 둠
        prevR = r.r; done = true;
      }
      ok = done;
    }
    if (ok) return BOXES.map(b => out[b.id]);
  }
  return null;
}
function placeBoxes(rows) {
  /* 10/18: 이름 박스 자리는 먼저 고르게 랜덤으로 정함 (1~4열, 1~2행) → 나머지 박스만 멀리 떨어지게 고름
     (같이 고르면 '멀리 떨어진' 배치가 늘 이기면서 이름 박스가 왼쪽 위 모서리에 몰림) */
  const nb = BOXES.find(b => b.id === 'name');
  const namePos = { c: 1 + rand(7 - Math.max(nb.w, OV_OPEN.name.w + OV_OPEN.ov.w) + 1), r: 1 + rand(2) };
  let best = null, bestMin = -1, bestSum = -1;
  for (let i = 0; i < CONFIG.spreadTries; i++) {
    const cand = randomBoxes(rows, namePos);
    if (!cand) continue;
    let min = Infinity, sum = 0;
    for (let a = 0; a < cand.length; a++) for (let b = a + 1; b < cand.length; b++) {
      const g = gapBetween(cand[a], cand[b]); min = Math.min(min, g); sum += g;
    }
    if (min > bestMin || (min === bestMin && sum > bestSum)) { best = cand; bestMin = min; bestSum = sum; }
  }
  return best || placeBoxes(rows + 1);                               // 화면이 낮아 순서대로 못 놓으면 한 줄 늘려서
}

/* 빈 칸: 중간중간. 이어져도 두 칸까지 (세 칸 이상 상하좌우로 붙지 않음), 박스에 붙지 않음 */
/* 빈 칸 규칙 (둘레 + 덩어리)
   - 박스 둘레 한 칸은 전부 빈 칸 (박스가 사진 사이에서 떠 보이도록)
   - 그 밖의 빈 칸은 직사각형 덩어리로만: 2×1, 2×2, 2×3, 3×2, 3×3 (가로×세로). 한 칸짜리는 없음
   - 작은 것일수록 자주 (CONFIG.blockSizes의 비중)
   - 덩어리끼리, 덩어리와 박스·박스 둘레는 상하좌우·대각선 어디로도 맞닿지 않음 → 하나하나가 또렷한 모양으로 보임
   - 전체 빈 칸은 적게 (아이템·박스 칸 수의 CONFIG.holeRatio[0] 정도). 마지막 줄까지 칸이 꽉 차도록 넓이를 맞춤 */
function placeBlocks(base, boxes) {
  for (let attempt = 0; attempt < 50; attempt++) {
    const taken = new Set();
    boxes.forEach(b => cellsOf(b).forEach(k => taken.add(k)));
    /* 박스 둘레 한 칸 */
    const halo = new Set();
    boxes.forEach(b => { for (let r = b.r - 1; r <= b.r + b.h; r++) for (let c = b.c - 1; c <= b.c + b.w; c++) {
      const k = key(r, c); if (r >= 1 && c >= 1 && c <= 12 && !taken.has(k)) halo.add(k);
    } });
    /* 둘레 칸 중 일부(CONFIG.haloImage, 10~30%)는 사진이 들어갈 수 있게 풀어 줌 → 빈 칸이 박스 쪽에 '몰려' 보이되 완전히 비지는 않음 */
    const [h0, h1] = CONFIG.haloImage;
    shuffle([...halo]).slice(0, Math.round(halo.size * (h0 + Math.random() * (h1 - h0)))).forEach(k => halo.delete(k));
    let rows = Math.ceil(base / 12), target = rows * 12 - base;
    while (target < halo.size + base * CONFIG.holeRatio[0]) { rows++; target += 12; }
    halo.forEach(k => taken.add(k));
    const near = new Set();                                     // 덩어리가 들어가면 안 되는 칸 (박스·둘레·덩어리와 맞닿는 칸)
    const addNear = b => { for (let r = b.r - 1; r <= b.r + b.h; r++) for (let c = b.c - 1; c <= b.c + b.w; c++) near.add(key(r, c)); };
    boxes.forEach(b => addNear({ c: b.c - 1, r: b.r - 1, w: b.w + 2, h: b.h + 2 }));
    const holes = [];
    let left = target - halo.size, fails = 0;
    while (left > 0 && fails < 4000) {
      /* 남은 넓이를 덩어리(2·4·6·9칸)만으로 딱 채울 수 있는지: 1·3·5·7칸은 불가능 */
      const ok = n => n === 0 || (n >= 2 && ![3, 5, 7].includes(n));
      if (!ok(left)) { rows++; left += 12; continue; }        // 못 채우는 넓이면 줄을 하나 늘려서 맞춤
      const fit = CONFIG.blockSizes.filter(z => z.w * z.h <= left && ok(left - z.w * z.h));
      if (!fit.length) { rows++; left += 12; continue; }
      const total = fit.reduce((t, z) => t + z.p, 0);
      let pick = Math.random() * total, z = fit[0];
      for (const f of fit) { pick -= f.p; if (pick <= 0) { z = f; break; } }
      const b = { c: 1 + rand(13 - z.w), r: 1 + rand(rows - z.h + 1), w: z.w, h: z.h };
      if (cellsOf(b).some(k => near.has(k) || taken.has(k))) { fails++; continue; }
      holes.push(b); addNear(b); cellsOf(b).forEach(k => taken.add(k));
      left -= z.w * z.h; fails = 0;
    }
    const cells = [...halo, ...holes.flatMap(b => cellsOf(b))];
    if (left === 0) return { rows, holes: cells.map(k => ({ r: Math.floor(k / 100), c: k % 100, w: 1, h: 1 })), blocks: holes };
  }
  return null;
}

/* ═════════ 칸 좌표 ═════════ */
const key = (r, c) => r * 100 + c;
const cellsOf = b => { const out = []; for (let r = b.r; r < b.r + b.h; r++) for (let c = b.c; c < b.c + b.w; c++) out.push(key(r, c)); return out; };
let holeEls = [];

let IMAGES = [], items = [], boxEls = {}, colors = {};

  /* 마지막 줄까지 꽉 차도록 빈 칸 수를 정함 */
  const { holes } = placeBlocks(base, boxes);

  BOXES.forEach((b, i) => {
    const el = document.createElement(b.tag);
    el.className = `box box-${b.id}` + (boxes[i].c + (b.w - 1) / 2 > 6.5 ? ' right' : '');
    if (b.href) el.href = b.href;   // 모든 이동은 같은 탭에서
    if (b.tag === 'button') el.type = 'button';
    el.innerHTML = `<div class="box-in"></div>${b.html}`;
    el.style.setProperty('--delay', (i * 0.09) + 's');
    paint(el, colors[b.id]);
    place(el, boxes[i]);
    grid.appendChild(el);
    boxEls[b.id] = { el, rect: boxes[i], home: { ...boxes[i] } };
  });
  holes.forEach(h => { const el = document.createElement('div'); el.className = 'hole'; place(el, h); el._home = { ...h }; grid.appendChild(el); holeEls.push(el); });

  /* 아이템: 박스·빈 칸을 피해 왼쪽 위부터 차례로. 자리를 직접 지정해 둠 (열고 닫을 때 필요한 칸만 움직이게) */
  blocked.clear();
  boxes.forEach(b => cellsOf(b).forEach(k => blocked.add(k)));
  holes.forEach(h => blocked.add(key(h.r, h.c)));
  let r = 1, c = 1;
  IMAGES.forEach(im => {
    while (blocked.has(key(r, c))) { c++; if (c > 12) { c = 1; r++; } }
    const el = document.createElement('div');
    el.className = 'item';
    el.style.setProperty('--solid', im.solid);
    el._data = im;
    el._home = { r, c };
    setPos(el, el._home);
    grid.appendChild(el);
    items.push(el);
    c++; if (c > 12) { c = 1; r++; }
  });
  buildOverview();
  buildMenu();
}

/* ═════════ 로딩 (2026-10-17) ═════════
   - 아이템은 처음엔 그 사진의 평균색(단색). 사진은 '멈춰 있을 때'만 불러와서 보여 줌 (레이지 로드)
   - 스크롤하는 동안은 단색 그대로 → 멈추면(CONFIG.lazyIdle) 화면에 보이는 것부터 왼쪽 위 순서로
   - 단색 → 사진: 단색이 한쪽 가장자리로 걷히며 사진이 스르륵 드러남 */
const inView = el => { const r = el.getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight; };
const byPos = (a, b) => { const A = a.getBoundingClientRect(), B = b.getBoundingClientRect(); return (A.top - B.top) || (A.left - B.left); };
let scrolling = false, scrollIdle;
addEventListener('scroll', () => { scrolling = true; clearTimeout(scrollIdle); scrollIdle = setTimeout(() => { scrolling = false; revealVisible(); }, CONFIG.lazyIdle); }, { passive: true });
addEventListener('resize', () => setTimeout(revealVisible, CONFIG.lazyIdle));
const imgCache = new Map();                                     // 같은 사진은 한 번만 받음
const getImg = src => { if (!imgCache.has(src)) imgCache.set(src, loadImage(src)); return imgCache.get(src); };
const DIRS = ['d-r'];   // 10/18: 사진은 늘 왼쪽 → 오른쪽으로 드러남 (단색이 오른쪽으로 걷힘)
/* 2026-10-17: 화면 밖으로 나간 사진은 다시 단색으로 → 돌아오면 레이지 로드로 다시 스르륵 */
const outIO = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) return;
  const el = e.target; outIO.unobserve(el);
  if (!el._shown) return;
  el.classList.add('now'); el.classList.remove('done'); el._shown = false; el._q = false;
  requestAnimationFrame(() => el.classList.remove('now'));
}));
function showImg(el) {
  el._shown = true;
  el.style.setProperty('--img', `url(${el._data.src})`);
  el.classList.add(DIRS[rand(DIRS.length)]);
  void el.offsetWidth;
  el.classList.add('done');
  outIO.observe(el);
}
const revealQueue = [];
let revealing = false;
function revealVisible() {
  if (scrolling) return;
  items.filter(el => !el._shown && !el._q && inView(el)).sort(byPos).forEach(el => { el._q = true; revealQueue.push(el); });
  if (!revealing) nextReveal();
}
function nextReveal() {
  if (scrolling) { revealQueue.forEach(el => { el._q = false; }); revealQueue.length = 0; revealing = false; return; }   // 스크롤 시작 → 멈출 때까지 기다림
  const el = revealQueue.shift();
  if (!el) { revealing = false; return; }
  revealing = true; el._q = false;
  if (el._shown || !inView(el)) return nextReveal();
  getImg(el._data.src).then(img => { if (img && !el._shown && !scrolling && inView(el)) showImg(el); });
  setTimeout(nextReveal, Math.max(12, Math.min(CONFIG.loadStep, 700 / (revealQueue.length + 1))));
}

/* ═════════ 아이템 열기: 2×2로 커지고 옆에 상세 설명 2×2, 나머지는 밀려남 ═════════ */
let openEl = null, infoEl = null;
/* 열리는 자리: 사진 2×2는 클릭한 칸을 꼭 포함하고, 설명 2×2는 사진의 오른쪽·왼쪽·아래·위 중 하나.
   박스를 가리지 않는 조합 중에서 고름 (박스는 움직이지 않음).
   우선순위: 클릭한 칸이 사진의 왼쪽 위 → 오른쪽 위 → 왼쪽 아래 → 오른쪽 아래, 설명은 오른쪽 → 왼쪽 → 아래 → 위 */
function regionAt(item) {
  const { r: r0, c: c0 } = item._home;
  const boxes = Object.values(boxEls).map(b => b.rect);
  const inside = x => x.c >= 1 && x.c + x.w - 1 <= 12 && x.r >= 1;
  const free = x => inside(x) && !boxes.some(b => overlap(x, b));
  const imgs = [[0, 0], [-1, 0], [0, -1], [-1, -1]].map(([dc, dr]) => ({ c: c0 + dc, r: r0 + dr, w: 2, h: 2 }));
  const sides = [
    { side: 'right',  at: g => ({ c: g.c + 2, r: g.r }) },
    { side: 'left',   at: g => ({ c: g.c - 2, r: g.r }) },
    { side: 'bottom', at: g => ({ c: g.c, r: g.r + 2 }) },
    { side: 'top',    at: g => ({ c: g.c, r: g.r - 2 }) },
  ];
  let fallback = null;
  for (const img of imgs) {
    if (!inside(img)) continue;
    for (const sd of sides) {
      const info = { ...sd.at(img), w: 2, h: 2 };
      if (!inside(info)) continue;
      const spot = { img, info, side: sd.side };
      if (free(img) && free(info)) return spot;
      fallback = fallback || spot;
    }
  }
  /* 그 자리에서 열 수 없으면(박스 바로 옆 등) 박스를 피하는 가장 가까운 자리로 살짝 옮겨서 열림 */
  let best = null, bestD = Infinity;
  for (let r = Math.max(1, r0 - 4); r <= r0 + 4; r++) for (let c = 1; c <= 11; c++) {
    const img = { c, r, w: 2, h: 2 };
    if (!free(img)) continue;
    const d = Math.max(0, c - c0, c0 - (c + 1)) + Math.max(0, r - r0, r0 - (r + 1));   // 클릭한 칸과의 거리
    if (d >= bestD) continue;
    for (const sd of sides) {
      const info = { ...sd.at(img), w: 2, h: 2 };
      if (free(info)) { best = { img, info, side: sd.side }; bestD = d; break; }
    }
  }
  return best || fallback;                               // 그래도 없을 때만 박스를 가림
}
/* 밀려나기: 열린 자리(가로 4칸 × 세로 2칸)에 걸친 세로줄만, 그 아래 아이템들이 아래로 내려감. 나머지는 그대로.
   - 박스 고정(기본): 박스·빈 칸은 그 자리에 있고 아이템이 건너뜀. 열린 자리는 박스를 가려도 됨
   - 박스도 움직임(CONFIG.boxesMove): 걸친 세로줄의 아이템·빈 칸·박스가 모두 똑같이 두 칸 내려감.
     박스가 다른 세로줄에도 걸쳐 있으면 그 줄도 같이 내려감 (박스 옆에 잠깐 빈자리가 생김) */
function pushDown(spot, focus) {
  pushArea({ c: Math.min(spot.img.c, spot.info.c), r: Math.min(spot.img.r, spot.info.r), w: spot.img.c === spot.info.c ? 2 : 4, h: spot.img.r === spot.info.r ? 2 : 4 }, focus);
}
/* 10/18: 사진 열기와 개요 열기가 같은 규칙으로 밀어냄 — region(가로 w × 세로 h)에 걸친 세로줄만 */
function pushArea(region, focus) {
  if (!CONFIG.boxesMove) {
    const taken = new Set([...blocked, ...cellsOf(region)]);
    for (let c = region.c; c < region.c + region.w; c++) {
      const col = items.filter(el => el !== focus && el._home.c === c && el._home.r >= region.r).sort((a, b) => a._home.r - b._home.r);
      let r = region.r;
      col.forEach(el => {
        r = Math.max(r, el._home.r);
        while (taken.has(key(r, c))) r++;
        setPos(el, { r, c });
        r++;
      });
    }
    return;
  }
  const start = {};                                            // 세로줄마다 이 행부터 아래가 두 칸 내려감
  for (let c = region.c; c < region.c + region.w; c++) start[c] = region.r;
  const moving = new Set();
  let changed = true;
  while (changed) {
    changed = false;
    Object.values(boxEls).forEach(b => {
      if (moving.has(b)) return;
      const h = b.home;
      let hit = false;
      for (let c = h.c; c < h.c + h.w; c++) if (start[c] !== undefined && h.r + h.h - 1 >= start[c]) hit = true;
      if (!hit) return;
      moving.add(b); changed = true;
      for (let c = h.c; c < h.c + h.w; c++) start[c] = Math.min(start[c] ?? Infinity, h.r);
    });
  }
  const down = p => start[p.c] !== undefined && p.r >= start[p.c];
  items.forEach(el => { if (el !== focus && down(el._home)) setPos(el, { r: el._home.r + region.h, c: el._home.c }); });
  holeEls.forEach(el => { if (down(el._home)) place(el, { ...el._home, r: el._home.r + region.h }); });
  moving.forEach(b => { b.rect = { ...b.home, r: b.home.r + region.h }; place(b.el, b.rect); });
}
function restoreAll() {
  items.forEach(el => { if (el._pos.r !== el._home.r || el._pos.c !== el._home.c) setPos(el, el._home); });
  if (CONFIG.boxesMove) {
    holeEls.forEach(el => place(el, el._home));
    Object.values(boxEls).forEach(b => { b.rect = { ...b.home }; place(b.el, b.rect); });
  }
}

function openItem(el) {
  const spot = regionAt(el);
  const ovWas = !!ovEl && ovEl.classList.contains('on');
  const switching = !!openEl || ovWas;                          // 개요가 열려 있었으면: 개요가 먼저 접힌 뒤 움직임
  toggleOverview(false, true);
  flip(() => {
    closeDom(true);
    restoreAll();
    pushDown(spot, el);
    openEl = el;
    el.classList.add('open');
    el.style.gridColumn = `${spot.img.c} / span 2`; el.style.gridRow = `${spot.img.r} / span 2`;
    const d = el._data, meta = ITEM_DATA[d.code] || {};
    infoEl = document.createElement('div');
    infoEl.className = 'info from-' + spot.side;
    infoEl.style.setProperty('--solid', d.solid);
    infoEl.style.setProperty('--fg', fgOf(d.solid));
    const has = !!meta.name;                                         // 시트에 이 사진의 정보가 있음
    infoEl.innerHTML = `
      <span class="code">${d.code}</span>
      <span class="name">${has ? meta.name : '이름 (미정)'}</span>
      <p class="desc">${has ? (meta.principle || '') : '간단한 설명이 들어갈 자리.'}</p>
      <dl><dt>동사</dt><dd>${has && meta.verbs.length ? meta.verbs.map(v => '#' + v).join(' ') : '—'}</dd><dt>분야</dt><dd>${has ? meta.field : '—'}</dd></dl>`;
    place(infoEl, spot.info);
    el.after(infoEl);
  }, { focus: el, opening: true, switching });
}
/* 닫기: 설명 창은 펼쳐졌던 쪽으로 접히며 사라짐 */
function closeDom() {
  if (openEl) { openEl.classList.remove('open'); setPos(openEl, openEl._home); }
  if (infoEl) {
    const old = infoEl;
    const to = { 'from-right': 'inset(0 100% 0 0)', 'from-left': 'inset(0 0 0 100%)', 'from-bottom': 'inset(0 0 100% 0)', 'from-top': 'inset(100% 0 0 0)' };
    const side = Object.keys(to).find(k => old.classList.contains(k)) || 'from-right';
    old.style.animation = 'none';
    if (CONFIG.heat) heat.track(old, CONFIG.closeDur + 50, true, true);   // 설명이 접힐 때도 열
    old.animate([{ clipPath: 'inset(0 0 0 0)' }, { clipPath: to[side] }],
      { duration: CONFIG.closeDur, easing: 'cubic-bezier(.4, 0, .2, 1)', fill: 'forwards' }).onfinish = () => old.remove();
  }
  openEl = infoEl = null;
}
function closeItem() { if (openEl) { heat.fast(2000); const f = openEl; flip(() => { closeDom(); restoreAll(); }, { focus: f, opening: false }); } }

/* 움직임 (흔히 쓰는 그리드 재배치 방식: 바뀌기 전 자리 → 바뀐 자리로 한 번에, 짧고 부드럽게)
   - 움직이는 건 열린 자리에 걸린 세로줄의 아이템뿐, 방향은 위아래로만
   - 모두 같이 움직이되 위에서부터 아주 살짝 차례로
   - 열 때: 아이템들이 내려가 자리가 비면 그때 선택한 아이템이 커지고, 설명 창도 자기 자리가 비면 펼쳐짐
   - 닫을 때: 설명이 닫히고 아이템이 작아진 뒤 나머지가 올라옴 */
let anims = [];
function flip(change, { focus, opening, switching = false }) {
  anims.forEach(a => a.finish()); anims = [];
  const movable = CONFIG.boxesMove ? [...items, ...Object.values(boxEls).map(b => b.el)] : items;
  const before = new Map(movable.map(el => [el, el.getBoundingClientRect()]));
  change();
  const movers = [];
  movable.forEach(el => {
    if (el === focus) return;
    const a = before.get(el), b = el.getBoundingClientRect();
    if (Math.abs(a.left - b.left) < 1 && Math.abs(a.top - b.top) < 1 && Math.abs(a.width - b.width) < 1) return;
    const vis = (a.bottom > 0 && a.top < innerHeight) || (b.bottom > 0 && b.top < innerHeight);
    if (vis) movers.push({ el, a, b });
  });
  const ease = 'cubic-bezier(.25, .1, .25, 1)';
  /* 순서 (2026-10-14)
     열 때:   [다른 사진 밀림 + 사진 커짐] 함께 → (둘 다 끝나면) 설명 나옴
     닫을 때: 설명 닫힘 → (다 닫히면) [사진 작아짐 + 다른 사진 원래대로] 함께
     다른 사진으로 바로 넘어갈 때: 설명 닫힘 → [작아짐 + 밀림·돌아옴 + 커짐] 함께 → 설명 */
  const C = CONFIG.closeDur;
  const shrinkAt = C;                                            // 열려 있던 사진이 작아지기 시작하는 때 (설명이 다 닫힌 뒤)
  const base = (opening && !switching) ? 0 : C;                  // 다른 사진들이 움직이기 시작하는 때 (커짐·작아짐과 함께)
  const top0 = movers.length ? Math.min(...movers.map(m => m.a.top)) : 0;
  let pushEnd = base;
  movers.forEach(({ el, a, b }) => {
    const resized = Math.abs(a.width - b.width) >= 1;                // 열려 있던 사진: 그 자리에서 작아짐
    const delay = resized ? shrinkAt : base + Math.round((a.top - top0) / cellPx()) * CONFIG.pushStep;   // 위에서부터 살짝 차례로
    const dur = resized ? C : CONFIG.pushDur;
    if (!resized) pushEnd = Math.max(pushEnd, delay + dur);
    el.style.transformOrigin = '0 0';
    anims.push(el.animate([{ transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width}, ${a.height / b.height})` }, { transform: 'none' }],
      { duration: dur, delay, easing: ease, fill: 'backwards' }));
    if (CONFIG.heat) heat.track(el, delay + dur + 50, resized);
  });
  setTimeout(revealVisible, Math.max(pushEnd, base + CONFIG.growDur) + 120);   // 움직이는 동안엔 안 불러오고, 멈춘 뒤 새로 보이는 사진만
  if (!focus || !focus.isConnected) return pushEnd;
  const a = before.get(focus), b = focus.getBoundingClientRect();
  const gDelay = base;                                           // 커짐·작아짐은 다른 사진들의 움직임과 함께 시작
  const gDur = opening ? CONFIG.growDur : C;
  focus.style.transformOrigin = '0 0';
  anims.push(focus.animate([
    { transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width})` },
    { transform: 'none' }], { duration: gDur, delay: gDelay, easing: ease, fill: 'backwards' }));
  if (CONFIG.heat) heat.track(focus, gDelay + gDur + 50, true);
  if (opening && infoEl) {
    infoEl.style.setProperty('--info-delay', Math.max(pushEnd, gDelay + gDur) / 1000 + 's');   // 밀림·커짐이 다 끝난 뒤 설명이 나옴
    infoEl.style.setProperty('--info-dur', CONFIG.infoDur / 1000 + 's');
    if (CONFIG.heat) { const ie = infoEl; setTimeout(() => ie.isConnected && heat.track(ie, CONFIG.infoDur + 50, true), Math.max(pushEnd, gDelay + gDur)); }   // 설명이 밀려 나오기 시작할 때부터 열 (그 전엔 숨어 있으므로 열 없음 → 빈 자리에 빨간 네모가 생기지 않게)
  }
  return Math.max(pushEnd, gDelay + gDur);
}
grid.addEventListener('click', e => {
  const it = e.target.closest('.item');
  if (it) { it === openEl ? closeItem() : openItem(it); return; }
  if (!e.target.closest('.info')) closeItem();
});
addEventListener('keydown', e => { if (e.key === 'Escape') { closeItem(); toggleOverview(false); toggleMenu(false); } });

/* ═════════ 개요: 프로젝트 이름 박스 옆에 펼쳐짐 ═════════ */
let ovEl = null, ovRegion = null;
function buildOverview() {
  /* 2026-10-17: 이름 박스는 글 그대로 아래로 늘어나 2×3이 되고, 그 옆에 개요 글 덩어리(2×3)가 따로 펼쳐짐 (높이가 맞음) */
  const { el: nameEl, rect } = boxEls.name;
  ovEl = document.createElement('div');
  ovEl.className = 'overview';
  ovEl.innerHTML = `<div class="ov-text">${SENTENCES.map(s => `<p>${s.replace(/\n/g, '<br>')}</p>`).join('')}</div>`;
  const ovText = ovEl.firstElementChild;
  paint(ovEl, colors.name);
  grid.appendChild(ovEl);
  const { w, h } = OV_OPEN.ov, nw = OV_OPEN.name.w, nh = OV_OPEN.name.h;   // 열렸을 때: 이름 nw×nh, 개요 w×h
  const toRight = rect.c + nw + w - 1 <= 12;                    // 되도록 오른쪽 (이름 박스가 왼쪽에 있으므로)
  ovEl.style.setProperty('--w', w); ovEl.style.setProperty('--h', h);
  ovEl.style.setProperty('--c', toRight ? rect.c + nw : rect.c - w);
  ovEl.style.setProperty('--r', rect.r);
  ovEl.style.setProperty('--closed', toRight ? 'inset(0 100% 0 0)' : 'inset(0 0 0 100%)');   // 이름 박스 쪽에서 펼쳐짐
  nameEl.style.setProperty('--grow', nh - rect.h); nameEl.style.setProperty('--grow-w', nw - rect.w); nameEl.style.setProperty('--w0', rect.w); nameEl.style.setProperty('--h0', rect.h);
  ovRegion = { c: toRight ? rect.c : rect.c - w, r: rect.r, w: nw + w, h: Math.max(nh, h) };   // 늘어난 이름 박스 + 개요 = 밀어낼 자리
  nameEl.addEventListener('click', e => { e.stopPropagation(); toggleOverview(); });
  ovEl.addEventListener('click', e => { e.stopPropagation(); toggleOverview(false); });
  const markMore = () => ovEl.classList.toggle('more', ovText.scrollTop + ovText.clientHeight < ovText.scrollHeight - 2);
  ovText.addEventListener('scroll', markMore, { passive: true });
  ovEl._markMore = markMore;
}
/* 10/18: 사진 열기와 같은 규칙
   열 때:   [이름 박스 늘어남 + 걸친 세로줄 사진들 밀려남] 함께 → 다 끝나면 개요가 옆으로 펼쳐짐

   사진 설명이 열려 있었으면: 설명 접힘 → 위의 '열 때'
   quiet: 사진을 열 때 개요만 접고, 자리 이동은 사진 열기 쪽에서 한꺼번에 */
function toggleOverview(on, quiet) {
  if (!ovEl) return;
  const was = ovEl.classList.contains('on');
  on = on ?? !was;
  if (on === was) return;
  const nameEl = boxEls.name.el, C = CONFIG.closeDur;
  let end = 0, start = 0;
  if (!quiet) {
    if (on) {

      if (prev) heat.fast(2000);
      end = flip(() => { if (prev) closeDom(); restoreAll(); pushArea(ovRegion, null); }, prev ? { focus: prev, opening: false } : { focus: null, opening: true });
      start = prev ? C : 0;
      end = Math.max(end, start + 500);                           // 이름 박스가 늘어나는 0.5초보다 일찍 펼쳐지지 않게
    } else {
      flip(() => restoreAll(), { focus: null, opening: false });  // 개요가 접힌 뒤(C) 사진들이 돌아옴
    }
  }
  nameEl.style.setProperty('--name-delay', start / 1000 + 's');
  ovEl.style.setProperty('--ov-delay', (end || 500) / 1000 + 's');
  if (CONFIG.heat) { const t = on ? (end || 500) + 650 : 1100; heat.track(ovEl, t, true, true); heat.track(nameEl, t, true); }   // 개요가 펼쳐지고 접힐 때 + 이름 박스가 늘어나고 줄어들 때도 열
  if (!on && CONFIG.heat) heat.fast(2000);                         // 개요가 접힐 때도 사진 설명처럼 빨리 식음
  ovEl.classList.toggle('on', on);

  if (on) { ovEl.firstElementChild.scrollTop = 0; ovEl._markMore(); }
}

/* ═════════ 히트맵: 빈 칸으로만 보이는 열화상 ═════════
   마우스가 지나가거나, 밀려나는 아이템이 지나간 자리에 열이 남고 서서히 식음 */
const heat = (() => {
  let fastUntil = 0;
  const S = 0.25;                       // 해상도 (화면의 1/4)
  const canvas = document.getElementById('heat');
  if (!CONFIG.heat) { canvas.remove(); return { track() {} }; }     // 히트맵 끈 버전: 빈 칸은 그냥 검정
  const ctx = canvas.getContext('2d');
  const small = document.createElement('canvas'), sctx = small.getContext('2d');
  let W, H, fw, fh, T, B, M, Q, img, running = false, lastScroll = scrollY, acc = 0;
  const movers = new Map();
  const mouse = { x: 0, y: 0, has: false, trail: [] };
  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = W; canvas.height = H;
    fw = Math.ceil(W * S); fh = Math.ceil(H * S);
    small.width = fw; small.height = fh;
    T = new Float32Array(fw * fh); B = new Float32Array(fw * fh);
    M = new Float32Array(fw * fh); Q = new Float32Array(fw * fh);
    img = sctx.createImageData(fw, fh);
  }
  function add(x, y, w, h, k, soft) {
    const m = soft * 3;
    const x0 = Math.max(0, Math.floor((x - m) * S)), x1 = Math.min(fw - 1, Math.ceil((x + w + m) * S));
    const y0 = Math.max(0, Math.floor((y - m) * S)), y1 = Math.min(fh - 1, Math.ceil((y + h + m) * S));
    for (let j = y0; j <= y1; j++) {
      const py = j / S, dy = Math.max(y - py, 0, py - (y + h));
      for (let i = x0; i <= x1; i++) {
        const px = i / S, dx = Math.max(x - px, 0, px - (x + w));
        const v = Math.exp(-(dx * dx + dy * dy) / (2 * soft * soft));
        if (v < 0.01) continue;
        const n = j * fw + i; T[n] = Math.min(1, T[n] + v * k);
      }
    }
  }
  /* 덩어리 열: 함께 움직이는 사진들을 한 장의 판(M)에 찍고, 크게 흐리게 한 뒤 열로 더함
     → 사진 하나하나의 네모(그리드)가 아니라 한 덩어리의 잔상으로 남음 */
  let massDirty = false;
  function stamp(x, y, w, h, v = 1) {
    const x0 = Math.max(0, Math.floor(x * S)), x1 = Math.min(fw, Math.ceil((x + w) * S));
    const y0 = Math.max(0, Math.floor(y * S)), y1 = Math.min(fh, Math.ceil((y + h) * S));
    if (v >= 1) for (let j = y0; j < y1; j++) M.fill(1, j * fw + x0, j * fw + x1);
    else for (let j = y0; j < y1; j++) for (let i = j * fw + x0, e = j * fw + x1; i < e; i++) if (M[i] < v) M[i] = v;
    if (x1 > x0 && y1 > y0) massDirty = true;
  }
  function stampPad(r, pad, v = 1) { const p = innerWidth / 12 * pad; stamp(r.left - p, r.top - p, r.width + 2 * p, r.height + 2 * p, v); }
  function blur(r) {                    // 가로·세로 상자 흐림 (두 번 = 부드러운 번짐)
    for (let pass = 0; pass < 2; pass++) {
      for (let j = 0; j < fh; j++) {     // 가로 → Q
        const o = j * fw; let s = 0;
        for (let i = -r; i <= r; i++) s += M[o + Math.min(fw - 1, Math.max(0, i))];
        for (let i = 0; i < fw; i++) {
          Q[o + i] = s / (2 * r + 1);
          s += M[o + Math.min(fw - 1, i + r + 1)] - M[o + Math.max(0, i - r)];
        }
      }
      for (let i = 0; i < fw; i++) {     // 세로 → M
        let s = 0;
        for (let j = -r; j <= r; j++) s += Q[Math.min(fh - 1, Math.max(0, j)) * fw + i];
        for (let j = 0; j < fh; j++) {
          M[j * fw + i] = s / (2 * r + 1);
          s += Q[Math.min(fh - 1, j + r + 1) * fw + i] - Q[Math.max(0, j - r) * fw + i];
        }
      }
    }
  }
  function flushMass(k, size = CONFIG.heatBlob) {
    if (!massDirty) return;
    blur(Math.max(1, Math.round(innerWidth / 12 * S * size)));
    for (let n = 0; n < M.length; n++) if (M[n] > 0.01) T[n] = Math.min(1, T[n] + M[n] * k);
    M.fill(0); massDirty = false;
  }
  function color(v) {                    // 검정 → 파랑 → 초록 → 노랑 → 빨강 (heatMax에서 멈춤) — 2026-10-17 다시 이 색으로
    const S = [[0.0, 0, 0, 0], [0.06, 0, 0, 0], [0.285, 30, 40, 220], [0.48, 0, 235, 60], [0.54, 255, 230, 0], [0.585, 235, 0, 10], [0.6, 235, 0, 10], [1, 235, 0, 10]];   // 검정 2 : 파랑 5.5 : 초록 1 : 노랑 1 : 빨강 0.5 (2026-10-14)
    let i = 1; while (i < S.length - 1 && v > S[i][0]) i++;
    const [a, b] = [S[i - 1], S[i]], t = Math.min(1, Math.max(0, (v - a[0]) / (b[0] - a[0])));
    return [a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, a[3] + (b[3] - a[3]) * t];
  }
  function frame() {
    /* 스크롤: 열은 페이지를 일부만 따라감(CONFIG.heatFollow) → 화면 위를 지나가는 아이템이 빈 칸에 잔상을 남김 */
    const dyScroll = scrollY - lastScroll;
    acc += dyScroll * S * CONFIG.heatFollow; lastScroll = scrollY;
    if (dyScroll) {
      const cell = innerWidth / 12, k = CONFIG.heatScroll[0] * Math.min(1, Math.abs(dyScroll) / CONFIG.heatScroll[1]) ** 1.5;
      items.forEach(el => {
        const top = (el._pos.r - 1) * cell - scrollY;
        if (top > H || top + cell < 0) return;
        stamp((el._pos.c - 1) * cell, top, cell, cell);
      });
      Object.values(boxEls).forEach(b => { const r = b.el.getBoundingClientRect(); if (r.bottom > 0 && r.top < H) stamp(r.left, r.top, r.width, r.height); });   // 박스도
      flushMass(k, CONFIG.heatScrollBlob);
    }
    const n = Math.trunc(acc);
    if (n) {
      acc -= n;
      if (Math.abs(n) >= fh) T.fill(0);
      else if (n > 0) { T.copyWithin(0, n * fw); T.fill(0, (fh - n) * fw); }
      else { T.copyWithin(-n * fw, 0, (fh + n) * fw); T.fill(0, 0, -n * fw); }
    }
    /* 마우스 */
    mouse.trail.forEach(p => add(p.x, p.y, 0, 0, p.k, 26));
    mouse.trail.length = 0;
    /* 밀려나는 아이템: 지금 있는 자리 전체에 열 → 빈 칸을 지나가면 그 자리에 자국 */
    const now = performance.now();
    /* 움직이는 아이템 (2026-10-14): 마우스처럼 '지나간 길'에만 열을 남김
       - 매 프레임 직전 자리와 지금 자리를 합친 네모에, 이번 프레임에 움직인 만큼(속도) 열을 찍음
       - 멈춰 있을 때(차례 기다리는 중·다 도착한 뒤)는 열 없음 → 열이 아이템을 따라가며 뒤에서 식음
       - 위치가 안 변하고 잘려 나오기만 하는 것(설명 접힘·개요·태그 판 등, area)은 그 자리 전체에 약하게 */
    const cell = innerWidth / 12, marks = [[], []];
    movers.forEach((m, el) => {
      if (now > m.until || !el.isConnected) { movers.delete(el); return; }
      const r = el.getBoundingClientRect();
      if (m.area) { marks[m.big ? 1 : 0].push([r, CONFIG.heatArea]); return; }
      const cur = { left: r.left, top: r.top + scrollY, right: r.right, bottom: r.bottom + scrollY }, p = m.last;   // 페이지 기준 (스크롤은 움직임으로 안 침)
      m.last = cur;
      if (!p) return;
      const d = Math.abs(cur.left - p.left) + Math.abs(cur.top - p.top) + Math.abs(cur.right - p.right) + Math.abs(cur.bottom - p.bottom);
      if (d < 0.5) return;
      const u = { left: Math.min(p.left, cur.left), top: Math.min(p.top, cur.top) - scrollY };
      u.width = Math.max(p.right, cur.right) - u.left; u.height = Math.max(p.bottom, cur.bottom) - scrollY - u.top;
      marks[m.big ? 1 : 0].push([u, Math.min(1, d / (cell * CONFIG.heatSpeed))]);
    });
    marks.forEach((list, b) => {
      if (!list.length) return;
      list.forEach(([r, v]) => stampPad(r, CONFIG.heatPad[b], v));
      flushMass(CONFIG.heatMove[b]);
    });
    const fastNow = performance.now() < fastUntil;      // 설명이 닫히는 동안만 빨리 식음 (10/17)
    /* 식고 퍼짐 */
    let max = 0;
    for (let j = 0; j < fh; j++) for (let i = 0; i < fw; i++) {
      const k = j * fw + i;
      const l = i > 0 ? T[k - 1] : T[k], r = i < fw - 1 ? T[k + 1] : T[k];
      const u = j > 0 ? T[k - fw] : T[k], d = j < fh - 1 ? T[k + fw] : T[k];
      B[k] = (T[k] * (1 - 4 * CONFIG.heatSpread) + (l + r + u + d) * CONFIG.heatSpread) * (fastNow ? CONFIG.heatCoolFast : T[k] < CONFIG.heatEmber ? 1 - (1 - CONFIG.heatCool) * .4 : CONFIG.heatCool);   // 옅게 남은 열(잔열)은 더 천천히 식음
      if (B[k] > max) max = B[k];
    }
    [T, B] = [B, T];
    const px = img.data;
    for (let k = 0, p = 0; k < T.length; k++, p += 4) {
      const v = T[k];
      if (v < 0.01) { px[p + 3] = 0; continue; }
      const c = color(Math.min(1, v) * CONFIG.heatMax);   // 검정 바탕 위에서 남색 → 파랑 → 보라 → 빨강 (가장 뜨거운 곳 = 빨강, 노랑·흰색은 안 씀)
      px[p] = c[0]; px[p + 1] = c[1]; px[p + 2] = c[2];
      px[p + 3] = 255 * Math.min(1, v / 0.12);
    }
    sctx.putImageData(img, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(small, 0, 0, W, H);
    if (max < 0.004 && !movers.size && !mouse.trail.length && !dyScroll) { T.fill(0); ctx.clearRect(0, 0, W, H); running = false; return; }
    requestAnimationFrame(frame);
  }
  function wake() { if (!running) { running = true; lastScroll = scrollY; acc = 0; requestAnimationFrame(frame); } }
  /* 마우스: 지나간 경로를 따라 열을 남김 (히트맵은 사진·박스 아래 층이라 빈 칸에서만 보임) */
  addEventListener('pointermove', e => {
    const x = e.clientX, y = e.clientY;
    if (mouse.has) {
      const dx = x - mouse.x, dy = y - mouse.y, dist = Math.hypot(dx, dy);
      const steps = Math.max(1, Math.ceil(dist / 10)), k = Math.min(dist / 30, 1) * 0.5;
      for (let s = 1; s <= steps; s++) mouse.trail.push({ x: mouse.x + dx * s / steps, y: mouse.y + dy * s / steps, k: k / steps });
    }
    mouse.x = x; mouse.y = y; mouse.has = true;
    wake();
  }, { passive: true });
  document.addEventListener('pointerleave', () => { mouse.has = false; });
  addEventListener('scroll', () => { if (!running) { running = true; requestAnimationFrame(frame); } }, { passive: true });   // 스크롤도 열을 만듦
  resize();
  addEventListener('resize', resize);
  return { fast(ms) { fastUntil = performance.now() + ms; }, track(el, ms, big = false, area = false) { const o = movers.get(el); movers.set(el, { until: performance.now() + ms, big, area, last: o && o.last }); wake(); } };   // big: 커지고 작아지는 사진
})();

(async function init() {

  /* 사진 목록은 images/colors.js(사진별 평균색, 페이지와 함께 바로 옴)에서 바로 정함 → 시트를 기다리지 않음.
     ① 그리드를 그리면서 사진 칸을 바로 그 사진의 평균색(단색)으로 → ② 사진이 오는 대로 반 → 사진
     시트는 뒤에서 불러와 설명(이름·동사·분야)에만 씀.
     colors.js가 없을 때만 예전처럼 시트의 id를 기다림 (그동안 사진 칸은 검정) */
  const COL = window.IMAGE_COLORS || {};
  let ids = Object.keys(COL).sort();
  const sheetReady = loadSheet();
  if (!ids.length) {
    IMAGES = Array.from({ length: CONFIG.itemCount }, () => ({ src: null, solid: '#000', code: null }));
    build();
    await sheetReady;
    ids = Object.keys(ITEM_DATA).sort();
    if (!ids.length) ids = Array.from({ length: CONFIG.imageCount }, (_, i) => `A${String(i + 1).padStart(4, '0')}`);
  }
  const pool = ids.map((code, i) => ({ src: CONFIG.path(code), solid: COL[code] || SOLID[i % 64 + 1] || '#2a2622', code, pre: !!COL[code] }));
  /* 아이템 1026개: 사진 묶음을 매번 새로 섞어 이어 붙임 (묶음 경계에서 같은 사진이 붙지 않게) */
  const list = [];
  while (list.length < CONFIG.itemCount) {
    const set = shuffle(pool.slice());
    if (list.length && set[0] === list[list.length - 1]) set.push(set.shift());
    list.push(...set);
  }
  list.length = CONFIG.itemCount;
  if (!items.length) { IMAGES = list; build(); }                // colors.js가 있으면 여기서 처음 그림 (바로 평균색)
  else { IMAGES = list; items.forEach((el, i) => { el._data = IMAGES[i]; el.style.setProperty('--solid', IMAGES[i].solid); }); }
  items.forEach((el, i) => { el._i = i; });
  revealVisible();
})();

<script>
/* 2026-10-17 공통: ① 새로고침하면 항상 그 페이지 맨 위에서 시작 (브라우저가 스크롤 자리를 기억하지 않게)
   ② 아무 조작 없이 2분이 지나면 메인 화면 맨 위로 돌아감 (메인이면 맨 위로 올리고 열린 것들을 닫음) */
(() => {
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  addEventListener('load', () => scrollTo(0, 0));
  addEventListener('pageshow', e => { if (e.persisted) scrollTo(0, 0); });
  const IDLE = 2 * 60 * 1000;
  const home = () => { try { return sessionStorage.getItem('haebwaya-home') || 'index.html'; } catch (e) { return 'index.html'; } };
  const onHome = () => { const f = location.pathname.split('/').pop() || 'index.html'; return f === home() || f.startsWith('index'); };
  let t;
  const goHome = () => {
    if (!onHome()) { location.href = home(); return; }
    try { if (typeof closeItem === 'function') closeItem(); if (typeof toggleOverview === 'function') toggleOverview(false); if (typeof toggleMenu === 'function') toggleMenu(false); } catch (e) {}

  const reset = () => { clearTimeout(t); t = setTimeout(goHome, IDLE); };
  ['pointermove', 'pointerdown', 'wheel', 'scroll', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, reset, { passive: true }));
  reset();
})();
</script>
