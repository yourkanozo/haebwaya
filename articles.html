<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아티클 — 폼을 보아하니</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@v2.0/nanumsquare.css">
<style>
  /* ───────── 공통 규칙 (web-rules.md 참고) ───────── */
  :root {
    --cols: 12;
    --cell: calc(100vw / var(--cols));
    --u: calc(100vw / 1920);            /* 1920 화면 기준 1px */
    --gut:      calc(var(--u) * 30);    /* 박스 안쪽 여백 */
    --fs-l:     calc(var(--u) * 25);    /* 큰 글자: 박스 이름, 아이템 이름 */
    --fs-xl:    calc(var(--u) * 40);    /* 숫자 */
    --fs-s:     calc(var(--u) * 15);    /* 작은 글자: 설명, 본문 */
    --lh-s:     calc(var(--u) * 22);
    --ease: cubic-bezier(.3, 0, .2, 1);
    --cold: #000;                       /* 빈 칸 배경 = 검정 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--cold); color: #fff; }
  body {
    font-family: "NanumSquare", -apple-system, sans-serif;
    font-weight: 300;                   /* 전부 라이트 */
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }

  /* ───────── 히트맵: 화면에 고정된 캔버스. 아이템·박스 아래에 깔려서 빈 칸으로만 보임 ───────── */
  #heat { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

  /* ───────── 그리드 ─────────
     박스·빈 칸은 자리를 지정, 아이템은 남은 칸을 왼쪽 위부터 순서대로 채움 */
  .grid {
    position: relative;
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--cell));
    grid-auto-rows: var(--cell);
  }
  .grid > * { position: relative; z-index: 1; }
  .hole { z-index: 0; pointer-events: none; }
  /* 10/22: 단색 꼬리 (메인과 같음) */
  .grid > .tail { position: absolute; z-index: 0; pointer-events: none; }
  .tail > i { position: absolute; inset: 0; background: var(--solid); }      /* 빈 칸: 아무것도 없음 → 아래 히트맵이 보임 */

  /* ───────── 아이템 ───────── */
  .item { cursor: pointer; transform-origin: 0 0; }
  .item::before, .item::after { content: ''; position: absolute; inset: 0; }
  .item::before { background: #111 var(--img) center / cover; }
  /* 로딩 (2026-10-17): 메인과 같음 — 단색 → 사진이 스르륵, 스크롤 중엔 단색 */
  .item::after { background: var(--solid); clip-path: inset(0); transition: clip-path var(--reveal, .6s) var(--ease); }
  .item.done.d-r::after { clip-path: inset(0 0 0 100%); }
  .item.done.d-l::after { clip-path: inset(0 100% 0 0); }
  .item.done.d-d::after { clip-path: inset(100% 0 0 0); }
  .item.done.d-u::after { clip-path: inset(0 0 100% 0); }
  /* 검색·정렬로 바뀔 때: 칸이 한쪽 가장자리로 스르륵 사라지고 / 나타남 */
  .toc-cell { clip-path: inset(0); transition: clip-path .45s var(--ease); }
  .toc-cell.gone.d-r { clip-path: inset(0 0 0 100%); }
  .toc-cell.gone.d-l { clip-path: inset(0 100% 0 0); }
  .toc-cell.gone.d-d { clip-path: inset(100% 0 0 0); }
  .toc-cell.gone.d-u { clip-path: inset(0 0 100% 0); }
  .toc-cell.now, .toc-cell.now::after { transition: none !important; }
  /* 맨 윗줄: 검색 3×1 + 정렬 1×1 (자리 고정, 색은 랜덤) */
  input { font: inherit; color: inherit; background: none; border: 0; }
  .b-search { cursor: text; }
  .b-search .cnt { position: absolute; right: var(--gut); top: var(--gut); font-size: var(--fs-s); line-height: 1; opacity: .7; }
  .b-search input { position: absolute; left: var(--gut); right: var(--gut); bottom: var(--gut); font-size: var(--fs-l); line-height: 1.2; outline: none; border-bottom: 1px solid currentColor; padding-bottom: calc(var(--u) * 6); }
  .b-search input::placeholder { color: inherit; opacity: .5; }
  .b-sort { cursor: pointer; }
  .toc-msg { grid-column: 1 / -1; padding: var(--gut); font-size: var(--fs-s); opacity: .6; }
  .item.open { z-index: 4; cursor: pointer; }   /* 박스를 가려도 됨 */

  /* 상세 설명: 열린 아이템 옆 2×2, 그 사진의 평균색 */
  .info {
    z-index: 3;                         /* 열린 사진(4) 뒤에서 밀려 나옴 */
    background: var(--solid);
    color: var(--fg);
    padding: var(--gut);
    display: flex; flex-direction: column;
    clip-path: inset(0 0 0 0);
    animation: infoIn var(--info-dur, .8s) var(--ease) var(--info-delay, 0s) backwards;
  }
  /* 설명 창은 사진 쪽 가장자리에서 펼쳐짐 */
  .info.from-right  { animation-name: infoIn; }
  .info.from-left   { animation-name: infoInL; }
  .info.from-bottom { animation-name: infoInB; }
  .info.from-top    { animation-name: infoInT; }
  /* 설명 창이 사진 뒤에서 '스르륵' 밀려 나옴: 사진 쪽 가장자리에서 펼쳐지면서 살짝 미끄러져 나옴 */
  @keyframes infoIn  { from { clip-path: inset(0 100% 0 0); transform: translateX(-50%); } }
  @keyframes infoInL { from { clip-path: inset(0 0 0 100%); transform: translateX(50%); } }
  @keyframes infoInB { from { clip-path: inset(0 0 100% 0); transform: translateY(-50%); } }
  @keyframes infoInT { from { clip-path: inset(100% 0 0 0); transform: translateY(50%); } }
  .info .code  { font-size: var(--fs-s); line-height: 1; opacity: .7; }
  .info .name  { font-size: var(--fs-l); line-height: 1.2; margin-top: calc(var(--u) * 14); }
  .info dl     { margin-top: auto; font-size: var(--fs-s); line-height: var(--lh-s); display: grid; grid-template-columns: auto 1fr; column-gap: calc(var(--u) * 16); }
  .info dt     { opacity: .7; }
  .info .desc  { margin-top: calc(var(--u) * 14); font-size: var(--fs-s); line-height: var(--lh-s); }

  /* ───────── 박스 (메뉴) ─────────
     색은 팔레트에서 랜덤, 자리·크기는 고정 (움직이지 않음) */
  .box { color: var(--fg); display: block; z-index: 2; }   /* 밀려나는 아이템은 박스 아래로 지나감 (열린 아이템·설명은 위) */
  /* 예외 규칙 (2026-10-14): 처음 불러올 때 박스는 펼쳐지는 움직임 없이 그냥 '딱' 나타남 (히트맵도 없음). 모든 페이지 같음 */
  .box-in { position: absolute; inset: 0; background: var(--bg); }
  @keyframes boxIn  { from { clip-path: inset(0 100% 100% 0); } to { clip-path: inset(0); } }
  @keyframes boxInR { from { clip-path: inset(0 0 100% 100%); } to { clip-path: inset(0); } }
  .box .t, .box .s, .box .n { position: absolute; line-height: 1; white-space: nowrap; }
  .box .t { left: var(--gut); top: var(--gut); font-size: var(--fs-l); }
  .box .s { right: var(--gut); bottom: var(--gut); font-size: var(--fs-s); display: flex; align-items: center; gap: calc(var(--u) * 10); }
  .box .n { right: var(--gut); bottom: var(--gut); font-size: var(--fs-xl); }
  .box svg { width: calc(var(--u) * 16); height: calc(var(--u) * 16); }
  @keyframes fade { from { opacity: 0; } }

  /* 글 제목 박스: 번호는 왼쪽 위, 제목은 아래 (1칸짜리는 두 줄로) */
  .box .s.ttl { left: var(--gut); white-space: normal; word-break: keep-all; justify-content: flex-start; line-height: 1.35; }
  .box.wide .s.ttl { left: auto; white-space: nowrap; justify-content: flex-end; }   /* 2칸 제목은 오른쪽 아래 (메인 박스 부가설명과 같은 자리) */
  /* 제목 호버 사진 2×2 */
  .peek {
    position: absolute; z-index: 6; pointer-events: none; display: block;
    left: calc(var(--cell) * (var(--c) - 1)); top: calc(var(--cell) * (var(--r) - 1));
    width: calc(var(--cell) * 2); height: calc(var(--cell) * 2);
    background: #111 var(--img) center / cover;
    clip-path: var(--closed);
    transition: clip-path var(--peek-dur, .7s) var(--ease);   /* 다른 사진들이 밀려나는 것과 함께 펼쳐짐 */
  }
  .peek.on { clip-path: inset(0); pointer-events: auto; cursor: pointer; }
  /* 열린 사진을 누르면 글로 이동 → 오른쪽 아래에 '읽기 →' (제목 박스와 같은 색) */
  .peek .go {
    position: absolute; right: 0; bottom: 0;
    height: calc(var(--cell) / 3); padding: 0 calc(var(--u) * 18);
    display: flex; align-items: center; gap: calc(var(--u) * 10);
    background: var(--bg); color: var(--fg); font-size: var(--fs-s); line-height: 1;
  }
  .peek .go svg { width: calc(var(--u) * 16); height: calc(var(--u) * 16); transition: transform .2s var(--ease); }
  .peek:hover .go svg { transform: translateX(calc(var(--u) * 3)); }
  .box[data-toc] { cursor: pointer; }

  /* 개요: 프로젝트 이름을 누르면 박스 옆에 펼쳐짐 (박스 크기는 그대로) */
  .overview {
    position: absolute; z-index: 6;
    left: calc(var(--cell) * (var(--c) - 1)); top: calc(var(--cell) * (var(--r) - 1));
    width: calc(var(--cell) * var(--w)); height: calc(var(--cell) * var(--h));
    background: var(--bg); color: var(--fg);
    padding: var(--gut);
    font-size: var(--fs-s); line-height: var(--lh-s);
    clip-path: var(--closed);
    transition: clip-path .75s var(--ease);
    pointer-events: none;
  }
  .overview.on { clip-path: inset(0); pointer-events: auto; }
  /* 글은 안쪽 칸(.ov-text)에서만 스크롤 → 스크롤해도 상하좌우 여백(30)이 항상 같게 유지됨
     아래에 글이 더 남아 있으면 글의 아래쪽이 살짝 흐려짐 */
  .overview { word-break: keep-all; overflow: hidden; }
  .ov-text { height: 100%; overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain; }
  .ov-text::-webkit-scrollbar { display: none; }
  .overview.more .ov-text { -webkit-mask-image: linear-gradient(#000 calc(100% - var(--u) * 44), transparent); mask-image: linear-gradient(#000 calc(100% - var(--u) * 44), transparent); }
  .overview p + p { margin-top: var(--lh-s); }
  /* 개요가 열리면 이름 박스가 글 그대로 아래로 늘어나 개요(2×3)와 높이가 맞음 (2026-10-17) */
  .box-name { z-index: 7; align-self: start; height: calc(var(--cell) * var(--h0, 1)); transition: height .75s var(--ease); }
  .box-name.ov-on { height: calc(var(--cell) * (var(--h0, 1) + var(--grow, 2))); }
  .overview { z-index: 8; }

  /* ───────── 스크롤하면 나오는 접이식 메뉴 '폼을 보아하니' (위쪽 정가운데, 화면에서 살짝 띄움) ─────────
     그림자는 묶음(.dock) 전체에 아주 옅게 → 아이템 위에서 분리돼 보임 */
  .dock {
    position: fixed; z-index: 20;
    --float: calc(var(--u) * 24);
    top: var(--float); left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
    filter: drop-shadow(0 calc(var(--u) * 4) calc(var(--u) * 10) rgba(0, 0, 0, .28));
    pointer-events: none;
  }
  .fab, .menu a, .menu button {
    width: calc(var(--cell) * 1.5); height: calc(var(--cell) / 2);
    background: var(--bg); color: var(--fg);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--gut);
    font-size: var(--fs-s);
  }
  .fab {
    clip-path: inset(0 0 100% 0);                /* 위에서 아래로 펼쳐지며 나타남 */
    transition: clip-path .5s var(--ease);
    pointer-events: auto;
  }
  .fab:not(.show) { pointer-events: none; }
  .fab.show { clip-path: inset(0); }
  .fab svg { width: calc(var(--u) * 16); height: calc(var(--u) * 16); transition: transform .3s var(--ease); }
  .fab.open svg { transform: rotate(180deg); }
  .menu { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .menu a, .menu button {
    clip-path: inset(0 0 100% 0);
    transition: clip-path .45s var(--ease) calc(var(--i) * 60ms);
  }
  .menu.on { pointer-events: auto; }
  .menu.on a, .menu.on button { clip-path: inset(0); }
  .menu svg { width: calc(var(--u) * 14); height: calc(var(--u) * 14); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  }
  /* ───────── 메뉴 = 햄버거 아이콘 (2026-10-14): 모든 페이지 같은 자리. 오른쪽 위, 화면 가장자리에서 24만큼 띄움 ─────────
     누르면 아래로 메뉴가 펼쳐지고 아이콘은 ×로 바뀜 */
  .dock { left: auto !important; right: calc(var(--u) * 24) !important; transform: none !important; align-items: flex-end !important; }
  .fab { width: calc(var(--cell) / 2) !important; padding: 0 !important; justify-content: center !important; }
  .fab svg { width: calc(var(--u) * 22) !important; height: calc(var(--u) * 22) !important; transform: none !important; }
  .fab .i-x { display: none; }
  .fab.open .i-x { display: block; }
  .fab.open .i-ham { display: none; }
  /* 맨 위로 ↑: 반 칸 이상 스크롤하면 화면 가운데 아래 (모든 페이지 공통, 메뉴와 같은 크기·간격·그림자) */
  .to-top { position: fixed; z-index: 20; left: 50%; bottom: calc(var(--u) * 24); transform: translateX(-50%);
            width: calc(var(--cell) / 2); height: calc(var(--cell) / 2); display: flex; align-items: center; justify-content: center;
            background: var(--bg); color: var(--fg); border: 0; cursor: pointer; filter: drop-shadow(0 calc(var(--u) * 4) calc(var(--u) * 10) rgba(0,0,0,.28));
            clip-path: inset(100% 0 0 0); transition: clip-path .5s var(--ease); pointer-events: none; }
  .to-top.show { clip-path: inset(0); pointer-events: auto; }
  .to-top svg { width: calc(var(--u) * 22); height: calc(var(--u) * 22); }

  /* ───────── 메뉴 = 화면 오른쪽 끝의 세로 인덱스 탭 (2026-10-15) ─────────
     햄버거 칸도 메뉴 칸과 같은 크기(1.5칸 × 반 칸)로 화면 오른쪽 끝에 붙어, 옆에서 밀려 나옴.
     누르면 홈·아티클·탐색 칸이 그 아래로 하나씩 옆에서 밀려 나와 이어짐 */
  .dock { right: 0 !important; }
  .fab { width: calc(var(--cell) * 1.5) !important; justify-content: flex-start !important; padding: 0 var(--gut) !important;
         clip-path: none !important; transform: translateX(100%); transition: transform .5s var(--ease) !important; }
  .fab.show { transform: none; }
  /* 2026-10-17: 메뉴 칸은 햄버거 칸 밑에서 아래로 펼쳐짐 — 사진이 밀려 내려가는 움직임과 같음 (같은 곡선·0.7초·칸마다 0.04초 차례) */
  .fab { position: relative; z-index: 2; }
  .menu { align-items: flex-end !important; position: relative; z-index: 1; overflow: hidden; }
  .menu a, .menu button { width: calc(var(--cell) * 1.5) !important; height: calc(var(--cell) / 2) !important;
    clip-path: none !important; position: relative; z-index: calc(10 - var(--i)); transform: translateY(calc(-100% * (var(--i) + 1)));   /* 위 칸이 아래 칸을 덮은 채로 차례로 펼쳐짐 */
    transition: transform .7s cubic-bezier(.25, .1, .25, 1) calc(var(--i) * 40ms) !important; }
  .menu.on a, .menu.on button { transform: none; }
  /* 11/8: EASTARJET Heavy (이스타항공·윤디자인, 산돌구름 무료 서체 — 받은 파일 그대로) — 프로젝트 이름 '폼을 보아하니'에만. 나머지는 나눔스퀘어 라이트 */
  @font-face { font-family: "EASTARJET"; src: url("fonts/EASTARJET-Heavy.otf") format("opentype"); font-weight: 900; font-display: swap; }
  .box-name .t, .b-name .t { font-family: "EASTARJET", "NanumSquare", -apple-system, sans-serif; font-weight: 900; }

  /* 11/10: '탐색'·'아티클' 박스 이름도 제목 서체로, 한 단계 가벼운 Medium */
  @font-face { font-family: "EASTARJET"; src: url("fonts/EASTARJET-Medium.otf") format("opentype"); font-weight: 500; font-display: swap; }
  .box-article .t, .box-explore .t, .b-art .t, .b-exp .t { font-family: "EASTARJET", "NanumSquare", -apple-system, sans-serif; font-weight: 500; }
  /* ═════════ 모바일 (11/10): 폭 700px 이하 → 가로 3칸, 글자는 일반적인 폰 크기 ═════════ */
  @media (max-width: 700px) {
    :root { --cols: 3; --u: calc(100vw / 540); --gut: 14px; --fs-l: 20px; --fs-xl: 28px; --fs-s: 14px; --lh-s: 21px; }
    .fab, .menu a, .menu button { width: var(--cell) !important; height: 44px !important; padding: 0 var(--gut) !important; font-size: 14px; }
    .fab svg { width: 18px !important; height: 18px !important; }
    .menu svg { width: 10px; height: 10px; }
    .dock { filter: none !important; }
    .dock:has(.fab.show) { filter: drop-shadow(0 2px 6px rgba(0,0,0,.28)) !important; }   /* 11/10: 그림자는 메뉴 전체에 하나만 (칸마다 따로 지지 않게). 숨어 있을 땐 없음 */
    .box svg { width: 10px; height: 10px; }
    .to-top { width: 44px; height: 44px; bottom: calc(16px + env(safe-area-inset-bottom)); }
    .to-top svg { width: 18px; height: 18px; }
    .item:active::before { filter: brightness(1.15); }
  }
  @media (max-width: 700px) {
    .box .s.ttl { white-space: normal; }
  }
</style>
<script src="images/colors.js"></script>
<script src="images/sheet_data.js"></script>   <!-- 인터넷이 안 될 때 쓰는 시트 사본 (시트_업데이트.command로 갱신) -->   <!-- 사진별 평균색 (없으면 임시 색) -->
</head>
<body>

<canvas id="heat"></canvas>
<main class="grid" id="grid"></main>

<div class="dock">
  <button class="fab" id="fab" type="button" aria-label="메뉴 열기"><svg class="i-ham" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 6h16M3 11h16M3 16h16"/></svg><svg class="i-x" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="m5 5 12 12M17 5 5 17"/></svg></button>
  <nav class="menu" id="menu"></nav>
</div>

<button class="to-top" id="toTop" type="button" aria-label="맨 위로"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M11 19V3M4 10l7-7 7 7"/></svg></button>
<script>
/* ═════════ 설정 ═════════ */
const CONFIG = {
  imageCount: 64,
  itemCount: 1026,           // 아이템 수 (지금은 사진 64장을 반복해서 채움)

let tails = [], anims = [];   // 10/22: 단색 꼬리용 (목차에서 글로 넘어갈 때 당겨지는 사진)
/* 단색 꼬리 (10/22, 영상 레퍼런스): 출발 자리(a)와 도착 자리(b)를 합친 띠를 그 사진의 평균색으로 깔고,
   바깥 상자는 앞쪽 끝을, 안쪽 상자는 뒤쪽 끝을 잘라 냄 → 앞쪽 끝은 사진과 함께 먼저, 뒤쪽 끝은 늦게 출발해 따라옴.

const TAIL = { front: .643, back: .214 };                       // 0.7초 기준: 앞쪽 끝 0~0.45초, 뒤쪽 끝 0.15~0.7초
function makeTail(el, a, b, delay, dur, ease) {
  const g = grid.getBoundingClientRect();
  const L = Math.min(a.left, b.left), T = Math.min(a.top, b.top), R = Math.max(a.right, b.right), B = Math.max(a.bottom, b.bottom);
  const W = R - L, H = B - T;
  const t = document.createElement('div'); t.className = 'tail';
  t.style.cssText = `left:${L - g.left}px; top:${T - g.top}px; width:${W}px; height:${H}px; --solid:${getComputedStyle(el).getPropertyValue('--solid')}`;
  const inner = document.createElement('i'); t.appendChild(inner);
  grid.appendChild(t); tails.push(t);
  /* 자리별 잘라 낼 양: 상자 안에서 a·b가 차지하지 않는 쪽 */
  const cut = r => [r.top - T, R - r.right, B - r.bottom, r.left - L];   // inset(위 오른 아래 왼)
  const ca = cut(a), cb = cut(b);

  const dy = b.top - a.top, dx = b.left - a.left;
  if (Math.abs(dy) >= Math.abs(dx)) { if (dy > 0) { lead[2] = 1; trail[0] = 1; } else { lead[0] = 1; trail[2] = 1; } }
  else { if (dx > 0) { lead[1] = 1; trail[3] = 1; } else { lead[3] = 1; trail[1] = 1; } }

/* ═════════ 로딩 (2026-10-17): 메인과 같음 — 멈춰 있을 때만 사진을 불러와 스르륵 (레이지 로드) ═════════ */

/* ═════════ 히트맵: 빈 칸으로만 보이는 열화상 ═════════
   마우스가 지나가거나, 밀려나는 아이템이 지나간 자리에 열이 남고 서서히 식음 */
const heat = (() => {

    const h = MOBILE ? Math.max(innerHeight, screen.height || 0) : innerHeight;

    for (let j = y0; j <= y1; j++) {

      if (r.top >= B.bottom - 1 || r.bottom <= B.top + 1) return;         // 같은 줄(세로로 겹치는 것)만
      if (toLeft ? r.left < B.right - 1 : r.right > B.left + 1) return;    // 접히는 반대편만
      const dx = toLeft ? -W : W, gap = toLeft ? r.left - B.right : B.left - r.right;
      const delay = Math.round(gap / cell()) * LEAVE.step;
      let move = LEAVE.dur;
      if (e.classList.contains('item') && typeof makeTail === 'function') {   // 사진: 사진 밀림과 같은 단색 꼬리
        const to = { left: r.left + dx, right: r.right + dx, top: r.top, bottom: r.bottom, width: r.width, height: r.height };
        try { move = makeTail(e, r, to, delay, LEAVE.dur, LEAVE.ease); } catch (_) {}
      }
      e.animate([{ transform: 'none' }, { transform: `translateX(${dx}px)` }], { duration: move, delay, easing: LEAVE.ease, fill: 'forwards' });
      if (hasHeat) heat.track(e, delay + LEAVE.dur + 50);
      last = Math.max(last, delay);
    });
    setTimeout(() => { location.href = href; }, Math.max(wait, Math.max(LEAVE.dur, last + LEAVE.dur * .6) + 40));
  }
  /* 11/7: 박스를 누르면 누른 박스는 그대로 두고, 화면에 보이는 다른 박스·사진이 그 박스 쪽으로 접히며 밑으로 들어감
     (같은 줄은 가로로, 같은 열은 세로로, 대각선은 더 먼 쪽 축으로. 가까운 것부터 차례로). 아티클 목차의 글 줄은 위 leaveFold 그대로 */
  function gatherInto(box, href, opt = {}) {
    if (box._leaving) return;
    box._leaving = true;
    const B = box.getBoundingClientRect(), c = cell(), MAX = opt.max || 3;
    if (getComputedStyle(box).position === 'static') box.style.position = 'relative';
    box._z = box.style.zIndex; box.style.zIndex = 40;
    const hasHeat = typeof heat !== 'undefined' && heat && typeof heat.track === 'function';
    /* 11/7: 위·아래·왼쪽·오른쪽 각각 바로 붙은 쪽으로 많아야 2~3개만 (같은 줄/같은 열, 4칸 안). 대각선·먼 것은 그대로 */
    const side = { l: [], r: [], u: [], d: [] };
    (opt.only || document.querySelectorAll('.box, .item')).forEach(e => {
      if (e === box || e.contains(box) || box.contains(e) || e.closest('#menu, .dock')) return;
      const cs = getComputedStyle(e); if (cs.position === 'fixed' || cs.display === 'none' || cs.visibility === 'hidden') return;
      const r = e.getBoundingClientRect();
      if (!r.width || !r.height || r.bottom < 0 || r.top > innerHeight || r.right < 0 || r.left > innerWidth) return;
      const row = r.top < B.bottom - 1 && r.bottom > B.top + 1, col = r.left < B.right - 1 && r.right > B.left + 1;
      if (row && r.left >= B.right - 1) side.r.push({ e, r, gap: r.left - B.right });
      else if (row && r.right <= B.left + 1) side.l.push({ e, r, gap: B.left - r.right });
      else if (col && r.top >= B.bottom - 1) side.d.push({ e, r, gap: r.top - B.bottom });
      else if (col && r.bottom <= B.top + 1) side.u.push({ e, r, gap: B.top - r.bottom });
    });
    let last = 0;
    Object.entries(side).forEach(([k, list]) => {
      list.sort((a, b) => a.gap - b.gap).filter(x => opt.only || x.gap < c * 4).slice(0, opt.only ? Infinity : MAX).forEach(({ e, r, gap }) => {
        const to = k === 'r' ? { transform: `translateX(${B.right - r.left}px)`, clipPath: 'inset(0 100% 0 0)' }
                 : k === 'l' ? { transform: `translateX(${B.left - r.right}px)`, clipPath: 'inset(0 0 0 100%)' }
                 : k === 'd' ? { transform: `translateY(${B.bottom - r.top}px)`, clipPath: 'inset(0 0 100% 0)' }
                 :             { transform: `translateY(${B.top - r.bottom}px)`, clipPath: 'inset(100% 0 0 0)' };
        const delay = Math.round(gap / c) * LEAVE.step;
        e.animate([{ transform: 'none', clipPath: 'inset(0 0 0 0)' }, to], { duration: LEAVE.dur, delay, easing: LEAVE.ease, fill: 'forwards' });
        if (hasHeat) heat.track(e, delay + LEAVE.dur + 50);
        last = Math.max(last, delay);
      });
    });
    setTimeout(() => { location.href = href; }, Math.max(opt.wait || 0, last + LEAVE.dur + 60));
  }
  window.gatherInto = gatherInto;
  window.leaveFold = leaveFold;                                              // 아티클 목차의 글 줄에서도 씀
  document.addEventListener('click', e => {
    const a = e.target.closest('a.box[href]');
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target === '_blank') return;
    const href = a.getAttribute('href'); if (!href || href.startsWith('#')) return;
    /* 11/7: 일반 박스는 아무것도 접히지 않고 바로 이동 (아티클 목차 줄·메뉴만 따로 움직임) */
  });
  /* 메뉴 (11/7): 누른 칸이 맨 위 칸 자리로 올라오고, 나머지 칸은 내려왔던 길 그대로 위로 접혀 올라간 뒤 이동 */
  document.addEventListener('click', e => {
    const a = e.target.closest('#menu a[href]');
    if (!a || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault(); e.stopPropagation();
    if (a._leaving) return; a._leaving = true;
    const m = document.getElementById('menu'), f = document.getElementById('fab');
    const i = m ? [...m.children].indexOf(a) : 0, n = m ? m.children.length : 3;
    a.style.zIndex = 20;
    a.style.transform = `translateY(${-100 * i}%)`;                         // 맨 위 칸 자리로
    if (m) m.classList.remove('on'); if (f) f.classList.remove('open');
    setTimeout(() => { location.href = a.href; }, 700 + n * 40 + 60);
  }, true);
  addEventListener('pageshow', e => {                                         // 뒤로가기로 돌아왔을 때 접힌 채로 남지 않게
    if (!e.persisted) return;
    document.getAnimations().forEach(x => x.cancel());
    document.querySelectorAll('.tail').forEach(t => t.remove());
    document.querySelectorAll('a.box').forEach(b => { b._leaving = false; b.style.overflow = ''; if ('_z' in b) { b.style.zIndex = b._z; delete b._z; } });
    const m = document.getElementById('menu'), f = document.getElementById('fab');
    if (m) { m.classList.remove('on'); m.querySelectorAll('a').forEach(x => { x._leaving = false; x.style.visibility = ''; x.style.transform = ''; x.style.zIndex = ''; if (x._clone) { x._clone.remove(); x._clone = null; } }); } if (f) f.classList.remove('open');
  });
})();
</script>
<script>
/* ═════════ 박스로 이동 (11/7): 누른 박스 안만 비슷한 색 단색 면이 네 방향 중 하나에서 덮은 뒤 이동. 다른 박스·사진은 건드리지 않음 ═════════ */
(() => {
  const DUR = 380, EASE = 'cubic-bezier(.4, 0, .2, 1)';
  function cover(box, color) {
    const c = document.createElement('i');
    c.className = 'sweep';
    c.style.cssText = `position:absolute; inset:0; z-index:5; pointer-events:none; background:${color}`;
    if (getComputedStyle(box).position === 'static') box.style.position = 'relative';
    box.style.overflow = 'hidden';
    box.appendChild(c);
    return c;
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('a.box[href]');
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target === '_blank') return;
    const href = a.getAttribute('href'); if (!href || href.startsWith('#')) return;
    e.preventDefault();
    if (a._leaving) return; a._leaving = true;
    const c = cover(a, 'color-mix(in srgb, var(--bg) 45%, var(--fg))');   // 박스 색과 글자 색 사이 단색
    const from = ['inset(0 100% 0 0)', 'inset(0 0 0 100%)', 'inset(0 0 100% 0)', 'inset(100% 0 0 0)'][Math.floor(Math.random() * 4)];   // 왼쪽·오른쪽·위·아래 중 하나에서 덮음
    c.animate([{ clipPath: from }, { clipPath: 'inset(0 0 0 0)' }], { duration: DUR, easing: EASE, fill: 'forwards' });
    setTimeout(() => { location.href = a.href; }, DUR + 40);
  });
  addEventListener('pageshow', e => {
    if (!e.persisted) return;
    document.querySelectorAll('.sweep').forEach(s => s.remove());
    document.querySelectorAll('a.box').forEach(b => { b._leaving = false; });
  });
})();
</script>
</body>
