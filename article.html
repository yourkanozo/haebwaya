<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아티클 — 폼을 보아하니</title>
<link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">   <!-- 11/14: 탭 아이콘 (바탕 없이 검정 '폼'만) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@v2.0/nanumsquare.css">
<style>
  /* ───────── 아티클 글 (web-rules.md 4-3) ─────────
     검정 배경만 (사진 그리드·히트맵 없음). 가운데 한 단: 글 4칸, 사진은 4·6·8칸 중 사진마다.
     왼쪽 여백에 작은 목차가 따라옴. 맨 아래 이전 글 / 다음 글 */
  :root {
    --cell: calc(100vw / 12);
    --u: calc(100vw / 1920);
    --gut:  calc(var(--u) * 30);
    --fs-l: calc(var(--u) * 25);         /* 큰 글자: 박스 이름, 소제목 */
    --fs-s: calc(var(--u) * 15);         /* 작은 글자: 본문, 캡션, 목차 */
    --lh-s: calc(var(--u) * 22);
    --fs-xl: calc(var(--u) * 40);        /* 숫자 크기 = 글 제목 */
    --ease: cubic-bezier(.3, 0, .2, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; color: #fff; }
  body { font-family: "NanumSquare", -apple-system, sans-serif; font-weight: 300; word-break: keep-all; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
  #heat { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
  .page { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(12, var(--cell)); grid-template-rows: auto auto auto 1fr; min-height: 100vh; }

  /* 박스: 목차 페이지와 같음 (이름 2×1 왼쪽 위, 아티클 1×1 그 오른쪽) */
  .box { position: relative; height: var(--cell); background: var(--bg); color: var(--fg); display: block; }
  .box .t { position: absolute; left: var(--gut); top: var(--gut); font-size: var(--fs-l); line-height: 1; white-space: nowrap; }
  .box .s { position: absolute; right: var(--gut); bottom: var(--gut); font-size: var(--fs-s); line-height: 1; white-space: nowrap; display: flex; gap: calc(var(--u) * 10); align-items: center; }
  .box svg { width: calc(var(--u) * 16); height: calc(var(--u) * 16); }
  .box.left .s { right: auto; left: var(--gut); }
  .box.off { opacity: .35; pointer-events: none; }
  .b-name { grid-column: 1 / span 2; grid-row: 1; }
  .b-art  { grid-column: 3 / span 1; grid-row: 1; }

  /* 제목부: 가운데 */
  .head { grid-column: 4 / span 6; grid-row: 2; text-align: center; padding: calc(var(--cell) * .25) 0 calc(var(--cell) * .4); }   /* 11/11: 제목을 위로 (위 여백 1칸 → .25칸) */
  .head .no   { font-size: var(--fs-l); line-height: 1; opacity: .6; }
  .head h1    { font-weight: 300; font-size: var(--fs-xl); line-height: 1.3; margin-top: calc(var(--u) * 20); }
  .head .meta { font-size: var(--fs-s); line-height: 1; opacity: .6; margin-top: calc(var(--u) * 24); }
  .head .dek  { font-size: var(--fs-s); line-height: 1; margin-top: calc(var(--u) * 10); }   /* 분야 · 영문 이름 (매거진 소칼럼) */
  .flow > p.lead { font-size: var(--fs-l); line-height: 1.6; margin-bottom: var(--lh-s); text-align: center; }   /* 리드: 본문보다 한 단계 크게 */

  /* 본문: 글 5~8칸(4칸), 사진은 가운데 정렬로 4·6·8칸 */
  .flow { grid-column: 1 / -1; grid-row: 3; display: grid; grid-template-columns: repeat(12, var(--cell)); font-size: var(--fs-s); line-height: var(--lh-s); }
  .flow { padding-bottom: calc(var(--cell) * 1.5); }   /* 11/14: 글 끝 아래 여백 1.5칸 — 마지막 줄이 맨 위로 버튼에 가리지 않게 */
  .flow > p, .flow > h2, .flow > .soon { grid-column: 5 / span 4; }
  .flow > p + p { margin-top: var(--lh-s); }
  .flow > h2 { font-weight: 300; font-size: var(--fs-l); line-height: 1.4; margin: calc(var(--lh-s) * 4) 0 var(--lh-s); scroll-margin-top: calc(var(--cell) * .9); }
  .flow > h2 small { display: block; font-size: var(--fs-s); line-height: var(--lh-s); opacity: .6; margin-top: calc(var(--u) * 6); }
  .flow > figure { margin: calc(var(--lh-s) * 5) 0; }
  .flow > figure:first-child { margin-top: calc(var(--lh-s) * 1.5); }   /* 11/8: 리드를 뺐으니 글은 사진부터 시작 — 제목 덩어리 바로 아래 */
  /* 섹션은 사진 → 소제목 → 글 순서: 사진이 섹션 첫머리라 위를 넓게, 소제목은 사진 바로 아래 */
  .flow > figure:has(+ h2) { margin-top: calc(var(--lh-s) * 4); margin-bottom: calc(var(--lh-s) * 1.5); }
  .flow > figure + h2 { margin-top: 0; }
  .flow > figure.w4 { grid-column: 5 / span 4; }
  .flow > figure.w6 { grid-column: 4 / span 6; }
  .flow > figure.w8 { grid-column: 3 / span 8; }
  figure img { width: 100%; display: block; aspect-ratio: var(--ar, 4 / 3); object-fit: cover; background: #111; }
  figcaption { font-size: var(--fs-s); line-height: var(--lh-s); opacity: .6; margin-top: calc(var(--u) * 12); text-align: center; }
  .soon { opacity: .6; text-align: center; padding: var(--cell) 0; }

  /* 왼쪽 목차: 1~2칸, 스크롤해도 따라옴. 지금 읽는 소제목이 진하게 */
  .toc { grid-column: 1 / span 2; grid-row: 3; padding: 0 var(--gut); position: relative; z-index: 2; }
  .toc ol { position: sticky; top: calc(var(--cell) * .9); list-style: none; font-size: var(--fs-s); line-height: var(--lh-s); }
  .toc li + li { margin-top: calc(var(--u) * 10); }
  .toc a { display: flex; gap: calc(var(--u) * 12); opacity: .45; transition: opacity .3s var(--ease); }
  .toc a:hover, .toc a.on { opacity: 1; }
  .toc b { font-weight: 300; min-width: calc(var(--u) * 18); }

  /* 이전 글 / 다음 글: 본문 폭 아래 2×1 두 개 */
  /* 11/8: 이전 글 / 다음 글 — 화면 양옆(1열·12열)에 1×1로 작게 고정. 어디까지 읽었든 바로 넘어갈 수 있게.
     세로는 화면 맨 아래 */
  .pager { display: contents; }
  .pager .box { position: fixed; z-index: 15; width: var(--cell); height: var(--cell);
                bottom: 0; }   /* 11/8: 화면 맨 아래 양 끝 */
  .pager .box.left { left: 0; }
  .pager .box:not(.left) { right: 0; }
  .pager .box .t { font-size: var(--fs-s); }
  .pager .box.off { opacity: .25; }

  /* 스크롤 메뉴: 메인·목차와 같음 (위쪽 정가운데, 살짝 띄움) */
  .dock { position: fixed; z-index: 20; --float: calc(var(--u) * 24); top: var(--float); left: 50%; transform: translateX(-50%);
          display: flex; flex-direction: column; align-items: center; filter: drop-shadow(0 calc(var(--u) * 4) calc(var(--u) * 10) rgba(0,0,0,.28)); pointer-events: none; }
  .fab, .menu a, .menu button { width: calc(var(--cell) * 1.5); height: calc(var(--cell) / 2); background: var(--bg); color: var(--fg);
          display: flex; align-items: center; justify-content: space-between; padding: 0 var(--gut); font-size: var(--fs-s); }
  .fab { clip-path: inset(0 0 100% 0); transition: clip-path .5s var(--ease); pointer-events: auto; }
  .fab:not(.show) { pointer-events: none; }
  .fab.show { clip-path: inset(0); }
  .fab svg { width: calc(var(--u) * 16); height: calc(var(--u) * 16); transition: transform .3s var(--ease); }
  .fab.open svg { transform: rotate(180deg); }
  .menu { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .menu a, .menu button { clip-path: inset(0 0 100% 0); transition: clip-path .45s var(--ease) calc(var(--i) * 60ms); }
  .menu.on { pointer-events: auto; }
  .menu.on a, .menu.on button { clip-path: inset(0); }
  .menu svg { width: calc(var(--u) * 14); height: calc(var(--u) * 14); }

  /* 들어올 때: 박스는 모서리에서 펼쳐지고 글은 서서히 */
  /* 예외 규칙: 처음 불러올 때 박스는 움직임 없이 그냥 나타남 */
  @keyframes boxIn { from { clip-path: inset(0 100% 100% 0); } to { clip-path: inset(0); } }
  .head, .flow, .toc { animation: fade .6s ease-out .4s backwards; }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
  /* ───────── 메뉴 = 햄버거 아이콘 (2026-10-14): 모든 페이지 같은 자리. 오른쪽 위, 화면 가장자리에서 24만큼 띄움 ─────────
     누르면 아래로 메뉴가 펼쳐지고 아이콘은 ×로 바뀜 */
  .dock { left: auto !important; right: calc(var(--u) * 24) !important; transform: none !important; align-items: flex-end !important; }
  .fab { width: calc(var(--cell) / 2) !important; padding: 0 !important; justify-content: center !important; }
  .fab svg { width: calc(var(--u) * 22) !important; height: calc(var(--u) * 22) !important; transform: none !important; }
  .fab .i-x { display: none; }
  .fab.open .i-x { display: block; }
  .fab.open .i-ham { display: none; }
  /* 맨 위로 ↑: 반 칸 이상 스크롤하면 화면 가운데 아래 (모든 페이지 공통, 메뉴와 같은 크기·간격·그림자) */
  .to-top { position: fixed; z-index: 20; left: 50%; bottom: calc(var(--u) * 24); transform: translateX(-50%);
            width: calc(var(--cell) / 2); height: calc(var(--cell) / 2); display: flex; align-items: center; justify-content: center;
            background: var(--bg); color: var(--fg); border: 0; cursor: pointer; filter: drop-shadow(0 calc(var(--u) * 4) calc(var(--u) * 10) rgba(0,0,0,.28));
            clip-path: inset(100% 0 0 0); transition: clip-path .5s var(--ease); pointer-events: none; }
  .to-top.show { clip-path: inset(0); pointer-events: auto; }
  .to-top svg { width: calc(var(--u) * 22); height: calc(var(--u) * 22); }

  /* ───────── 메뉴 = 화면 오른쪽 끝의 세로 인덱스 탭 (2026-10-15) ─────────
     햄버거 칸도 메뉴 칸과 같은 크기(1.5칸 × 반 칸)로 화면 오른쪽 끝에 붙어, 옆에서 밀려 나옴.
     누르면 홈·아티클·탐색 칸이 그 아래로 하나씩 옆에서 밀려 나와 이어짐 */
  .dock { right: 0 !important; }
  .fab { width: calc(var(--cell) * 2) !important;   /* 11/14: 메뉴 가로 두 칸 */ justify-content: flex-start !important; padding: 0 var(--gut) !important;
         clip-path: none !important; transform: translateX(100%); transition: transform .5s var(--ease) !important; }
  .fab.show { transform: none; }
  /* 2026-10-17: 메뉴 칸은 햄버거 칸 밑에서 아래로 펼쳐짐 — 사진이 밀려 내려가는 움직임과 같음 (같은 곡선·0.7초·칸마다 0.04초 차례) */
  .fab { position: relative; z-index: 2; }
  .menu { align-items: flex-end !important; position: relative; z-index: 1; overflow: hidden; }
  .menu a, .menu button { width: calc(var(--cell) * 2) !important; height: calc(var(--cell) / 2) !important;
    clip-path: none !important; position: relative; z-index: calc(10 - var(--i)); transform: translateY(calc(-100% * (var(--i) + 1)));   /* 위 칸이 아래 칸을 덮은 채로 차례로 펼쳐짐 */
    transition: transform .7s cubic-bezier(.25, .1, .25, 1) calc(var(--i) * 40ms) !important; }
  .menu.on a, .menu.on button { transform: none; }
  /* 11/8: EASTARJET Heavy (이스타항공·윤디자인, 산돌구름 무료 서체 — 받은 파일 그대로) — 프로젝트 이름 '폼을 보아하니'와 아티클 글 제목에만. 나머지는 나눔스퀘어 라이트 */
  @font-face { font-family: "EASTARJET"; src: url("fonts/EASTARJET-Heavy.otf") format("opentype"); font-weight: 900; font-display: swap; }
  .box-name .t, .b-name .t, .head h1 { font-family: "EASTARJET", "NanumSquare", -apple-system, sans-serif; font-weight: 900; }
  .menu a.here { cursor: default; }   /* 11/14: 지금 있는 페이지 메뉴 칸 */
  .menu a:first-child span { font-family: "EASTARJET", "NanumSquare", -apple-system, sans-serif; font-weight: 900; }   /* 11/14: 메뉴 '폼을 보아하니'는 제목 서체 */
  .menu a:not(:first-child) span { font-weight: 700; }   /* 탐색·아티클은 굵게 */
  @media (min-width: 701px) { .menu a span { font-size: var(--fs-l); } }   /* 11/14: 메뉴 글자 키움 (데스크톱) */
</style>
</head>
<body>
<canvas id="heat"></canvas>
<div class="page" id="page"></div>
<div class="dock">
  <button class="fab" id="fab" type="button" aria-label="메뉴 열기"><svg class="i-ham" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 6h16M3 11h16M3 16h16"/></svg><svg class="i-x" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="m5 5 12 12M17 5 5 17"/></svg></button>
  <nav class="menu" id="menu"></nav>
</div>
<button class="to-top" id="toTop" type="button" aria-label="맨 위로"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M11 19V3M4 10l7-7 7 7"/></svg></button>
<script src="images/colors.js"></script>   <!-- 박스 팔레트용 (2026-11-14) -->
<script>
/* ═════════ 아티클 (목차 페이지 articles.html의 TOC와 번호·제목을 맞출 것) ═════════
   blocks: 위에서부터 차례로
   - 'string'                       → 문단
   - { h: '소제목', en: '영문' }      → 소제목 (왼쪽 목차에 나옴. ':' 앞부분이 목차 이름)
   섹션 순서: 사진 → 소제목 → 글 (사진이 섹션 맨 앞)
   - { img, w: 4|6|8, cap, ar }      → 사진 (가운데 정렬, w칸 폭. ar = 가로/세로 비율, 기본 4/3)
   - { lead: '...' }                 → 리드 (매거진 소칼럼 제목 아래 굵은 글)
   2026-11-07: 매거진 1호 '누르다'·2호 '돌리다'의 소칼럼에서 칼럼마다 두 편씩 옮김 (본문·사진·캡션은 매거진 그대로)
   issue: 호, column: 칼럼 이름, dek: 분야 · 영문 이름 */
const ARTICLES = [{"no": "01", "title": "고장난 소리를 밟다", "date": "2026년 10월", "verb": "누르다", "issue": "01", "column": "사운드 체크", "dek": "이펙터 · Stompbox", "blocks": [{"img": "images/articles/p02-2.webp", "w": 8, "ar": "1200 / 400"}, "연습실 바닥에는 기타 케이블이 얽힌 작은 금속 상자들이 있다. 이펙터 페달이다. 기타리스트는 연주 도중에 이 상자를 발로 밟아 소리를 바꾼다. 왼손은 줄을 누르고 오른손은 줄을 퉁기니, 버튼을 누를 수 있는 것은 발뿐이다. 영어로는 밟는 상자라는 뜻의 ‘스톰박스’라고도 부른다. 이 버튼은 손가락 대신 신발 밑창이 누르고, 무대 위에서는 대개 눈으로 보지 않고 밟힌다.", "페달이 나오기 전에도 기타리스트들은 일그러진 소리를 만들었다. 1950년대 말 미국의 링크 레이는 앰프의 진공관을 건드리고 스피커 콘에 연필로 구멍을 뚫어 거친 소리를 냈고, 그 소리는 1958년의 연주곡 「럼블」에 남았다. 1964년 영국 킹크스의 데이브 데이비스는 면도날로 스피커 콘을 찢어 「유 리얼리 갓 미」의 기타 소리를 만들었다. 앰프를 망가뜨려 얻던 소리를 상자 하나에 담은 것이 퍼즈 페달이다.", "첫 상품도 사고에서 나왔다. 1961년 내시빌의 기타리스트 그레이디 마틴은 마티 로빈스의 노래 「돈트 워리」를 녹음하다가 고장 난 프리앰프 때문에 기타 소리가 일그러지는 것을 들었다. 그는 그 소리를 그대로 솔로에 썼고, 그해 같은 프리앰프로 「더 퍼즈」라는 연주곡을 자기 이름으로 녹음했다. 녹음 기술자 글렌 스나디와 레비스 홉스는 이 소리를 다시 만드는 회로를 설계했고, 깁슨은 1962년 이것을 마에스트로 FZ-1 퍼즈톤으로 내놓았다. 처음으로 대량 판매된 퍼즈 페달이었다. 안에는 게르마늄 트랜지스터 세 개가 들었고, 1.5볼트 건전지 두 개로 움직였다. 깁슨은 처음에 이 페달을 기타로 금관악기 소리를 내는 장치로 광고했다.", "페달이 널리 알려진 것은 1965년이다. 롤링 스톤스의 키스 리처즈는 「새티스팩션」을 녹음하면서 나중에 금관악기로 바꿀 자리에 퍼즈 기타를 임시로 넣었다. 금관악기 계획은 없어졌고, 리처즈의 뜻과 달리 퍼즈 트랙이 그대로 실렸다. 노래가 나온 뒤 페달 판매가 늘어 깁슨은 그해 말까지 재고를 모두 팔았다. 스나디와 홉스는 그해 10월 이 회로로 미국 특허를 받았다. 곧 다른 퍼즈 페달도 뒤따랐다. 헨드릭스는 퍼즈 페이스를, 폴 매카트니는 복스의 톤 벤더를 썼다. 비틀스의 「싱크 포 유어셀프」에서 일그러진 베이스 소리가 그 페달에서 나왔다.", "밟는 판을 끝까지 누르지 않는 페달도 나왔다. 1966년 11월 미국 토머스 오르간의 기술자 브래드 플렁킷은 복스 앰프에 들어갈 회로를 고치다가 와우 페달을 만들었다. 회로는 복스 컨티넨털 오르간의 볼륨 페달 몸체에 들어갔다. 발판을 앞뒤로 기울이면 아래의 가변저항이 돌아가면서 강조되는 음역이 위아래로 움직이고, 기타 소리가 ‘와우’ 하고 운다. 비슷한 장치는 그전에도 있었다. 컨트리 기타리스트 쳇 앳킨스는 1950년대 말 직접 만든 장치로 같은 효과를 녹음했다. 토머스 오르간은 처음에 이 페달을 관악기용으로 팔려고 트럼펫 연주자 클라이드 매코이의 이름을 빌렸고, 페달은 1967년 2월 시판됐다. 그해 크림의 에릭 클랩턴과 지미 헨드릭스가 녹음에 쓰면서 기타 페달로 자리 잡았고, 미국에서는 ‘크라이 베이비’라는 이름으로 팔렸다. 헨드릭스는 「리틀 미스 러버」에서 와우를 켠 채 줄을 짧게 끊어 치며 ‘와카와카’ 하는 리듬을 처음 들려주었다.", {"img": "images/articles/p02-5.webp", "w": 4, "ar": "1159 / 1400"}, "이 무렵 페달의 버튼은 기계식 스위치였다. 밟을 때마다 딸깍 소리가 나고, 오래 쓰면 접점이 닳았다. 일본의 악기 회사 롤랜드는 1973년 이펙터 브랜드 보스를 세웠다. 1976년 6월에 나온 보스의 첫 발 페달 CE- 1은 콘센트에 꽂아 쓰는 커다란 상자였다. 1977년 보스는 오버드라이브, 페이저, 컴프레서 등 여섯 가지 콤팩트 페달을 한꺼번에 내놓았고, 이듬해 디스토션 DS- 1을 더했다. 기계식 토글 스위치 대신 전자식 FET 스위칭을 써서 밟아도 잡음이 없고 접점이 닳지 않았다. 밟는 판을 높이 달아 위쪽의 노브를 발에서 보호했고, 건전지 뚜껑은 손으로 돌리는 나사로 열 수 있게 했다. LED 하나가 켜짐과 꺼짐, 건전지 상태를 함께 보여 주었다. 보스 미국 법인의 제프 슬링러프는 “이 디자인은 지금까지 기본적으로 바뀌지 않았다”고 말했다. 콤팩트 페달은 40년 동안 120종이 나왔고 1500만 대가 훨씬 넘게 팔렸다. 크기가 모두 같아서 페달보드 위에 여러 대를 나란히 놓을 수 있다. 페달을 판 하나에 붙여 두면 공연 전후에 케이블을 꽂고 뽑는 시간이 줄어든다.", "일그러짐을 만드는 페달은 지금 크게 세 갈래로 나뉜다. 오버드라이브는 볼륨을 끝까지 올린 진공관 앰프의 소리를 흉내 낸다. 처음에는 앰프를 크게 틀지 않고도 그 소리를 얻으려는 연주자를 위해 나왔다. 줄을 세게 퉁기면 더 일그러지고 약하게 퉁기면 덜 일그러져서, 오른손의 세기가 소리에 남는다. 디스토션은 퉁기는 세기와 상관없이 고르게 일그러지고, 퍼즈는 신호를 극단적으로 깎아 웅웅거리는 소리를 낸다. 오버드라이브로는 보스의 OD 시리즈와 아이바니즈 튜브 스크리머, 퍼즈로는 일렉트로하모닉스 빅 머프, 디스토션으로는 프로코 랫이 대표적인 페달로 꼽힌다.", {"img": "images/articles/p02-7.webp", "w": 6, "ar": "1021 / 766"}, "밟는 간격을 읽는 페달도 있다. 딜레이 페달은 소리를 늦게 한 번 더 들려주는데, ‘탭 템포’ 기능이 있으면 곡의 박자에 맞춰 발판을 몇 번 밟는 것으로 그 늦어지는 시간을 정한다. 페달은 밟은 간격을 재서 박자로 바꾼다. 보스는 1983년 디지털 딜레이 DD-2를 콤팩트 페달 크기로 처음 대량 생산했다. 1986년부터 페달보드에 흔히 놓인 DD-3에 탭 템포를 더한 DD- 3T는 발판을 2초 동안 누르고 있으면 켜고 끄는 스위치가 박자를 받는 스위치로 바뀐다. 그다음부터는 발판을 밟을 때마다 소리가 켜지고 꺼지는 대신 박자가 새로 들어간다."]}, {"no": "02", "title": "123과 789", "date": "2026년 10월", "verb": "누르다", "issue": "01", "column": "손가락이 외운 자리", "dek": "통신 · Telephone Keypad", "blocks": [{"img": "images/articles/p03-1.webp", "w": 8, "ar": "1400 / 974", "cap": "버로스 가산기. 자리마다 0부터 9까지 숫자 키를 세로로 한 줄씩 늘어놓은 기계식 가산기."}, "버튼식 전화가 나오기 전에는 다이얼을 돌려 번호를 걸었다. 손가락을 숫자 구멍에 넣고 오른쪽 아래의 멈춤쇠까지 돌린 뒤 놓으면, 다이얼이 스프링 힘으로 제자리에 돌아왔다. 돌아오는 동안 전화선의 회로가 끊겼다 이어지기를 반복했고, 교환기는 그 횟수를 세어 숫자를 읽었다. 1은 한 번, 2는 두 번, 9는 아홉 번 끊겼다. 0은 열 번이었다. 가정용 다이얼은 대개 1초에 열 번쯤 회로를 끊었으니, 0이 많이 든 번호는 9가 많이 든 번호만큼 오래 걸렸다. 번호를 거는 시간은 손가락이 다이얼을 끝까지 돌리고 놓는 동작에 달려 있었다.", "다이얼은 자동 교환기와 함께 생겼다. 미국의 앨먼 스트로저가 1891년 자동 교환기 특허를 냈고, 이듬해 인디애나주 라포르테에 99회선짜리 자동 교환기가 들어섰다. 손가락 구멍이 뚫린 익숙한 다이얼은 1907년 무렵 나왔고, 미국 벨 시스템에서는 1920년대 초에야 흔해졌다. 그 전에는 수화기를 들고 교환원에게 번호를 말했다. 1940년대 말에는 숫자와 글자를 손가락 구멍 바깥 둘레에 적은 다이얼이 나왔다. 구멍 속에 적힌 숫자는 손가락에 가려 잘 보이지 않았기 때문이다.", {"img": "images/articles/p03-2.webp", "w": 4, "ar": "930 / 1400"}, "다이얼이 사라진 뒤에도 말은 남았다. 한국어에서는 지금도 여기저기 전화를 거는 일을 ‘전화를 돌린다’고 한다. 다이얼을 한 번도 돌려 본 적 없는 사람도 이 말을 쓴다.", {"img": "images/articles/p03-3.webp", "w": 6, "ar": "1400 / 1050"}, "1963년 11월 18일 미국 벨 시스템은 펜실베이니아주 카네기에서 버튼식 전화기를 선보였고, 인근 그린즈버그로 서비스 지역을 넓혔다. 상표명은 터치톤(Touch-Tone)이었다. 이 전화는 전해인 1962년 세계박람회에서 먼저 관람객 앞에 나왔다. 웨스턴 일렉트릭 1500 전화기에는 0부터 9까지 열 개의 버튼이 있었다. 버튼을 누르면 숫자마다 음 하나가 아니라 두 음이 동시에 나갔다. 이 방식을 DTMF, 곧 이중 톤 다중 주파수 신호라고 부른다.", "가로줄마다 낮은 음이 하나씩 있다. 첫째 줄은 697헤르츠, 둘째 줄은 770헤르츠, 셋째 줄은 852헤르츠, 넷째 줄은 941헤르츠다. 세로줄마다 높은 음이 하나씩 있어서 왼쪽부터 1209, 1336, 1477헤르츠다. 1을 누르면 697헤르츠와 1209헤르츠가 함께 울리고, 2를 누르면 낮은 음은 그대로인 채 높은 음만 1336헤르츠로 바뀐다. 교환기는 두 음의 조합으로 숫자를 가렸다. 다이얼이 돌아오기를 기다릴 필요 없이 버튼을 누르는 순간 신호가 나갔다. 신호가 소리였으니 전화선 너머의 기계도 그 소리를 들을 수 있었다. 지금도 통화 중에 자동응답 메뉴의 번호를 누르면 수화기에서 짧은 음이 울린다. 그 소리가 1963년에 정한 두 음의 조합이다.", {"img": "images/articles/p03-4.webp", "w": 4, "ar": "1201 / 1400", "cap": "선드스트랜드 가산기. 0을 맨 아래에 두고 작은 숫자부터 위로 쌓은 10키 가산기."}, "규격에는 1633헤르츠짜리 넷째 세로줄도 있었다. 이 줄에는 A, B, C, D가 들어갔는데 가정용 전화기에는 달리지 않았다. 미군 전화망 오토본(AUTOVON)은 이 네 버튼으로 통화의 우선순위를 정했다. 지금 우리가 보는 숫자판은 네 칸짜리 판에서 한 줄을 뺀 모양이다.", {"img": "images/articles/p03-5.webp", "w": 6, "ar": "1400 / 1050"}, "버튼을 세 줄에 어떻게 놓을지는 벨 연구소가 시험해서 정했다. 인간공학 연구자 알폰스 샤파니스와 메리 루츠는 1950년대에 성별과 나이, 버튼식 자판 경험이 다른 300명에게 여섯 가지 배열을 보여 주고 숫자와 글자를 어디에 놓을지 물었다. 참가자들은 숫자가 왼쪽에서 오른쪽으로, 위에서 아래로 커지는 배열을 압도적으로 골랐다. 그 뒤 리처드 데이닝어는 여러 배열로 실제 전화번호를 누르게 하고 속도와 정확도를 쟀다. 1960년에 발표한 그의 연구에서 사람들이 고른 배열은 대체로 실제로 누르기에도 좋았다.", "계산기 숫자판은 7·8·9가 위에 있다. 계산기는 전화보다 먼저 버튼을 달았다. 기계식 가산기는 자리마다 0부터 9까지 숫자 키를 세로로 한 줄씩 늘어놓았고, 키를 열 개만 한데 모은 10키 가산기는 0을 맨 아래에 두고 작은 숫자부터 위로 쌓았다. 1950년대 후반의 연구자들도 계산기식 배열을 10키 가산기에서 흔히 보는 방식으로 기록했다. 전화 숫자판을 정한 연구와 계산기의 입력 관행은 서로 다른 데서 따로 굳었고, 둘을 맞출 기준은 없었다. 그래서 같은 스마트폰 안에서도 전화 앱은 1·2·3을, 계산기 앱은 7·8·9를 위에 둔다.", {"img": "images/articles/p03-6.webp", "w": 8, "ar": "1400 / 924"}, "초기 버튼식 전화에는 별표와 우물 정이 없었다. 열 개의 숫자 버튼만 있던 웨스턴 일렉트릭 1500은 1968년 12개 버튼을 갖춘 2500 모델로 바뀌었다. 비어 있던 0의 양옆에 별표(*)와 우물 정(#)이 들어왔다. 두 기호로는 숫자 말고 명령을 보낼 수 있었다. 자동응답 서비스에서 메뉴를 고르거나 입력을 끝내거나 사서함에 들어갈 때 썼다. 자동응답 전화는 “우물 정을 눌러 주세요”라고 안내했고, 디지털 도어락도 비밀번호 뒤에 별표나 우물 정을 누르게 했다.", {"img": "images/articles/p03-7.webp", "w": 6, "ar": "1400 / 1050"}, "우물 정에는 이름이 여럿 붙었다. 미국에서는 number sign이나 pound key, 영국에서는 hash라고 부른다. 벨 연구소에서는 1960년대에 octothorpe라는 이름도 썼다. ‘octo’는 여덟 방향으로 뻗은 선을 가리키고, ‘thorpe’는 육상선수 짐 소프(Jim Thorpe)의 성에서 왔다는 회고가 있다. 다른 직원은 동료들이 농담으로 지어낸 이름이라고 기억했다. 2007년 미국의 크리스 메시나는 트위터에서 글을 주제별로 묶는 데 #을 쓰자고 제안했다. 2009년 트위터는 해시태그가 붙은 단어를 검색 결과로 연결하기 시작했다. 숫자판 구석에 들어갔던 기호가 게시물에 붙는 꼬리표가 됐다.", "지금 스마트폰에서 전화 앱과 계산기 앱을 번갈아 열면 숫자 자리가 다르다. 화면 위의 버튼은 어디에든 놓을 수 있고, 누른다고 스프링이 움직이지도 않는다. 그래도 전화 앱은 1963년 터치톤의 배열을, 계산기 앱은 가산기의 배열을 그대로 쓴다. 두 앱을 자주 오가는 사람은 가끔 7을 누르려다 1을 누른다."]}, {"no": "03", "title": "1873년의 자리", "date": "2026년 10월", "verb": "누르다", "issue": "01", "column": "손가락이 외운 자리", "dek": "사무 · QWERTY", "blocks": [{"img": "images/articles/p04-1.webp", "w": 8, "ar": "1400 / 933"}, "배열이 퍼진 데는 판매와 교육이 컸다. 레밍턴 1호는 상업적으로 성공한 초기 타자기였고, 사무실과 학교에 타자기가 들어갔다. 1880년대부터 타자 학원이 늘었고, 교본은 QWERTY를 전제로 손가락 자리와 치는 법을 가르쳤다. 회사가 타자기를 사고 직원이 그 배열을 익히면, 다음에 살 기계도 같은 배열이어야 했다. 기계값에 더해 사람을 다시 가르치는 비용이 들었기 때문이다. 다른 회사들도 하나둘 같은 배열을 따랐다. 자판을 보지 않고 치는 법도 이 배열 위에서 자리 잡았다. 미국 미시간주 그랜드래피즈의 법률 사무소 직원 프랭크 맥거린은 1878년부터 레밍턴 타자기를 두세 손가락이 아니라 열 손가락으로 쳤고, 그해 말에는 자판을 보지 않고 1분에 90단어 넘게 쳤다고 회고했다. 1888년 7월 25일 신시내티에서 그는 다른 타자기인 칼리그래프를 여덟 손가락으로 치던 레밍턴 포터블 3호의 활자 막대와 글쇠.", "컴퓨터 키보드 왼쪽 위의 Q, W, E, R, T, Y는 타자기에서 왔다. 미국 위스콘신의 신문 발행인이었던 크리스토퍼 래섬 숄스는 카를로스 글리든, 새뮤얼 소울과 함께 글자를 찍는 기계를 만들었다. 1868년 무렵의 기계는 대문자만 찍을 수 있었다. 자판은 알파벳 순서에 가까웠고, 숫자와 글자가 두 줄에 섞여 있었다.", {"img": "images/articles/p04-2.webp", "w": 8, "ar": "1400 / 933"}, "1870년 숄스는 숫자까지 넣은 네 줄 자판을 만들었다. 이 자판은 남아 있지 않아서, 당시 기계를 받아 쓴 사람들이 주고받은 편지로 짐작할 뿐이다. 숫자 1과 0의 키는 따로 없었고, 대문자 I와 O가 그 일을 대신했다. 1872년 8월 『사이언티픽 아메리칸』에 실린 그림에는 맨 윗줄이 ‘QWE.TY’로 시작한다. R 자리에 마침표가 있었다.", "숄스와 후원자 제임스 덴스모어는 1873년 타자기 권리를 총기와 재봉틀을 만들던 레밍턴에 넘겼다. 레밍턴은 1874년부터 이 기계를 팔았다. ‘숄스 앤드 글리든 타자기’, 또는 ‘레밍턴 1호’로 알려진 모델이다. 생산을 맡은 기술자들은 이때 마침표와 R의 자리를 바꿨고, 맨 윗줄이 처음으로 QWERTY가 됐다. 이 기계도 대문자만 찍었다. 대문자와 소문자를 모두 찍는 QWERTY 타자기는 1878년 레밍턴 2호에서 나왔다.", "R이 윗줄로 올라간 이유로 자주 거론되는 이야기가 있다. 영업사원이 ‘TYPEWRITER’라는 단어를 맨 윗줄만으로 쳐 보이게 하려고 그랬다는 것이다. 실제로 이 열 글자는 모두 맨 윗줄에 있다. 하지만 당시 제품의 정식 이름은 하이픈이 들어간 ‘TYPE-WRITER’였고, 하이픈은 그 줄에 없었다.", {"img": "images/articles/p04-3.webp", "w": 8, "ar": "1400 / 575"}, "초기 타자기는 글쇠를 누르면 금속 활자 막대가 튀어 올라 종이를 쳤다. 글쇠마다 글자가 새겨진 막대가 하나씩 이어져 있었고, 막대들은 반원을 그리며 한 점을 향해 모였다. 이웃한 막대를 빠르게 연달아 누르면 서로 엉키거나 걸렸다. 그래서 자주 붙어 나오는 영문자를 떨어뜨려 놓았다는 설명이 가장 널리 퍼졌다.", "다른 설명은 전신 기사에게서 출발한다. 전신 기사는 모스 부호를 귀로 듣고 글자로 옮겨 적었고, 타자기를 일찍부터 쓴 사람들이었다. 교토대의 야스오카 고이치와 야스오카 모토코는 2011년 논문에서 자판 배열이 이들의 작업에 맞춰 바뀌어 갔다고 보았다. 예를 들어 모스 부호의 Z는 SE와 헷갈리기 쉬웠고, 그래서 Z, S, E가 가까이 놓였다는 추측도 있다. 숄스의 1878년 특허에는 기계 구조가 자세히 그려져 있지만, 왜 이 순서로 글자를 놓았는지는 적혀 있지 않다. 두 설명 모두 근거가 있고, 어느 하나로 확정할 기록은 없다.", {"img": "images/articles/p04-4.webp", "w": 6, "ar": "1363 / 1400", "cap": "숄스·글리든 타자기 시제품 복제품. 레밍턴 1호 타자기, 1873~1878년. 숄스와 덴스모어가 1873년 권리를 넘긴 레밍턴의 첫 타자기."}, "루이스 트라웁과 500달러를 걸고 겨뤘다. 맥거린이 크게 이겼고, 결과는 여러 신문 1면에 실렸다. 자판을 보지 않고 치려면 손가락이 글자 자리를 외워야 한다. 자리를 외운 사람이 많아질수록 배열을 바꾸기는 더 어려워졌다.", "나라마다 배열은 조금씩 달라졌다. 독일과 오스트리아, 스위스에서는 QWERTZ를 쓴다. 독일어에서는 Z가 Y보다 훨씬 자주 나오고, ‘zu’, ‘Zeit’처럼 T와 Z가 붙는 단어도 많아서 Z를 검지 가까이로 옮겼다. 프랑스와 벨기에 등에서는 AZERTY를 쓴다. A와 Q, W와 Z의 자리가 바뀌고, é나 è 같은 악센트 글자가 숫자 줄에 들어갔다. 그 대신 숫자를 치려면 시프트를 눌러야 한다.", {"img": "images/articles/p04-5.webp", "w": 4, "ar": "1188 / 1400"}, "AZERTY로는 프랑스어를 치기 불편한 점도 있었다. 악센트가 붙은 대문자 É 나 합자 Œ를 바로 치기 어렵고, 운영체제에 따라 단축키를 따로 외워야 했다. 프랑스 표준화기구 AFNOR는 2019년 프랑스어와 지역 언어, 다른 유럽 언어의 글자를 더 쉽게 칠 수 있는 자판 표준 NF Z71-300을 발표했다. 기존 키보드를 바꾸라는 명령은 아니었고, 쓰고 싶은 사람이 고르는 자발적 표준이었다.", "더 빨리 치려는 배열도 나왔다. 드보락 배열은 어거스트 드보락과 윌리엄 딜리가 설계해 1936년 특허를 받았다. 영어에서 자주 쓰는 글자를 손가락이 놓이는 가운데 줄에 모으고, 모음은 왼손에, 자주 쓰는 자음은 오른손에 두었다. 지금도 운영체제 설정에서 드보락을 고를 수 있다.", "QWERTY로 오래 친 사람이 드보락으로 바꾸려면 손가락이 기억하는 자리를 지우고 다시 외워야 해서, 바꾼 직후에는 대개 전보다 느리게 친다.", {"img": "images/articles/p04-6.webp", "w": 6, "ar": "1400 / 1037"}, "활자 막대는 컴퓨터보다 먼저 사라졌다. IBM이 1961년 내놓은 전동 타자기 셀렉트릭에는 막대가 없었다. 글자가 돌기처럼 새겨진 골프공만 한 공이 기울고 돌면서 종이를 쳤다. 키 두 개를 거의 동시에 눌러도 엉킬 막대가 없었고, 공만 갈아 끼우면 서체도 몇 초 만에 바뀌었다. 셀렉트릭은 약 25년 동안 1,300만 대쯤 팔렸다. 엉킴을 막으려고 정했다는 배열은 엉킬 것이 없어진 기계에도 그대로 실렸다.", "지금 키보드에도 활자 막대는 없다. 키를 누르면 회로가 신호를 보내고, 화면 속 자판은 손가락이 닿은 좌표를 글자로 바꾼다. 막대가 엉킬 일도, 모스 부호를 받아 적을 일도 없다. 그래도 1874년 레밍턴 공장에서 정한 맨 윗줄 여섯 글자는 노트북에도, 휴대전화 화면에도 같은 자리에 있다."]}, {"no": "04", "title": "몇 층 가세요?", "date": "2026년 10월", "verb": "누르다", "issue": "01", "column": "열려라 참깨", "dek": "건물 · Elevator Door Buttons", "blocks": [{"img": "images/articles/p05-1.webp", "w": 8, "ar": "1047 / 1400", "cap": "황동 엘리베이터 호출판."}, "사람을 태우려면 먼저 줄이 끊어져도 떨어지지 않는 엘리베이터가 필요했다. 미국의 기계공 엘리샤 오티스는 1854년 5월 뉴욕 크리스털 팰리스 박람회에서 자기가 만든 승강대에 올라 높이 올라간 뒤, 승강대를 매단 밧줄을 끊게 했다. 승강대는 떨어지지 않고 그 자리에 멈췄다. 줄이 끊기면 저절로 걸리는 안전장치 덕분이었다. 1857년 3월 23일 뉴욕의 E. V. 호트아웃 상점에 승객용 안전 엘리베이터가 처음 들어섰다. 한국에서는 1914년 서울 소공동에 문을 연 조선호텔이 엘리베이터를 들여 화제가 됐다. 그 무렵에는 엘리베이터를 ‘수직열차’라고도 불렀다.", "그 뒤로 엘리베이터에는 오랫동안 운전사가 있었다. 승객은 타면서 가려는 층을 운전사에게 말했고, 운전사는 손잡이를 잡고 속도를 조절해 그 층의 바닥 높이에 맞춰 세웠다. 접이식 철문을 여닫는 것도 운전사의 일이었다. 사람이 하는 일이라 실수도 있었다. 문이 닫히기 직전에 뛰어들거나 움직이는 차에서 뛰어내리다 다치는 승객이 나왔다. 운전사 자리는 늘 누군가 채워야 했다. 제1차 세계대전 중 영국 볼턴역에서는 제복을 입은 여성 승무원이 리프트를 몰았다.", "운전사 없이 승객이 직접 모는 엘리베이터는 1900년 무렵 나왔다. 승객들은 버튼을 쉽게 믿지 않았다. 운전사 없는 엘리베이터에 들어와 둘러보고는 다시 걸어 나가 운전사를 찾는 사람도 있었다. 초기 버튼식 엘리베이터는 쓰기도 번거로웠다. 오티스가 1925년 초 내놓은 승객 조작식 엘리베이터는 차를 부르는 데서 문을 닫는 데까지 여덟 단계를 거쳐야 했다. 업계는 문에 부딪치면 다시 열리는 완충 장치를 달고, 층에 맞춰 저절로 멈추는 장치를 넣었다.", "변화를 앞당긴 것은 1945년 9월 뉴욕 엘리베이터 운전사들의 파업이었다. 1만 5000명이 피켓 라인에 섰고, 사무직 노동자 약 150만 명이 출근하지 못했다. 시가 걷지 못한 세금이 1억 달러쯤이었다는 추산도 나왔다. 이 파업 뒤로 엘리베이터 자동화가 빨라졌다.", {"img": "images/articles/p05-3.webp", "w": 6, "ar": "1400 / 1051"}, "제조사들은 승객을 달래야 했다. 광고에는 아이가 혼자 버튼을 누르는 장면과 할머니가 혼자 엘리베이터를 타는 장면이 나왔다. 엘리베이터 안에서는 녹음된 목소리가 “이것은 자동 엘리베이터입니다. 원하시는 층의 버튼을 눌러 주십시오”라고 안내했다. 목소리는 빨간 비상 정지 버튼과 비상 전화의 쓰임새까지 설명했다. 운전사가 묻던 층을 이제 승객이 스스로 눌러야 했고, 그 방법을 녹음이 알려 줬다. 사람들이 운전사 없는 엘리베이터를 편하게 타기까지는 50년이 넘게 걸렸다. 2015년 미국 공영 라디오 NPR은 뉴욕에 남은 엘리베이터 운전사가 손가락과 발가락으로 셀 수 있을 만큼이라고 전했다.", "운전사가 떠난 자리에서 승객은 버튼판을 읽는다. 층 버튼은 아래에서 위로 숫자가 커지고, 그 아래에 열림과 닫힘, 비상 호출 버튼이 모여 있다. 한국의 엘리베이터에는 4 대신 F가 적힌 곳도 있다. ‘죽을 사(死)’와 소리가 같은 숫자를 피한 것이다. 운전사에게 말로 층을 일러 주던 시절에는 없던 고민이다. 운전사가 하던 말은 스피커가 이어받았다. 한국의 엘리베이터는 “문이 닫힙니다”, “올라갑니다”라고 말하고, 층에 닿으면 그 층의 숫자를 불러 준다.", {"img": "images/articles/p05-4.webp", "w": 8, "ar": "1400 / 960", "cap": "마스크를 쓴 뉴욕 엘리베이터 운전원, 1918년."}, "지금 버튼판에서 운전사의 손을 가장 직접 이어받은 버튼은 열림과 닫힘이다. 그중 닫힘 버튼은 눌러도 소용없다는 의심을 자주 받는다. 미국에서는 1990년 장애인법이 생긴 뒤 바로 작동하는 닫힘 버튼이 점점 사라졌다. 휠체어나 목발을 쓰는 사람이 탈 시간을 주려면 문이 일정 시간 열려 있어야 하기 때문이다. 2010년 미국 장애인법 기준 407.3.4항은 호출에 응한 엘리베이터의 문이 닫히기 시작할 때까지 최소 5초를 두도록 정했다. 미국 엘리베이터 업계 단체의 캐런 페나피엘은 닫힘 버튼이 “플라시보 버튼”은 아니며, 정해진 시간이 지나면 제 기능을 한다고 설명했다. 승객이 그 시간을 재 보기는 어렵다.", "서울 지하철역의 닫힘 버튼은 아예 꺼져 있다. 2024년 말 시청역과 서울역 등 네 역의 엘리베이터는 닫힘 버튼이 모두 작동하지 않았다. 서울교통공사는 역 엘리베이터가 장애인용 승강기로 등록돼 있어 문이 10초 넘게 열려 있어야 한다며 닫힘 버튼을 꺼 두었다고 설명했다. 누르면 불은 들어오는데 문은 그대로인 버튼 앞에서 승객들은 몇 번씩 더 누른다.", {"img": "images/articles/p05-5.webp", "w": 8, "ar": "1400 / 939", "cap": "엘리샤 오티스 ‘승강 장치 개량’ 미국 특허 도면, 1861년. 줄이 끊어져도 떨어지지 않는 엘리베이터의 발명자."}, "닫힘 버튼이 꼭 필요한 때도 있다. 화재 때 소방관이 엘리베이터를 직접 모는 ‘소방 운전’에서는 문이 저절로 열리지 않고, 소방관이 열림 버튼을 누르고 있는 동안에만 열린다. 손을 떼면 문이 다시 닫힌다. 연기가 찬 층에 문이 활짝 열리는 일을 막기 위해서다. 이때 버튼은 옛 운전사의 손잡이처럼 문을 직접 움직인다.", "최근에는 엘리베이터가 다시 층을 묻는다. 큰 건물 로비의 ‘행선층 예약’ 패널은 엘리베이터를 타기 전에 가려는 층을 누르게 한다. 시스템은 같은 층으로 가는 사람들을 한 엘리베이터에 모으고, 몇 호기를 타라고 화면에 띄운다. 탄 뒤에는 따로 누를 것이 없고, 엘리베이터 안에는 층 버튼이 아예 없는 경우도 있다. 이 방식은 1961년 오스트레일리아의 레오 포트가 처음 구상해 특허를 냈다. 뒤에 시드니 시장이 되는 사람이다. 시드니대 법대 건물 등에 그의 장치가 들어갔지만, 당시의 기계식 계전기로는 복잡한 배차 계산을 감당하기 어려웠고, 포트의 특허는 1977년 만료됐다. 마이크로프로세서가 들어온 뒤인 1990년 스위스 쉰들러가 ‘미코닉 10’이라는 이름으로 이 방식을 상용화했다. 층 버튼은 엘리베이터 안에서 로비 벽으로 나왔다. 승객은 운전사가 있던 시절처럼 먼저 가려는 층을 알리고, 로비의 숫자판이 그 층을 받아 적는다."]}, {"no": "05", "title": "내리실 문은 왼쪽입니다", "date": "2026년 10월", "verb": "누르다", "issue": "01", "column": "열려라 참깨", "dek": "교통 · Train & Bus Doors", "blocks": [{"img": "images/articles/p06-1.webp", "w": 8, "ar": "1197 / 838"}, "영국의 오래된 열차에는 좌석 칸마다 문이 따로 달려 있었다. 승객이 직접 열고 내린 뒤 쾅 닫는 문이라 ‘슬램도어’라고 불렸다. 어떤 열차는 문을 바깥에서만 열 수 있었다. 승객은 문에 달린 창문을 내리고 몸을 내밀어 바깥 손잡이를 잡아 돌렸다. 이 문은 열차가 달리는 중에도 열렸다. 1990년대 큰 사고가 잇따르자 기관사나 차장이 모든 문을 한꺼번에 잠그는 중앙 잠금장치가 붙었다. 슬램도어 열차는 2000년대 들어 미닫이문 열차로 바뀌었고, 2005년 11월 마지막 차량이 영국 본선에서 물러났다.", "런던 지하철 문 옆에는 지금도 버튼이 붙은 경우가 많다. 한때는 승객이 버튼으로 문을 여는 것이 원칙이었다. 내리거나 타는 사람이 있는 문만 열면 되기 때문이다. 1990년대 운영진은 기관사가 모든 문을 한꺼번에 여닫는 편이 역에 머무는 시간을 줄인다는 것을 알게 됐다. 승객이 문을 여는 방식은 1990년대 후반부터 줄었다.", {"img": "images/articles/p06-2.webp", "w": 6, "ar": "1400 / 1358", "cap": "열차 문 버튼."}, "디스트릭트선의 D78형 전동차는 원래 역마다 승객이 문을 열도록 만들어졌다. 여름에 차 안이 너무 더워지자 기관사가 문을 열기 시작했고, 다시 승객이 여는 방식으로 돌아가지 않았다. 2000년대 중반 리모델링 때 안쪽 버튼은 떼어 냈고 바깥 버튼은 패널로 덮었다.", "버튼이 다시 쓰이는 열차도 있다. 메트로폴리탄선 등에 다니는 S형 전동차는 역에 오래 서 있을 때 문을 닫아 두고, 타려는 승객이 버튼을 눌러 연다. 냉난방한 공기가 빠져나가지 않게 하려는 것이다.", {"img": "images/articles/p06-3.webp", "w": 4, "ar": "930 / 1400", "cap": "승객을 버스에 밀어 넣는 안내양."}, "런던 오버그라운드와 엘리자베스선의 새 열차는 문이 풀리기 전에 버튼을 누르면 빨간불만 켜지고, 문이 풀려 초록불과 알림음이 나온 뒤에야 버튼이 문을 연다. 버스 문은 한동안 사람이 맡았다. 한국의 버스 안내양은 1920년대 후반 처음 등장했다. 1959년 4월부터 서울 버스의 남자 차장이 여자 차장으로 바뀌었고, 지방도 이를 따랐다. 1961년에는 안내양 제도가 다시 도입됐다. 1960~70년대 안내양은 차문을 탁탁 두드리며 “오라이!”를 외쳤고, 작은 체구로 승객을 버스 안으로 밀어 넣었다. 요금을 받고, 정류장 이름을 외치고, 문을 여닫는 일이 모두 안내양의 몫이었다.", "일은 고됐다. 1970년대 중반 안내양의 월급은 2만 2천 원이었고, 하루 15시간을 일하고 네 시간쯤 잤다. 격일제였지만 주말과 휴일에도 나와 한 달에 25일을 일했다. 1977년 기사에 따르면 안내양의 34%가 동상, 무좀, 위장병 같은 직업병을 앓았다. 앉을 자리가 없어 종일 서서 일했고, 버스 문에 기대 버텼다. 1982년에는 승강 발판이 꺼져 열여섯 살 안내양이 숨지는 사고도 있었다. 1985년 기사에 따르면 안내양의 퇴직 나이는 스무 살 안팎이었고, 서울의 적지 않은 버스 회사가 스무 살 이하만 뽑는다는 사규를 두었다. 1981년 김수용 감독은 김승옥 원작의 영화 「도시로 간 처녀」에서 이들의 생활을 그렸다.", "안내양이 하던 일은 방송과 벨이 나눠 맡았다. 1982년 시민자율버스가 도입되면서 안내양은 급격히 줄었다. 1984년부터 버스에서는 하차 지점을 알리는 안내방송이 시작됐고, 버스벨이 생겨 승객이 내리기 직전에 벨을 누르면 문이 자동으로 열리게 됐다. 정류장 이름은 녹음된 목소리가 불렀고, 내릴 사람은 손을 뻗어 벨을 눌렀다. 1989년 4월 김포교통 130번 버스의 안내양 38명을 마지막으로 이 일은 사라졌다.", {"img": "images/articles/p06-4.webp", "w": 4, "ar": "767 / 1149", "cap": "열차 문 Open·Close 버튼."}, "지금 한국 버스의 하차벨은 기둥과 좌석 옆, 창틀 곳곳에 달려 있다. 아무 데서나 하나를 누르면 벨이 울리고 운전석 쪽에 정차 표시등이 켜진다. 버스는 다음 정류장에 서서 뒷문을 연다. 하차 버튼은 나라마다 생김새가 다르다. 오스트리아 버스의 버튼에는 점자가 새겨져 있고, 일본 버스에는 휠체어석 승객만 쓰는 버튼이 따로 있다. 런던은 옛 소리를 다시 꺼냈다. 2025년 2월 런던교통공사는 일부 노선에서 버스가 곧 출발한다는 것을 알리는 벨을 두 번 울리는 시험을 하기로 했다. 옛 루트마스터 버스의 안전장치를 되살린 것으로, 승객이 넘어져 다치는 일을 줄이려는 것이다.", "서울 지하철은 1974년 8월 15일 1호선 개통 때부터 문을 승무원이 한꺼번에 여닫았다. 지금도 서울 지하철 문에는 승객이 누르는 버튼이 없다. 승객은 “내리실 문은 왼쪽입니다” 같은 안내방송을 듣고 어느 쪽 문이 열릴지 안다. 문이 닫힐 때는 “출입문 닫습니다”라는 방송과 경고음이 먼저 울린다. 문 사이에 가방이나 발이 끼면 승무원이 문을 다시 열었다가 닫는다. 승객이 할 수 있는 일은 방송을 듣고 문 앞에서 기다리는 것이다. 지금은 열차 문 앞에 문이 하나 더 있다. 서울시는 2006년부터 승강장에 스크린도어를 달기 시작해 2009년 1~8호선 262개 역에 모두 설치했다. 열차 문이 열리면 승강장 문도 함께 열린다. 설치 전인 2001년부터 2009년까지 선로 추락이나 열차 접촉으로 숨진 사람은 한 해 평균 37.1명이었고, 설치 뒤인 2010년부터 2024년까지는 한 해 평균 0.4명이었다. 스크린도어는 9호선과 경전철로 이어져 지금은 345개 역에 있다. 승객이 손댈 수 있는 문은 늘지 않았고, 기관사가 여닫는 문은 두 겹이 됐다.", {"img": "images/articles/p06-5.webp", "w": 4, "ar": "932 / 1400", "cap": "D78형 전동차 실내, 1979년. 역마다 승객이 문을 열도록 만든 런던 디스트릭트선 전동차."}, "냉기가 빠져나가는 문제는 여는 문의 수를 줄여 푼다. 열차가 역에 오래 서 있을 때 문을 일부만 여는 기능을 ‘반감’이라고 부른다. 예전에는 가운데 문 두 개를 열었고, 지금은 가장자리 문 하나만 연다. 체코 프라하의 트램처럼 필요할 때만 버튼으로 문을 여는 곳도 있다.", "창문도 비슷한 길을 걸었다. 서울 지하철 초기 전동차는 창문을 위아래로 절반쯤 열 수 있었고, 1988년 무렵 에어컨이 본격적으로 들어오면서 통유리로 바뀌었다."]}, {"no": "06", "title": "해로 아는 시간", "date": "2026년 11월", "verb": "돌리다", "issue": "02", "column": "지금 몇 시야?", "dek": "해시계 · Sundial", "blocks": [{"img": "images/articles/t01-1.webp", "w": 8, "ar": "1400 / 1135", "cap": "고대 이집트 해시계 조각. 왕가의 계곡, 기원전 13세기"}, "해시계는 막대 하나와 눈금판으로 시간을 잰다. 해가 하늘을 가로질러 움직이면 막대의 그림자도 눈금판 위를 따라 움직이고, 그림자가 가리키는 눈금을 읽으면 시각을 안다. 북반구에서는 해가 남쪽 하늘을 지나 동쪽에서 서쪽으로 간다. 땅에 평평하게 놓은 해시계를 위에서 내려다보면, 그림자는 아침에 서쪽을 가리키다가 한낮에 북쪽을 지나 저녁에 동쪽으로 간다. 지금 시곗바늘이 도는 방향과 같다.", "해시계는 아주 오래전부터 있었다. 2013년 스위스 바젤 대학의 발굴단은 이집트 왕가의 계곡에서 기원전 13세기 무렵의 해시계를 찾았다. 무덤을 짓던 일꾼들이 살던 돌집 터에서 나온 납작한 석회암 조각이다. 검은 선으로 반원을 그려 열두 칸으로 나누고, 칸마다 가운데에 점을 찍어 시간을 더 잘게 읽게 했다. 가운데에 막대를 꽂아 그림자를 드리웠을 것으로 보이며, 발굴단은 일꾼들이 이것으로 일한 시간을 쟀으리라고 짐작했다. 이집트에서 나온 해시계 가운데 가장 오래된 것으로 꼽힌다.", {"img": "images/articles/t01-2.webp", "w": 4, "ar": "1050 / 1400"}, "중세 유럽에서는 교회 남쪽 벽에 해시계를 새겼다. 1100년 무렵부터 1600년 무렵까지 만들어진 이 해시계는 영국에서만 3천 개쯤 기록됐다. 벽에 뚫은 구멍에 나무나 쇠 막대를 직각으로 꽂고, 그 둘레에 선 몇 개를 부채꼴로 그어 놓은 모양이다. 크기는 접시만 했다. 막대 그림자가 어느 선에 닿았는지로 아침 미사와 정오, 저녁 기도 때를 알았다. 하루의 시각을 재기보다 예배 시간을 알리는 데 쓰였다고 본다. 남쪽 벽에 새긴 것은 해가 그쪽 벽을 가장 오래 비추기 때문이다.", {"img": "images/articles/t01-3.webp", "w": 8, "ar": "1400 / 933"}, "시계를 만들던 곳이 대부분 북반구에 있었기 때문에 시곗바늘도 이 방향을 따랐다는 설명이 흔하다. 남반구에서는 해가 북쪽 하늘을 지나므로, 같은 해시계를 놓으면 그림자가 반대 방향으로 돈다. 남반구에서 시계가 먼저 발달했다면 시곗바늘은 지금과 반대로 돌았을지도 모른다. 이 설명은 널리 퍼져 있지만, 시계 이야기를 다루는 글에서도 대개 ‘아마도’를 붙여 소개한다.", "한반도에서 가장 오래된 해시계로 알려진 것은 1930년 경주 성곽에서 발굴된 화강석 해시계 조각이다. 6~7세기 신라 때 만든 것으로 보이며, 둥근 판을 24칸으로 나누고 가운데에 막대를 세운 모양이었다. 지금은 일부만 남아 있다. 고려의 해시계는 기록도 유물도 남아 있지 않다.", {"img": "images/articles/t01-4.webp", "w": 4, "ar": "933 / 1400"}, "조선 세종 때는 해시계를 여러 가지 만들었다. 앙부일구, 현주일구, 천평일구, 정남일구 같은 이름이 『세종실록』에 나온다. 그 가운데 1434년에 만든 앙부일구는 하늘을 우러러 놓인 가마솥 같은 모양이라 ‘앙부’라는 이름이 붙었다.", "세종이 이순지에게 만들게 했다. 오목한 반구 안쪽에 시각을 나타내는 세로줄과 동지부터 하지까지의 절기를 나타내는 가로줄 13개를 새기고, 북극을 향해 비스듬히 꽂은 바늘의 그림자로 시각과 절기를 함께 읽었다. 계산을 따로 하지 않아도 그림자가 떨어진 자리의 눈금만 읽으면 됐다.", {"img": "images/articles/t01-5.webp", "w": 8, "ar": "1400 / 930", "cap": "반구형 해시계"}, "그해 10월 세종은 앙부일구를 지금의 서울 종로1가 근처 혜정교 옆과 종묘 남쪽 거리에 놓게 했다. 궁궐 안이 아니라 사람들이 오가는 큰길가에 놓인 공공 시계였다. 글을 모르는 사람도 시간을 알 수 있게, 시각을 나타내는 자리에 글자 대신 열두 띠 동물의 그림을 그렸다고 전한다. 『세종실록』은 동물 그림을 그린 것은 글을 모르는 백성을 위해서이고, 길옆에 놓은 것은 보는 사람이 모이기 때문이라고 적었다. 세종 때 만든 앙부일구는 임진왜란 등을 거치며 사라졌고, 지금 남아 있는 앙부일구는 17~18세기 이후에 다시 만든 것들이다. 이때는 손바닥에 올릴 만한 작은 휴대용 앙부일구도 많이 만들었다. 1985년에는 한국표준과학연구원이 『세종실록』의 기록을 따라 혜정교와 종묘 앞에 놓였던 앙부일구를 놋쇠로 다시 만들었다. 2020년에는 미국 경매에 나온 18~19세기 앙부일구 한 점을 문화재청과 국외소재문화재재단이 6월에 사들였다. 8월에 국내로 들여온 이 앙부일구는 11월 국립고궁박물관에서 공개됐다.", {"img": "images/articles/t01-6.webp", "w": 6, "ar": "1400 / 1321", "cap": "접이식 휴대 해시계. 독일 뉘른베르크, 메트로폴리탄 미술관"}, "해시계는 해가 있어야 시간을 알려 준다. 밤이나 흐린 날에는 쓸 수 없다. 세종 때 같은 해에 장영실 등이 만든 자격루는 물을 이용해 스스로 시각을 알리는 시계로, 해가 없을 때의 시간을 맡았다. 1437년에는 낮에는 해를, 밤에는 별을 보고 시각을 재는 ‘일성정시의’를 만들었다. 구리로 지름 68cm쯤 되는 고리 세 겹을 짜 맞춘 기구였다. 네 개를 만들어 궁궐의 만춘전과 천문을 맡은 서운관, 평안도와 함경도의 병영에 하나씩 두었다. 해시계의 그림자는 저절로 돌아서 사람이 손으로 맞출 것이 없었다. 기계 시계가 나오고 나서야 사람이 시곗바늘을 직접 돌려 시간을 맞추기 시작했다.", "궁궐이나 박물관 마당에 놓인 앙부일구 복제품을 손목시계와 견주어 보면, 그림자가 가리키는 시각은 손목시계보다 대개 30분쯤 늦다. 한국 표준시는 동경 135도를 기준으로 정해져 있는데, 서울은 동경 127도 근처에 있다. 경도 1도마다 4분씩 차이가 나니, 서울에서는 해가 표준시보다 30분쯤 늦게 남쪽 하늘 한가운데에 온다.", {"img": "images/articles/t01-7.webp", "w": 6, "ar": "1400 / 1181", "cap": "적도식 휴대 해시계. 독일 아우크스부르크, 메트로폴리탄 미술관"}, "한국의 표준시가 처음부터 동경 135도를 기준으로 한 것은 아니다. 대한제국은 1908년 4월 1일 한반도 가운데를 지나는 동경 127.5도를 기준으로 표준시를 처음 시행했다. 1912년 1월 1일 조선총독부가 이를 일본과 같은 동경 135도로 바꿨고, 1954년 3월 정부는 다시 127.5도로 되돌렸다. 1961년 8월 다시 135도로 바뀐 뒤로 지금까지 이어진다. 127.5도는 서울과 경도가 거의 같아서, 그 기준을 쓰던 때에는 해가 정남쪽에 오는 시각과 시계의 낮 12시가 몇 분밖에 차이 나지 않았다.", "여기에 계절에 따른 차이가 더해진다. 지구가 해 둘레를 도는 길이 완전한 원이 아니고 지구의 축도 기울어 있어서, 해가 정남쪽에 오는 시각은 한 해 동안 앞뒤로 15분 남짓 오락가락한다. 해시계 옆 안내판에 날짜별로 더하고 빼야 할 분을 적은 표가 붙어 있는 것은 이 때문이다. 해시계는 그날 그 자리의 해가 정한 시간을 보여 준다. 기차와 방송이 같은 시간에 맞춰 움직이려면 모두가 같은 시계를 따라야 했고, 그렇게 정한 것이 표준시다.", {"img": "images/articles/t01-8.webp", "w": 4, "ar": "933 / 1400"}, "앙부일구의 시각선은 지금의 시간 단위로 그어져 있지 않다. 조선은 하루를 열두 시진으로 나누고, 시진마다 자시, 축시, 인시처럼 열두 띠의 이름을 붙였다.", {"img": "images/articles/t01-9.webp", "w": 6, "ar": "1400 / 1400"}, "앙부일구 안쪽에는 이 시진을 다시 잘게 나눈 세로줄이 그어져 있다. 해가 있는 낮 동안의 시진만 쓰이기 때문에, 반구 안에는 묘시부터 유시 무렵까지의 눈금만 새겼다.", "해시계는 방향과 기울기를 맞춰야 바르게 읽힌다. 바늘은 정확히 북극 하늘을 향해야 하고, 바늘이 땅과 이루는 각도는 그곳의 위도와 같아야 한다. 서울에 맞춰 만든 해시계를 부산으로 옮기면 그림자가 조금씩 어긋난다. 그래서 조선 후기의 휴대용 해시계에는 작은 나침반이 함께 달려 있었다. 나침반 바늘이 가리키는 쪽에 맞춰 해시계를 돌려 놓은 뒤에야 그림자를 읽을 수 있었다. 손바닥만 한 해시계를 땅에 내려놓고 이리저리 돌려 방향부터 맞췄다."]}, {"no": "07", "title": "시계의 왕관", "date": "2026년 11월", "verb": "돌리다", "issue": "02", "column": "지금 몇 시야?", "dek": "스마트워치 · Digital Crown", "blocks": [{"img": "images/articles/t02-1.webp", "w": 8, "ar": "766 / 894"}, "용두를 영어로는 크라운, 곧 왕관이라고 부른다. 2014년 9월 9일 애플은 첫 스마트워치 애플워치를 발표하면서 시계 오른쪽 옆구리의 꼭지에 ‘디지털 크라운’이라는 이름을 붙였다. 생김새는 손목시계의 용두와 같지만, 안쪽에 태엽은 없다. 용두를 돌리면 화면의 목록이 위아래로 넘어가고, 지도와 사진이 커지거나 작아진다. 누르면 첫 화면으로 돌아가고, 음성 비서를 부를 때도 이 용두를 쓴다.", "손목 위의 화면은 작다. 휴대전화처럼 두 손가락을 벌려 화면을 키우면 손가락이 화면을 거의 다 가린다. 애플은 용두를 돌리는 동작으로 이 문제를 풀었다. 손가락은 화면 옆에 있으니 화면을 가리지 않는다. 애플은 이 용두를 아이팟의 클릭 휠, 아이폰의 멀티 터치 화면에 견주었다. 용두 안쪽에서는 빛을 내는 부품과 빛을 받는 부품이 돌아가는 축을 읽어, 얼마나 어느 쪽으로 돌렸는지를 숫자로 바꾼다. 애플워치는 이듬해 2015년 4월 24일 아홉 나라에서 판매를 시작했다. 그해 나온 소프트웨어 업데이트에서는 용두를 돌려 앞으로의 일정과 날씨를 미리 넘겨 보는 기능이 들어갔다.", {"img": "images/articles/t02-2.webp", "w": 6, "ar": "894 / 766"}, "디지털 크라운은 그 뒤로 일이 늘었다. 2018년에 나온 애플워치 시리즈 4부터는 용두를 돌릴 때 손끝에 딸깍거리는 진동이 전해진다. 실제로 걸리는 톱니는 없지만, 목록이 한 칸 넘어갈 때마다 진동을 보내 톱니를 넘는 것처럼 느끼게 한다. 같은 모델부터는 용두에 손가락을 대고 있으면 심전도를 잴 수 있다. 애플은 이 용두를 아이패드 옆면에 다는 설계로 특허를 내기도 했다.", {"img": "images/articles/t02-3.webp", "w": 8, "ar": "1400 / 933"}, "손목 위에서 돌리는 방법은 하나가 아니다. 삼성은 2015년 기어 S2에 시계 테두리 전체를 돌려 화면을 넘기는 방식을 넣었다. 다이버 시계의 베젤처럼 테두리를 돌리면 딸깍거리며 한 칸씩 넘어간다. 삼성은 2021년 갤럭시 워치 4 클래식까지 이 테두리를 달다가, 2022년 갤럭시 워치 5에서는 빼고 화면 가장자리를 손가락으로 쓸어 넘기는 방식으로 바꿨다. 사용자들의 불만이 이어졌고, 2023년 서울에서 열린 발표회에서 갤럭시 워치 6 클래식이 도는 테두리를 다시 달고 나왔다. 테두리 안쪽의 자기 센서가 테두리의 위치를 읽는다. 장갑을 낀 손이나 젖은 손가락으로는 화면을 쓸기 어렵지만, 테두리는 잡고 돌릴 수 있다. 2024년 갤럭시 워치 7에는 도는 테두리가 다시 빠졌다.", "구글의 스마트워치 운영체제도 돌리는 손잡이를 받아들였다. 2017년 2월 구글은 ‘안드로이드 웨어 2.0’을 내놓으면서 돌리는 입력을 지원하기 시작했고, 이와 함께 나온 LG 워치 스포츠와 LG 워치 스타일에는 돌아가는 용두가 달렸다. 용두를 돌리면 앱 목록과 알림이 넘어갔다. 다른 회사들도 이 기능을 앱에 쓸 수 있어서, 온도조절기 회사 네스트는 용두를 돌려 집의 난방 온도를 맞추는 앱을 내놓았다.", {"img": "images/articles/t02-4.webp", "w": 4, "ar": "933 / 1400"}, "스마트워치의 용두와 테두리는 태엽을 감지 않고 바늘을 맞추지도 않는다. 시간은 인터넷에서 받아 스스로 맞춘다. 그래도 둘 다 손목시계의 용두와 베젤이 있던 자리에 그대로 붙어 있다.", "애플워치에는 물에 들어갈 때 쓰는 ‘물 잠금’ 기능이 있다. 수영을 시작하며 이 기능을 켜면 화면이 터치에 반응하지 않는다. 물에서 나와 디지털 크라운을 돌리면 잠금이 풀리고, 시계가 스피커로 소리를 내면서 스피커 안에 고인 물을 밀어낸다. 젖은 화면은 손가락을 제대로 알아보지 못하지만, 용두는 돌릴 수 있다.", {"img": "images/articles/t02-5.webp", "w": 8, "ar": "1400 / 926"}, "2022년에 나온 애플워치 울트라는 디지털 크라운 둘레에 보호대를 둘러 부딪쳐도 용두가 상하지 않게 했다. 울트라의 ‘웨이파인더’ 시계 화면에서는 용두를 위로 돌리면 화면 전체가 빨간색으로 바뀌는 ‘야간 모드’가 켜졌다. 어둠에 익숙해진 눈을 덜 부시게 하는 기능으로, 반대로 돌리면 원래 색으로 돌아왔다. 이듬해 watchOS 10에서 용두를 위로 돌리는 동작이 위젯을 불러오는 데 쓰이자, 애플은 야간 모드를 시계 화면 설정 메뉴로 옮겼다. 2023년 watchOS 10부터는 시계 화면에서 디지털 크라운을 돌리면 여러 위젯이 겹쳐 쌓인 화면이 아래에서 올라온다. 구글이 2022년에 내놓은 픽셀 워치에도 돌리면 진동이 전해지는 용두가 달렸다.", "화면도 용두도 건드리지 않는 방법도 나왔다. 2023년 10월 애플은 애플워치 시리즈 9와 울트라 2에 ‘더블 탭’을 넣었다. 시계를 찬 손의 엄지와 검지를 두 번 맞부딪치면 전화를 받거나 위젯을 넘길 수 있다. 시계는 손목의 작은 움직임과 혈류의 변화를 읽어 이 동작을 알아본다. 다른 손으로 커피 잔이나 개 목줄을 쥐고 있을 때를 위한 기능이다. 애플은 석 달 앞서 공개한 헤드셋 비전 프로에도 손가락을 맞부딪쳐 고르는 조작을 넣었다. 더블 탭이 나오기 전에는 손이 바쁠 때 코끝으로 화면을 누르는 사람도 많았다. 용두를 돌리려면 시계를 차지 않은 다른 손이 있어야 한다.", {"img": "images/articles/t02-6.webp", "w": 4, "ar": "894 / 1152"}, "용두와 회전 테두리 말고 돌리는 방법을 찾은 회사도 있다. 화면 가장자리를 손가락으로 원을 그리듯 쓸면 테두리를 돌린 것처럼 화면이 넘어가는 방식이다. 장갑을 끼거나 손이 젖으면 이 방식은 잘 듣지 않는다. 그래서 운동용 시계 가운데에는 화면을 만지지 않고 옆면의 버튼만으로 모든 기능을 쓰게 만든 것도 많다. 2013년 1월 처음 배송된 스마트워치 페블에는 터치 화면이 아예 없었다. 옆면에 달린 버튼 네 개로 목록을 오르내리고 골랐다. 창업자 에릭 미기콥스키는 화면을 보지 않고도 음악을 멈추거나 걸려 온 전화를 거절할 수 있다는 점을 버튼의 장점으로 꼽았다.", {"img": "images/articles/t02-7.webp", "w": 6, "ar": "1400 / 1244"}, "스마트워치의 화면에는 많은 것이 들어가지만, 손가락 하나가 덮을 만한 크기다. 화면 옆에서 엄지와 검지로 집어 돌리는 용두가 이 작은 화면을 넘기고 키우는 일을 맡았다. 1845년 필리프가 태엽을 감고 바늘을 맞추려고 만든 꼭지와 같은 자리다.", "돌려서 목록을 넘기는 방식은 애플에게 처음이 아니었다. 2001년에 나온 첫 아이팟에는 실제로 돌아가는 바퀴가 달려 있었고, 2004년 무렵부터는 바퀴가 움직이지 않고 손가락으로 원을 그리면 알아듣는 ‘클릭 휠’로 바뀌었다. 엄지로 원을 그리며 노래 수천 곡의 목록을 넘겼다. 아이폰이 나오면서 이 바퀴는 화면을 위아래로 쓸어 넘기는 손가락에 자리를 내주었다. 손목 위의 화면이 다시 작아지자 애플은 돌리는 손잡이를 다시 꺼냈다. 이번에는 바퀴 대신 시계의 용두 모양이었다."]}, {"no": "08", "title": "냉수와 온수", "date": "2026년 11월", "verb": "돌리다", "issue": "02", "column": "약불로 오래", "dek": "수전 · Faucet", "blocks": [{"img": "images/articles/t03-1.webp", "w": 8, "ar": "1400 / 933"}, "오래된 세면대에는 손잡이가 두 개 달려 있다. 하나에는 빨간 표시가, 다른 하나에는 파란 표시가 있다. 빨간 쪽을 돌리면 뜨거운 물이, 파란 쪽을 돌리면 찬물이 나온다. 알맞은 온도를 만들려면 두 손잡이를 번갈아 조금씩 돌려 가며 손으로 물을 대 봐야 한다. 뜨거운 물을 먼저 틀면 처음 나오는 물에 손을 데기 쉽고, 찬물을 먼저 틀면 따뜻해질 때까지 기다려야 한다.", "이런 손잡이 안에는 나사가 들어 있다. 손잡이를 돌리면 나사가 위아래로 움직이면서 끝에 붙은 고무 패킹이 물길을 막았다가 연다. 많이 돌릴수록 물길이 넓어지고 물이 많이 나온다. 잠글 때는 패킹이 물길 입구에 눌릴 때까지 손잡이를 여러 바퀴 돌려야 한다. 꽉 잠근 뒤에도 물이 똑똑 떨어지면 대개 이 패킹이 닳은 것이다. 패킹과 그 아래 받침은 자주 갈아 줘야 했다.", "1937년 미국 시애틀에서 워싱턴 대학교 기계공학과 학생이던 앨 모엔은 손잡이가 둘인 수도꼭지로 손을 씻다가 뜨거운 물에 손을 데었다. 그는 손잡이 하나로 찬물과 뜨거운 물을 섞어 내보내는 수도꼭지를 생각하고 그림을 그리기 시작했다. 물이 꼭지 밖으로 나오기 전에 안에서 미리 섞이게 하는 방식이었다. 모엔은 그 뒤 10년 동안 설계를 여러 번 고쳤다. 제2차 세계대전 동안 그는 시애틀의 군 조선소에서 공구를 설계했고, 전쟁이 끝날 때까지 수도꼭지를 만들어 줄 회사를 찾지 못했다. 1947년 그는 시애틀의 금속 제품 회사 라베나 메탈 프로덕츠를 설득해 자신의 수도꼭지를 만들게 했다.", {"img": "images/articles/t03-2.webp", "w": 4, "ar": "933 / 1400"}, "모엔의 수도꼭지에는 고무 패킹을 짓눌러 물을 막는 나사 대신 패킹이 필요 없는 원통형 부품이 들어갔다. 전쟁 뒤 미국에 집이 많이 지어지면서 모엔의 수도꼭지는 많은 새집에 들어갔다. 1959년 미국 잡지 『포천』은 이 수도꼭지를 대량 생산된 물건 가운데 디자인이 가장 뛰어난 100가지에 넣었다. 이 수도꼭지에서 시작한 회사가 지금의 모엔이다. 모엔은 1982년 은퇴할 때까지 회사의 연구 개발을 이끌었고, 수도꼭지와 관계없는 것까지 모두 75개쯤의 특허를 가졌다.", "같은 무렵 다른 곳에서도 손잡이 하나짜리 수도꼭지가 나왔다. 1952년 미국 디트로이트에서 나사 회사 마스코를 운영하던 앨릭스 마누지언에게 한 발명가가 공 모양 밸브로 찬물과 뜨거운 물을 섞는 수도꼭지를 들고 왔다. 물이 새는 물건이었지만, 마누지언은 레버 하나로 물의 양과 온도를 함께 다룬다는 생각에 끌려 권리를 사들이고 설계를 고쳤다. 1954년 이 수도꼭지는 ‘델타’라는 이름으로 나왔다. 회사는 안쪽 부품의 모양이 그리스 문자 델타(Δ)를 닮아서 붙인 이름이라고 설명한다. 다른 회사들은 델타의 특허를 피해 가며 저마다 다른 구조의 손잡이 하나짜리 수도꼭지를 만들었다.", "1970년대 초에는 구멍을 뚫은 단단한 도자기 원판 두 장을 겹쳐 놓고, 위쪽 원판을 돌려 구멍을 맞추거나 어긋나게 하는 방식이 특허를 받았다. 두 원판이 서로 미끄러지며 물길을 열고 닫아서 고무 패킹이 필요 없다. 이런 방식의 수도꼭지는 손잡이를 4분의 1바퀴나 반 바퀴만 돌려도 끝까지 열리고 닫힌다. 여러 바퀴 돌려 잠그던 손잡이의 움직임이 짧아졌다.", {"img": "images/articles/t03-3.webp", "w": 6, "ar": "1400 / 1107"}, "손잡이가 하나가 되자 물을 다루는 동작도 바뀌었다. 레버 하나를 들어 올려 물의 양을 정하고, 좌우로 젖혀 온도를 정한다. 손바닥이나 손등으로도 밀 수 있어서, 반죽이나 기름이 묻은 손으로 물을 틀 때 편하다. 레버를 한쪽으로 젖혀 둔 채 잠그면 다음에 틀 때도 같은 온도의 물이 나온다. 공중화장실에는 손을 대면 물이 나오고 손을 떼면 멈추는 센서 수도꼭지가 늘었다. 이런 수도꼭지에는 돌릴 손잡이가 없고, 물 온도도 미리 정해져 있다. 레버 수도꼭지에도 빨간색과 파란색은 남아 있다. 손잡이가 하나뿐이어서 표시는 레버 둘레나 꼭지 몸통에 작은 점으로 붙는다.", "손잡이가 둘인 수도꼭지는 대개 왼쪽이 뜨거운 물, 오른쪽이 찬물이다. 미국의 배관 규정은 이 배치를 정해 두고 있다. 레버가 하나인 수도꼭지도 이 배치를 따라서, 레버를 왼쪽으로 젖히면 뜨거운 물이, 오른쪽으로 젖히면 찬물이 나온다. 처음 가 본 곳의 세면대에서도 손이 먼저 방향을 안다.", "욕실 벽에 붙은 샤워 수전에는 손잡이가 하나 더 있는 경우가 많다. 물이 수도꼭지로 나올지 샤워기로 나올지를 정하는 전환 손잡이다. 물을 틀기 전에 전환 손잡이가 어느 쪽을 향하고 있는지 보지 않으면, 머리 위로 찬물을 맞는다.", {"img": "images/articles/t03-4.webp", "w": 6, "ar": "1198 / 871"}, "온도를 숫자로 맞추는 수전도 있다. 이런 수전에는 온도 눈금이 새겨진 손잡이가 달려 있고, 안쪽의 부품이 들어오는 찬물과 뜨거운 물의 비율을 스스로 바꿔 정한 온도를 유지한다. 손잡이를 돌리다 보면 38도 근처에서 더 돌아가지 않는다. 손잡이에 달린 작은 단추를 누른 채 돌려야 그보다 뜨거운 쪽으로 넘어간다. 아이가 실수로 뜨거운 물을 틀지 못하게 막는 장치다. 어린이 약병의 뚜껑처럼, 누르는 동작과 돌리는 동작을 한꺼번에 해야 한다.", "공중화장실의 센서 수도꼭지는 물을 아끼려고 정해진 시간이 지나면 저절로 멈춘다. 손을 대고 있는데 물이 끊기면 손을 뗐다가 다시 대야 한다.", "겨울에 기온이 크게 떨어지면 수도관이 얼어 터지는 일이 생긴다. 지자체와 수도사업소는 한파가 오면 밤새 수도꼭지를 조금 틀어 물이 똑똑 흐르게 해 두라고 안내한다. 흐르는 물은 쉽게 얼지 않기 때문이다. 손잡이가 둘인 수도꼭지는 찬물 쪽만 조금 열면 되지만, 레버 수도꼭지는 레버를 찬물 쪽 끝까지 젖힌 채 살짝만 들어 올려야 한다. 가운데에 두고 들어 올리면 보일러가 돌면서 뜨거운 물이 섞여 나온다. 수도 계량기 옆에도 돌려서 여닫는 밸브가 있다. 이사를 오가거나 집을 오래 비울 때 이 밸브를 잠근다."]}, {"no": "09", "title": "이것 좀 열어줘", "date": "2026년 11월", "verb": "돌리다", "issue": "02", "column": "약불로 오래", "dek": "용기 · Twist-off Cap", "blocks": [{"img": "images/articles/t04-1.webp", "w": 8, "ar": "1400 / 935"}, "새로 산 잼이나 피클 병은 처음 열 때가 가장 힘들다. 손바닥으로 뚜껑을 감싸 쥐고 비틀어도 꿈쩍하지 않으면 결국 옆 사람에게 병을 내밀며 “이것 좀 열어줘”라고 말하게 된다. 미국의 한 포장 회사는 사람들이 이런 병을 열려고 뚜껑을 조리대에 내리치거나, 칼로 틈을 비집거나, 뜨거운 물에 대거나, 고무장갑을 낀다고 소개했다. 칼을 쓰는 방법은 다칠 위험이 있다고 덧붙였다.", "병이 잘 안 열리는 까닭은 병 속의 공기가 빠져 있기 때문이다. 공장에서는 뜨거운 내용물을 담고 증기를 불어 넣으며 뚜껑을 닫는다. 내용물이 식으면 병 안의 압력이 바깥보다 낮아지고, 바깥 공기가 뚜껑을 아래로 누른다. 뚜껑 안쪽 테두리에는 말랑한 밀봉재가 둘려 있어서 병 입구에 눌어붙는다. 이 진공 덕분에 내용물이 오래 상하지 않는다. 열 때는 뚜껑을 돌리는 힘으로 이 진공을 깨야 한다.", {"img": "images/articles/t04-2.webp", "w": 6, "ar": "1024 / 754"}, "유리병에 나사 홈을 내고 금속 뚜껑을 돌려 닫는 방식은 1858년 미국의 양철공 존 랜디스 메이슨이 만든 ‘메이슨 병’에서 널리 퍼졌다. 초기 병조림 병은 뚜껑을 다시 조이거나 쇠 집게를 눌러 잠갔고, 고무 링을 따로 끼워 공기를 막았다. 2차 세계대전 중 미국 정부가 쇠를 아끼려고 권한 유리 뚜껑 병도 젖은 고무 링을 뚜껑 아래 돌기에 끼우는 것으로 봉하기 시작했다. 1915년 미국의 알렉산더 커는 밀봉재를 붙인 납작한 원판과 이를 눌러 주는 나사 고리를 따로 만든 두 조각 뚜껑을 내놓았다. 밀봉재가 뚜껑에 붙어 있으니 고무 링을 따로 챙길 필요가 없었다. 커의 회사는 입구가 넓은 병도 내놓았다. 지금도 집에서 병조림을 할 때 쓰는 방식이다. 원판은 한 번 쓰면 밀봉재가 눌려 다시 쓰지 않고, 고리는 계속 쓴다.", "메이슨 병처럼 나사산이 병 입구를 빙 둘러 이어진 뚜껑은 열 때 한 바퀴 반에서 두 바퀴를 돌려야 했다. 시카고의 화이트 형제가 세운 회사 ‘화이트 캡’은 이보다 편한 뚜껑을 만들었다. 업계 잡지는 형제가 1920년대에 이 뚜껑을 만들었다고 전하고, 시카고의 한 박물관 자료는 회사 연구소가 1950년대에 내놓았다고 적는다. 뚜껑 가장자리 안쪽에 작은 돌기 몇 개를 내고, 병 입구에는 짧게 끊긴 나사산을 냈다. 뚜껑을 4분의 1바퀴쯤 돌리면 돌기가 나사산에서 빠지며 뚜껑이 열린다. 이 돌기를 ‘러그’라고 불러서 이런 뚜껑을 러그 캡, 또는 상표 이름을 따 트위스트 오프라고 한다. 화이트 캡은 1930년 증기로 병 속 공기를 밀어내며 뚜껑을 닫는 방식을 내놓았다. 진공으로 닫는 병뚜껑 가운데 가장 흔한 것이 이 러그 캡이다. 도구 없이 열 수 있고, 다시 닫아 보관하기도 쉽다. 공장에서는 뚜껑을 증기로 데워 밀봉재를 말랑하게 만든 뒤 병에 씌운다.", {"img": "images/articles/t04-3.webp", "w": 4, "ar": "1071 / 1400"}, "그래도 진공은 여전히 손힘을 요구했다. 화이트 캡은 1950년대 초 손가락 길이만 한 T자 모양 따개를 팔았다. 따개에는 ‘뚜껑 밑에 넣고 열쇠처럼 돌리세요’라고 새겨져 있었다. 뚜껑 가장자리를 살짝 들어 올려 공기를 넣는 도구다. 회사 대표 윌리엄 화이트는 이미 1926년 병뚜껑 따개로 특허를 받았고, 케첩 회사 하인즈와 함께 진공 뚜껑 따개 시험품을 만들기도 했다.", "진공으로 닫는 뚜껑을 팔려면 그 뚜껑을 여는 방법도 함께 팔아야 했다.", {"img": "images/articles/t04-4.webp", "w": 8, "ar": "1008 / 691"}, "많은 병뚜껑 가운데에는 동그랗게 눌린 ‘안전 버튼’이 있다. 진공이 유지되는 동안에는 눌려 있다가, 병이 한 번이라도 열렸거나 안에서 세균이 가스를 만들면 위로 튀어 오른다. 소비자에게는 버튼이 올라온 병은 사지 말라고 안내한다. 이런 뚜껑이 일찍부터 쓰인 곳 가운데 하나가 이유식 병이고, 1963년 미국의 한 신문은 튀어 오르는 버튼이 달린 뚜껑을 새 기능으로 소개했다.", {"img": "images/articles/t04-5.webp", "w": 6, "ar": "1024 / 742"}, "병을 여는 힘은 나이가 들수록 모자란다. 1983년의 한 연구는 노인의 손목 비트는 힘을 재면서, 지름이 큰 뚜껑일수록 더 큰 힘을 줄 수 있다는 것을 확인했다. 연구자들은 시판 제품을 여는 데 드는 힘도 함께 재서, 어떤 크기와 힘의 병을 노인 남녀 가운데 몇 퍼센트가 열 수 있는지 추정했다. 스웨덴 예테보리에서 79세 여성 112명과 남성 93명의 손 기능을 조사한 연구에서는 여성이 병을 열 때 내는 힘이 남성의 66% 정도였다. 2011년 영국 스트래스클라이드 대학 연구팀은 뚜껑에 힘 센서를 단 병을 만들어, 평균 26세 젊은이와 평균 76세 노인에게 열게 하고 손에 걸리는 힘을 쟀다. 노인은 자기 최대 악력의 40%를 써서 병을 열었고, 젊은이는 27%를 썼다. 노인은 뚜껑도 절반쯤 느린 속도로 돌렸다. 옆으로 쥐는 힘은 젊은이보다 약하게, 위에서 누르는 힘은 조금 더 세게 주었다. 연구팀은 노인이 더 조심스러운 방식으로 병을 연다고 보았다. 한국의 한 연구는 20~30대 59명과 60~70대 50명에게 가공식품 뚜껑을 열게 하고, 노인이 무리 없이 열 수 있는 뚜껑의 힘을 그들이 낼 수 있는 최대 힘의 70% 정도로 잡았다. 이 연구에서 뚜껑 여는 데 필요한 최대 힘과 악력, 손목이 돌아가는 범위는 70대에 들어 크게 줄었다.", "이 힘을 줄이려는 뚜껑도 나온다. 2019년 미국에서 나온 한 뚜껑은 가운데 버튼을 누르면 작은 틈이 생겨 공기가 들어간다. 이 회사는 소비자 세 명 가운데 한 명꼴로 진공 병을 열지 못한다고 주장한다. 뚜껑을 만든 피트 스토드는 건강 문제로 병을 열지 못하던 친구의 부탁을 받고 8년 동안 이 뚜껑을 개발했다. 회사는 여는 데 드는 돌리는 힘이 보통 러그 캡보다 58% 적다고 밝혔다. 가운데 원판과 바깥 고리를 따로 만들어, 고리를 돌리면 원판이 들리며 진공이 풀리는 두 조각 트위스트 오프 뚜껑도 있다. 진공을 쉽게 풀 수 있게 만든 알루미늄 러그 캡도 노인을 비롯한 모든 사람이 병을 열 수 있게 하려고 개발됐다. 이 뚜껑도 진공이 빠지면 가운데가 오목하던 모양이 평평해져서, 봉인이 풀린 병을 알아볼 수 있다.", {"img": "images/articles/t04-6.webp", "w": 4, "ar": "916 / 1400", "cap": "미국 ‘전국 중독 예방 주간’ 포스터, 1968년."}, "부엌에는 반대로 일부러 열기 어렵게 만든 뚜껑도 있다. 싱크대 아래 배수구 세정제나 곰팡이 제거제 병 뚜껑에는 ‘누르면서 돌리세요’ 화살표가 그려져 있다. 이 뚜껑은 1967년 캐나다 윈저의 소아과 의사 앙리 브로와 플라스틱 회사를 하던 피터 헤지윅이 아이들의 약 중독 사고를 막으려고 만든 ‘팜 앤 턴’에서 시작됐다. 한국소비자원이 2015년부터 2017년까지 접수된 생활화학제품 관련 어린이 사고 200건을 살펴보니 179건이 만 5세 미만 아이에게 일어났고, 가장 많은 품목은 세정제였다. 만 3~4세 아이를 키우는 부모 500명 가운데 59.2%는 아이가 혼자 생활화학제품 용기를 연 적이 있다고 답했다. 가스레인지 손잡이도 대부분 안쪽으로 누르면서 돌려야 불이 붙는다. 삼성전자는 이를 두 단계 동작을 요구하는 국제 안전 기준에 따른 것이라고 설명한다.", "어린이 보호 뚜껑은 손힘이 약한 노인에게도 열기 어려워서, 미국은 한 가지 크기는 일반 뚜껑으로 팔 수 있게 하고 ‘어린아이가 없는 집을 위한 포장’이라고 적도록 했다. 세정제 병은 딸깍 소리가 날 때까지 끝까지 돌려 닫아야 다시 잠긴다. 잼 병은 한 번 열면 다시 진공이 되지 않으니, 뚜껑을 닫아 냉장고에 넣어 둔다."]}, {"no": "10", "title": "3×3×3", "date": "2026년 11월", "verb": "돌리다", "issue": "02", "column": "한 판만 더", "dek": "퍼즐 · Twisty Puzzle", "blocks": [{"img": "images/articles/t05-1.webp", "w": 8, "ar": "933 / 1400"}, "큐브의 한 면을 잡고 비틀면 그 면에 붙은 아홉 칸이 통째로 돈다. 면은 여섯 개이고, 한 면을 돌릴 때마다 그 면 가장자리의 색 조각들이 옆면으로 옮겨 간다. 겉으로 보면 작은 정육면체 27개를 쌓은 것 같지만, 한가운데에는 조각 대신 축이 들어 있다. 겉으로 보이는 조각은 26개이고, 각 면의 가운데 조각은 축에 붙어 제자리에서 돌기만 한다. 조각들은 서로 걸려 있어서 아무리 돌려도 흩어지지 않는다.", "1974년 봄, 부다페스트 응용미술학교에서 실내디자인을 가르치던 서른 살의 에르뇌 루빅은 나무로 첫 큐브를 만들었다. 조각들이 서로 붙어 있으면서도 따로 움직이는 구조를 학생들에게 보여 주려던 것이었다. 루빅은 나무 큐브에 색을 칠해 몇 번 돌려 보았는데, 처음 상태로 되돌릴 수가 없었다. 비슷한 생각을 한 사람은 그 전에도 있었다. 미국의 래리 니컬스는 1972년 자석으로 조각을 붙인 퍼즐로 특허를 받았고, 영국의 프랭크 폭스는 1974년 1월 공 모양의 3×3×3 퍼즐로 영국 특허를 받았다.", {"img": "images/articles/t05-3.webp", "w": 8, "ar": "1194 / 716"}, "루빅은 1975년 헝가리에서 특허를 받았지만 다른 나라에는 특허를 내지 않았다. 큐브는 1977년 말 ‘마법 큐브’라는 이름으로 부다페스트의 장난감 가게에 처음 나왔다. 1980년 미국의 장난감 회사 아이디얼 토이가 세계 판매를 맡으면서 이름이 ‘루빅스 큐브’로 바뀌었다. 회사는 ‘마법’이라는 말이 주술을 떠올리게 한다고 여겼다. 미국에서 처음 매긴 값은 1.99달러였다. 세계 판매를 시작한 뒤 첫 3년 동안 1억 개가 팔렸다. 같은 해 영국의 수학자 데이비드 싱마스터가 낸 책 『루빅의 마법 큐브에 관한 노트』에 실린 맞추는 방법이 널리 퍼졌다. 루빅 자신은 큐브를 장난감보다는 하나의 작품으로 여긴다고 말해 왔다.", "큐브를 섞을 수 있는 경우의 수는 43,252,003,274,489,856,000가지다. 약 4325경이다. 숫자가 너무 커서 당시 포장에는 ‘수십억 가지’라고 적었다. 맞춘 상태는 이 가운데 하나다.", "사람들은 맞추는 방법을 찾는 데서 더 나아가, 가장 적게 돌려서 맞추는 방법을 궁금해했다. 여기서 한 번 돌린다는 것은 면 하나를 90도나 180도 돌리는 것을 말한다. 1980년까지 적어도 18번은 돌려야 맞출 수 있는 상태가 있다는 것이 알려졌고, 1981년 영국의 수학자 모웬 시슬스웨이트는 어떤 상태든 52번이면 맞출 수 있음을 보였다. 그 뒤 30년 가까이 이 두 숫자 사이를 좁히는 계산이 이어졌다. 1992년에는 42번, 2008년에는 22번까지 줄었다. 1995년 마이클 리드는 모든 모서리 조각이 제자리에서 뒤집힌 ‘슈퍼플립’ 상태가 적어도 20번은 돌려야 풀린다는 것을 증명했다.", "2010년 7월, 토마스 로키키와 헤르베르트 코치엠바, 몰리 데이비드슨, 존 데스리지는 어떤 상태든 20번 이하로 맞출 수 있다는 것을 증명했다. 이들은 4325경 가지 상태를 대칭으로 겹치는 것끼리 묶어 줄인 뒤, 구글이 빌려준 컴퓨터로 몇 주 동안 계산했다. 컴퓨터 한 대로 하면 35년쯤 걸릴 계산이었다. 이 20을 ‘신의 수’라고 부른다. 리드의 슈퍼플립은 정확히 20번이 필요한 상태 가운데 하나다.", "큐브의 조각은 세 종류다. 꼭짓점에 있는 조각 8개는 색이 세 개씩 붙어 있고, 모서리 가운데에 있는 조각 12개는 색이 두 개씩, 면 한가운데의 조각 6개는 색이 하나씩 붙어 있다. 가운데 조각은 서로의 자리를 바꾸지 못하기 때문에, 흰색 면의 맞은편은 언제나 같은 색이다. 큐브를 맞춘다는 것은 꼭짓점 조각 8개와 모서리 조각 12개를 제자리에, 제 방향으로 돌려놓는 일이다.", "큐브를 분해했다가 아무렇게나 다시 끼우면 4325경의 열두 배만큼 다른 상태를 만들 수 있다. 그런데 그렇게 끼운 큐브는 열두 개 가운데 하나만 맞출 수 있다. 나머지는 아무리 돌려도 조각 한두 개가 끝까지 뒤집히거나 비틀린 채 남는다. 큐브를 분해해서 맞추려다 오히려 영영 못 맞추게 되는 일은 이 때문에 생긴다. 스티커를 떼어 붙이는 것도 마찬가지다.", "1982년 부다페스트에서 첫 세계 대회가 열렸다. 여러 나라에서 온 참가자가 겨뤘고, 미국 대표로 나온 고등학생 민 타이가 22.95초로 우승했다. 큐브 유행은 그 뒤 몇 해 만에 잦아들었지만, 2000년대 초 인터넷으로 맞추는 방법과 기록이 공유되면서 다시 대회가 열리기 시작했다. 2004년에는 공식 대회와 기록을 관리하는 세계 큐브 협회가 생겼다. 지금 대회용 큐브는 조각 안쪽에 작은 자석을 넣어, 면이 제자리에 오면 착 붙도록 만든다. 손가락 끝으로 튕기듯 면을 돌리기 때문에, 처음 나온 큐브보다 훨씬 가볍게 돈다.", {"img": "images/articles/t05-9.webp", "w": 6, "ar": "766 / 766"}, "3×3×3 말고도 크기가 다른 큐브가 많다. 2×2×2 큐브는 꼭짓점 조각 8개만으로 되어 있다. 1981년에는 4×4×4 큐브가 ‘루빅의 복수’라는 이름으로 나왔다. 4×4×4 큐브에는 제자리에 붙어 있는 가운데 조각이 없다. 면 가운데의 조각 네 개도 돌아다니기 때문에 어느 색이 어느 면인지부터 정해야 한다. 3×3×3에서는 생기지 않는 상태가 마지막에 남아, 이것을 푸는 순서를 따로 외워야 한다. 5×5×5부터는 면 가운데에 다시 고정된 조각이 생긴다. 면이 정십이면체로 된 퍼즐, 정육면체를 비스듬히 잘라 모양이 바뀌는 퍼즐도 나왔다. 어느 것이든 면을 붙잡고 비튼다는 동작은 같다."]}, {"no": "11", "title": "뭐가 나올까", "date": "2026년 11월", "verb": "돌리다", "issue": "02", "column": "한 판만 더", "dek": "자판기 · Capsule Toy Machine", "blocks": [{"img": "images/articles/t06-1.webp", "w": 8, "ar": "1400 / 933"}, "캡슐 뽑기 기계 앞에 서면 할 일은 두 가지다. 동전을 넣고, 손잡이를 끝까지 돌린다. 손잡이가 한 바퀴 도는 동안 기계 안쪽에서 드르륵 소리가 나고, 아래쪽 구멍으로 둥근 플라스틱 캡슐 하나가 떨어진다. 캡슐을 열기 전까지는 무엇이 들었는지 알 수 없다. 기계 앞면에 붙은 그림에는 나올 수 있는 장난감이 모두 그려져 있지만, 어느 것이 나올지는 손잡이를 돌려 봐야 안다. 손잡이는 동전을 넣어야 돌아가고, 한 바퀴를 돌면 다시 잠긴다.", {"img": "images/articles/t06-2.webp", "w": 6, "ar": "766 / 632"}, "이런 기계는 미국에서 먼저 나왔다. 미국에는 동전을 넣고 손잡이를 돌리면 껌볼이 하나씩 나오는 기계가 있었고, 여기에 작은 장난감을 섞어 넣는 일이 생겼다. 제2차 세계대전 무렵에는 미국의 무역 회사 페니 킹의 사장이 이런 기계에 넣을 셀룰로이드 장난감을 사러 일본에 오기도 했다. 1965년 도쿄의 상인 시게타 류조는 미국 거래처에서 받은 기계를 고쳐, 장난감을 플라스틱 캡슐에 하나씩 담아 넣었다. 같은 해 2월 그는 일본 최초의 장난감 자판기 회사인 ‘페니 상회’를 세웠고, 10엔짜리 기계를 동네 과자 가게 앞에 놓았다. 아이들이 그 앞에 모여들었다. 지금 일본에서 그는 ‘가챠가챠 할아버지’라고 불린다.", {"img": "images/articles/t06-3.webp", "w": 6, "ar": "766 / 638"}, "1977년 장난감 회사 반다이가 이 시장에 들어왔다. 당시 캡슐 장난감은 20엔짜리가 대부분이었는데, 반다이는 100엔짜리 기계를 내놓고 그만큼 공들인 장난감을 넣었다. 반다이는 자사 캡슐 장난감에 ‘가샤폰’이라는 이름을 붙였다. 손잡이를 돌릴 때 나는 ‘가샤’ 소리와 캡슐이 떨어질 때 나는 ‘퐁’ 소리를 이은 말이다. 1983년에는 만화 「근육맨」의 인물을 작은 지우개 인형으로 만든 ‘긴케시’를 100엔에 팔았는데, 400가지가 넘게 나왔고 모두 1억 8000만 개가 팔렸다. 1990년대에는 비디오게임과 애니메이션 인물을 모으는 어른들도 캡슐 기계 앞에 섰다. 반다이는 2021년 3월까지 가샤폰 장난감을 37억 개 넘게 팔았고, 2025년 기네스 세계 기록은 가샤폰을 세계에서 가장 큰 캡슐 장난감 브랜드로 올렸다.", {"img": "images/articles/t06-4.webp", "w": 6, "ar": "1400 / 1000"}, "캡슐도 바뀌었다. 위아래 반쪽을 서로 다른 재료로 만들어 끼우던 캡슐을, 반다이는 2012년 한 가지 재료로 위아래가 붙은 캡슐로 바꿨다. 재활용하기 쉽고, 원료도 예전의 6할쯤만 든다. 2014년에는 지름 62mm, 길이 102mm의 원통형 캡슐도 나왔다.", {"img": "images/articles/t06-5.webp", "w": 4, "ar": "933 / 1400"}, "손잡이를 돌려 무엇이 나올지 모르는 물건을 받는 방식은 화면 안으로도 옮겨 갔다. 2010년대 초부터 일본의 모바일 게임에서는 돈을 내고 무작위로 아이템이나 캐릭터를 받는 장치를 ‘가챠’라고 불렀다. 화면에는 손잡이가 없지만 이름은 손잡이 소리에서 왔다. 정해진 묶음을 모두 모으면 특별한 상품을 주는 ‘콤프 가챠’는 2012년 5월 일본 정부의 규제를 받았다. 한국에서는 2024년 3월 22일부터 확률형 아이템을 파는 게임 회사가 그 확률을 이용자에게 공개해야 한다. 최근 3년 동안 평균 매출이 1억 원을 넘는 게임 회사가 대상이다.", {"img": "images/articles/t06-6.webp", "w": 8, "ar": "1400 / 934"}, "기계 안쪽은 생각보다 단순하다. 투명한 통 아래쪽에 구멍이 몇 개 뚫린 원판이 있고, 손잡이가 이 원판과 이어져 있다. 동전을 넣고 손잡이를 돌리면 원판이 한 칸 돌면서 구멍 하나에 빠진 캡슐이 출구 쪽으로 옮겨 가 떨어진다. 캡슐이 통 안에서 엉켜 구멍에 잘 빠지지 않으면 손잡이를 돌려도 아무것도 나오지 않는다.", {"img": "images/articles/t06-7.webp", "w": 6, "ar": "1400 / 1050"}, "기계 앞의 그림에는 한 시리즈에 들어 있는 장난감이 대여섯 가지쯤 그려져 있다. 원하는 하나를 얻으려고 같은 기계에 동전을 거듭 넣다 보면 이미 가진 것이 다시 나온다. 겹친 것을 친구와 바꾸는 일도 캡슐 장난감의 즐거움에 들어간다. 일본에서는 캡슐 장난감 값이 오르면서 지금은 300엔에서 500엔짜리가 많다.", {"img": "images/articles/t06-8.webp", "w": 4, "ar": "1050 / 1400"}, "한국에서도 2020년대 들어 캡슐 뽑기 기계를 수십 대씩 모아 놓은 가게가 번화가와 쇼핑몰에 많이 생겼다. 문구점 앞에 한두 대 놓여 있던 기계가 벽 하나를 채운다. 사람들은 기계 앞을 천천히 지나가며 그림을 하나씩 보고, 지갑에 든 동전 수를 센다. 동전 대신 카드를 대는 기계도 있지만, 장난감을 받으려면 여전히 손잡이를 끝까지 돌려야 한다.", {"img": "images/articles/t06-9.webp", "w": 4, "ar": "933 / 1400"}, "캡슐 장난감은 어른을 위한 물건으로도 자리를 잡았다. 2012년 일본의 기탄 클럽이 내놓은 ‘컵의 후치코’는 사무복을 입은 작은 여자 인형으로, 컵 가장자리에 걸터앉거나 매달리는 자세로 만들어졌다. 책상 위의 컵에 걸어 두는 장난감이었고, 어른들 사이에서 크게 유행했다. 그 뒤로 실제 가전제품이나 식기, 간판을 손톱만 하게 줄인 미니어처가 캡슐 기계에 많이 들어갔다. 이런 장난감은 작게 줄이면서도 실물의 단추나 무늬를 그대로 살린다. 사람들은 캡슐을 열어 보고 그 정교함에 놀라고, 다음 것을 보려고 다시 동전을 넣는다."]}];

const PALETTE = (() => { const c = [...new Set(Object.values(window.IMAGE_COLORS || {}).map(s => s.toLowerCase()))]; return c.length ? c : ['#344164', '#664f3b', '#942d40', '#9f681f', '#7b6182', '#d55d26', '#c25a6d', '#758cb5', '#c7935b', '#e7bf92', '#cfc9c3', '#fcefd8']; })();

/* 색 계열 (2026-11-14): 빨·주·노·초·파·남·보 + 무채색(어두움/밝음). 한 화면의 박스들은 되도록 서로 다른 계열에서 뽑음 */
const hueFamily = c => {
  const [r, g, b] = (c.startsWith('#') ? [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)) : c.match(/\d+/g).map(Number)).map(v => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if (d < 0.12) return (mx + mn) / 2 < 0.5 ? 'k' : 'w';                 // 채도가 거의 없으면 무채색
  let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360;
  return h < 15 || h >= 345 ? 'R' : h < 40 ? 'O' : h < 70 ? 'Y' : h < 165 ? 'G' : h < 235 ? 'B' : h < 265 ? 'N' : 'V';
};
/* 계열을 한 바퀴씩 돌며 뽑은 팔레트: 앞쪽 몇 개는 모두 다른 계열 */
function spreadPalette() {
  const sh = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const groups = {}; PALETTE.forEach(c => (groups[hueFamily(c)] ||= []).push(c));
  const fams = sh(Object.keys(groups)); fams.forEach(f => sh(groups[f]));
  const out = []; for (let k = 0; out.length < PALETTE.length; k++) fams.forEach(f => { if (groups[f][k]) out.push(groups[f][k]); });
  return out;
}
/* 이미 쓴 색들과 계열이 다른 색 하나 (없으면 안 쓴 색 아무거나) */
function pickAway(used) {
  const u = used.filter(Boolean).map(c => c.toLowerCase()), uf = new Set(u.map(hueFamily));
  let free = PALETTE.filter(c => !u.includes(c.toLowerCase()) && !uf.has(hueFamily(c)));
  if (!free.length) free = PALETTE.filter(c => !u.includes(c.toLowerCase()));
  return free[Math.floor(Math.random() * free.length)];
}

const HEAT = {
  heat: true,
  heatMax: 0.6,              // 가장 뜨거운 색의 위치 (0.6 = 빨강)
  heatBlob: 0.6,             // 움직이는 사진 덩어리 열의 번짐 크기 (칸 대비)
  heatScroll: [0, 0],  // 스크롤 잔상 세기 (최대, 스크롤 1px당)
  heatScrollBlob: 0.25,      // 스크롤 잔상의 번짐 크기 (칸 대비)
  heatFollow: 1,           // 스크롤할 때 열이 페이지를 따라가는 정도
};
/* ═════════ 히트맵: 아티클 글은 마우스 열만 (스크롤·움직임 열 없음) ═════════ */
const heat = (() => {
  const S = 0.25;                       // 해상도 (화면의 1/4)
  const canvas = document.getElementById('heat');
  if (!HEAT.heat) { canvas.remove(); return { track() {} }; }     // 히트맵 끈 버전: 빈 칸은 그냥 검정
  const ctx = canvas.getContext('2d');
  const small = document.createElement('canvas'), sctx = small.getContext('2d');
  let W, H, fw, fh, T, B, M, Q, img, running = false, lastScroll = scrollY, acc = 0;
  const movers = new Map();
  const mouse = { x: 0, y: 0, has: false, trail: [] };
  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = W; canvas.height = H;
    fw = Math.ceil(W * S); fh = Math.ceil(H * S);
    small.width = fw; small.height = fh;
    T = new Float32Array(fw * fh); B = new Float32Array(fw * fh);
    M = new Float32Array(fw * fh); Q = new Float32Array(fw * fh);
    img = sctx.createImageData(fw, fh);
  }
  function add(x, y, w, h, k, soft) {
    const m = soft * 3;
    const x0 = Math.max(0, Math.floor((x - m) * S)), x1 = Math.min(fw - 1, Math.ceil((x + w + m) * S));
    const y0 = Math.max(0, Math.floor((y - m) * S)), y1 = Math.min(fh - 1, Math.ceil((y + h + m) * S));
    for (let j = y0; j <= y1; j++) {
      const py = j / S, dy = Math.max(y - py, 0, py - (y + h));
      for (let i = x0; i <= x1; i++) {
        const px = i / S, dx = Math.max(x - px, 0, px - (x + w));
        const v = Math.exp(-(dx * dx + dy * dy) / (2 * soft * soft));
        if (v < 0.01) continue;
        const n = j * fw + i; T[n] = Math.min(1, T[n] + v * k);
      }
    }
  }
  /* 덩어리 열: 함께 움직이는 사진들을 한 장의 판(M)에 찍고, 크게 흐리게 한 뒤 열로 더함
     → 사진 하나하나의 네모(그리드)가 아니라 한 덩어리의 잔상으로 남음 */
  let massDirty = false;
  function stamp(x, y, w, h) {
    const x0 = Math.max(0, Math.floor(x * S)), x1 = Math.min(fw, Math.ceil((x + w) * S));
    const y0 = Math.max(0, Math.floor(y * S)), y1 = Math.min(fh, Math.ceil((y + h) * S));
    for (let j = y0; j < y1; j++) M.fill(1, j * fw + x0, j * fw + x1);
    if (x1 > x0 && y1 > y0) massDirty = true;
  }
  function blur(r) {                    // 가로·세로 상자 흐림 (두 번 = 부드러운 번짐)
    for (let pass = 0; pass < 2; pass++) {
      for (let j = 0; j < fh; j++) {     // 가로 → Q
        const o = j * fw; let s = 0;
        for (let i = -r; i <= r; i++) s += M[o + Math.min(fw - 1, Math.max(0, i))];
        for (let i = 0; i < fw; i++) {
          Q[o + i] = s / (2 * r + 1);
          s += M[o + Math.min(fw - 1, i + r + 1)] - M[o + Math.max(0, i - r)];
        }
      }
      for (let i = 0; i < fw; i++) {     // 세로 → M
        let s = 0;
        for (let j = -r; j <= r; j++) s += Q[Math.min(fh - 1, Math.max(0, j)) * fw + i];
        for (let j = 0; j < fh; j++) {
          M[j * fw + i] = s / (2 * r + 1);
          s += Q[Math.min(fh - 1, j + r + 1) * fw + i] - Q[Math.max(0, j - r) * fw + i];
        }
      }
    }
  }
  function flushMass(k, size = HEAT.heatBlob) {
    if (!massDirty) return;
    blur(Math.max(1, Math.round(innerWidth / 12 * S * size)));
    for (let n = 0; n < M.length; n++) if (M[n] > 0.01) T[n] = Math.min(1, T[n] + M[n] * k);
    M.fill(0); massDirty = false;
  }
  function color(v) {                    // 검정 → 파랑 → 초록 → 노랑 → 빨강 (heatMax에서 멈춤) — 2026-10-17 다시 이 색으로
    const S = [[0.0, 0, 0, 0], [0.06, 0, 0, 0], [0.285, 30, 40, 220], [0.48, 0, 235, 60], [0.54, 255, 230, 0], [0.585, 235, 0, 10], [0.6, 235, 0, 10], [1, 235, 0, 10]];   // 검정 2 : 파랑 5.5 : 초록 1 : 노랑 1 : 빨강 0.5 (2026-10-14)
    let i = 1; while (i < S.length - 1 && v > S[i][0]) i++;
    const [a, b] = [S[i - 1], S[i]], t = Math.min(1, Math.max(0, (v - a[0]) / (b[0] - a[0])));
    return [a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, a[3] + (b[3] - a[3]) * t];
  }
  function frame() {
    /* 스크롤: 열은 페이지를 일부만 따라감(HEAT.heatFollow) → 화면 위를 지나가는 아이템이 빈 칸에 잔상을 남김 */
    const dyScroll = scrollY - lastScroll;
    acc += dyScroll * S * HEAT.heatFollow; lastScroll = scrollY;
    if (dyScroll && HEAT.heatScroll[0]) {
      const cell = innerWidth / 12, k = Math.min(HEAT.heatScroll[0], Math.abs(dyScroll) * HEAT.heatScroll[1]);
      document.querySelectorAll('.item').forEach(el => {          // 화면에 보이는 사진들
        const r = el.getBoundingClientRect();
        if (r.top > H || r.bottom < 0) return;
        stamp(r.left, r.top, r.width, r.height);
      });
      flushMass(k, HEAT.heatScrollBlob);
    }
    const n = Math.trunc(acc);
    if (n) {
      acc -= n;
      if (Math.abs(n) >= fh) T.fill(0);
      else if (n > 0) { T.copyWithin(0, n * fw); T.fill(0, (fh - n) * fw); }
      else { T.copyWithin(-n * fw, 0, (fh + n) * fw); T.fill(0, 0, -n * fw); }
    }
    /* 마우스 */
    mouse.trail.forEach(p => add(p.x, p.y, 0, 0, p.k, 26));
    mouse.trail.length = 0;
    /* 밀려나는 아이템: 지금 있는 자리 전체에 열 → 빈 칸을 지나가면 그 자리에 자국 */
    const now = performance.now();
    movers.forEach((until, el) => {
      if (now > until || !el.isConnected) { movers.delete(el); return; }
      const r = el.getBoundingClientRect();
      stamp(r.left, r.top, r.width, r.height);
    });
    flushMass(0.025);
    /* 식고 퍼짐 */
    let max = 0;
    for (let j = 0; j < fh; j++) for (let i = 0; i < fw; i++) {
      const k = j * fw + i;
      const l = i > 0 ? T[k - 1] : T[k], r = i < fw - 1 ? T[k + 1] : T[k];
      const u = j > 0 ? T[k - fw] : T[k], d = j < fh - 1 ? T[k + fw] : T[k];
      B[k] = (T[k] * 0.6 + (l + r + u + d) * 0.1) * 0.988;   // 식는 속도 (10/14: 0.986 → 0.975 → 10/17: 0.988 잔열이 오래 남게)
      if (B[k] > max) max = B[k];
    }
    [T, B] = [B, T];
    const px = img.data;
    for (let k = 0, p = 0; k < T.length; k++, p += 4) {
      const v = T[k];
      if (v < 0.01) { px[p + 3] = 0; continue; }
      const c = color(Math.min(1, v) * HEAT.heatMax);   // 검정 바탕 위에서 남색 → 파랑 → 보라 → 빨강 (가장 뜨거운 곳 = 빨강, 노랑·흰색은 안 씀)
      px[p] = c[0]; px[p + 1] = c[1]; px[p + 2] = c[2];
      px[p + 3] = 255 * Math.min(1, v / 0.12);
    }
    sctx.putImageData(img, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(small, 0, 0, W, H);
    if (max < 0.004 && !movers.size && !mouse.trail.length && !dyScroll) { T.fill(0); ctx.clearRect(0, 0, W, H); running = false; return; }
    requestAnimationFrame(frame);
  }
  function wake() { if (!running) { running = true; lastScroll = scrollY; acc = 0; requestAnimationFrame(frame); } }
  /* 마우스: 지나간 경로를 따라 열을 남김 (히트맵은 사진·박스 아래 층이라 빈 칸에서만 보임) */
  addEventListener('pointermove', e => {
    const x = e.clientX, y = e.clientY;
    if (mouse.has) {
      const dx = x - mouse.x, dy = y - mouse.y, dist = Math.hypot(dx, dy);
      const steps = Math.max(1, Math.ceil(dist / 10)), k = Math.min(dist / 30, 1) * 0.5;
      for (let s = 1; s <= steps; s++) mouse.trail.push({ x: mouse.x + dx * s / steps, y: mouse.y + dy * s / steps, k: k / steps });
    }
    mouse.x = x; mouse.y = y; mouse.has = true;
    wake();
  }, { passive: true });
  document.addEventListener('pointerleave', () => { mouse.has = false; });
  addEventListener('scroll', () => { if (!running) { running = true; requestAnimationFrame(frame); } }, { passive: true });   // 스크롤도 열을 만듦
  resize();
  addEventListener('resize', resize);
  return { track(el, ms) { movers.set(el, performance.now() + ms); wake(); } };
})();

  markToc();
}
addEventListener('scroll', onScroll, { passive: true });
onScroll();
/* ═════════ 맨 위로 ↑ (모든 페이지 공통) ═════════ */
(() => {
  const up = document.getElementById('toTop');
  up.addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));
  addEventListener('scroll', () => {
    if (!up.dataset.painted && colors.name) { paint(up, colors.name); up.dataset.painted = 1; }
    up.classList.toggle('show', scrollY > innerWidth / 24);   // 반 칸 이상 내리면
  }, { passive: true });
})();
</script>
<script>
/* 2026-10-17 공통: ① 새로고침하면 항상 그 페이지 맨 위에서 시작 (브라우저가 스크롤 자리를 기억하지 않게)
   ② (11/11 뺌) 2분 자리 비움 → 메인 이동 */
(() => {
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  addEventListener('load', () => scrollTo(0, 0));
  addEventListener('pageshow', e => { if (e.persisted) scrollTo(0, 0); });
  /* 11/11: 2분 자리 비움 → 메인 이동은 뺌. 전시용 창(전시_시작.command)에서만 1분 뒤 메인으로 돌아감 */
})();
</script>
<script>
/* ═════════ 박스로 다른 페이지에 갈 때 (10/22) ═════════
   - 박스가 가까운 화면 가장자리 쪽으로 접힘 (왼쪽 절반에 있으면 왼쪽으로, 오른쪽 절반이면 오른쪽으로)
   - 글자는 크기 그대로, 접히는 쪽 끝으로 몰리며 함께 잘려 나감
   - 같은 줄에서 접히는 반대편에 있던 박스·사진들이 비는 자리로 당겨져 옴 (가까운 것부터, 사진은 단색 꼬리)
   - 다 접히면 이동. 뒤로가기로 돌아오면 원래대로 */
(() => {
  const LEAVE = { dur: 450, step: 22, ease: 'cubic-bezier(.4, 0, .2, 1)' };
  const cell = () => innerWidth / 12;
  function leaveFold(box, href, wait = 0) {   // wait: 이동까지 최소 시간 (다른 퇴장 모션과 함께 쓸 때)
    if (box._leaving) return;
    box._leaving = true;
    const B = box.getBoundingClientRect(), W = B.width, toLeft = B.left + W / 2 < innerWidth / 2;
    box.style.overflow = 'hidden';
    box.animate(toLeft
      ? [{ width: W + 'px' }, { width: '0px' }]                                            // 오른쪽 변이 왼쪽으로
      : [{ width: W + 'px', transform: 'none' }, { width: '0px', transform: `translateX(${W}px)` }],   // 왼쪽 변이 오른쪽으로
      { duration: LEAVE.dur, easing: LEAVE.ease, fill: 'forwards' });
    const hasHeat = typeof heat !== 'undefined' && heat && typeof heat.track === 'function';
    if (hasHeat) heat.track(box, LEAVE.dur + 50, true, true);
    let last = 0;
    [...box.parentElement.children].forEach(e => {
      if (e === box || e.classList.contains('hole') || e.classList.contains('tail')) return;
      const cs = getComputedStyle(e); if (cs.position === 'fixed' || cs.display === 'none') return;
      const r = e.getBoundingClientRect();
      if (!r.width || r.bottom < 0 || r.top > innerHeight) return;
      if (r.top >= B.bottom - 1 || r.bottom <= B.top + 1) return;         // 같은 줄(세로로 겹치는 것)만
      if (toLeft ? r.left < B.right - 1 : r.right > B.left + 1) return;    // 접히는 반대편만
      const dx = toLeft ? -W : W, gap = toLeft ? r.left - B.right : B.left - r.right;
      const delay = Math.round(gap / cell()) * LEAVE.step;
      let move = LEAVE.dur;
      if (e.classList.contains('item') && typeof makeTail === 'function') {   // 사진: 사진 밀림과 같은 단색 꼬리
        const to = { left: r.left + dx, right: r.right + dx, top: r.top, bottom: r.bottom, width: r.width, height: r.height };
        try { move = makeTail(e, r, to, delay, LEAVE.dur, LEAVE.ease); } catch (_) {}
      }
      e.animate([{ transform: 'none' }, { transform: `translateX(${dx}px)` }], { duration: move, delay, easing: LEAVE.ease, fill: 'forwards' });
      if (hasHeat) heat.track(e, delay + LEAVE.dur + 50);
      last = Math.max(last, delay);
    });
    setTimeout(() => { location.href = href; }, Math.max(wait, Math.max(LEAVE.dur, last + LEAVE.dur * .6) + 40));
  }
  /* 11/7: 박스를 누르면 누른 박스는 그대로 두고, 화면에 보이는 다른 박스·사진이 그 박스 쪽으로 접히며 밑으로 들어감
     (같은 줄은 가로로, 같은 열은 세로로, 대각선은 더 먼 쪽 축으로. 가까운 것부터 차례로). 아티클 목차의 글 줄은 위 leaveFold 그대로 */
  function gatherInto(box, href, opt = {}) {
    if (box._leaving) return;
    box._leaving = true;
    const B = box.getBoundingClientRect(), c = cell(), MAX = opt.max || 3;
    if (getComputedStyle(box).position === 'static') box.style.position = 'relative';
    box._z = box.style.zIndex; box.style.zIndex = 40;
    const hasHeat = typeof heat !== 'undefined' && heat && typeof heat.track === 'function';
    /* 11/7: 위·아래·왼쪽·오른쪽 각각 바로 붙은 쪽으로 많아야 2~3개만 (같은 줄/같은 열, 4칸 안). 대각선·먼 것은 그대로 */
    const side = { l: [], r: [], u: [], d: [] };
    (opt.only || document.querySelectorAll('.box, .item')).forEach(e => {
      if (e === box || e.contains(box) || box.contains(e) || e.closest('#menu, .dock')) return;
      const cs = getComputedStyle(e); if (cs.position === 'fixed' || cs.display === 'none' || cs.visibility === 'hidden') return;
      const r = e.getBoundingClientRect();
      if (!r.width || !r.height || r.bottom < 0 || r.top > innerHeight || r.right < 0 || r.left > innerWidth) return;
      const row = r.top < B.bottom - 1 && r.bottom > B.top + 1, col = r.left < B.right - 1 && r.right > B.left + 1;
      if (row && r.left >= B.right - 1) side.r.push({ e, r, gap: r.left - B.right });
      else if (row && r.right <= B.left + 1) side.l.push({ e, r, gap: B.left - r.right });
      else if (col && r.top >= B.bottom - 1) side.d.push({ e, r, gap: r.top - B.bottom });
      else if (col && r.bottom <= B.top + 1) side.u.push({ e, r, gap: B.top - r.bottom });
    });
    let last = 0;
    Object.entries(side).forEach(([k, list]) => {
      list.sort((a, b) => a.gap - b.gap).filter(x => opt.only || x.gap < c * 4).slice(0, opt.only ? Infinity : MAX).forEach(({ e, r, gap }) => {
        const to = k === 'r' ? { transform: `translateX(${B.right - r.left}px)`, clipPath: 'inset(0 100% 0 0)' }
                 : k === 'l' ? { transform: `translateX(${B.left - r.right}px)`, clipPath: 'inset(0 0 0 100%)' }
                 : k === 'd' ? { transform: `translateY(${B.bottom - r.top}px)`, clipPath: 'inset(0 0 100% 0)' }
                 :             { transform: `translateY(${B.top - r.bottom}px)`, clipPath: 'inset(100% 0 0 0)' };
        const delay = Math.round(gap / c) * LEAVE.step;
        e.animate([{ transform: 'none', clipPath: 'inset(0 0 0 0)' }, to], { duration: LEAVE.dur, delay, easing: LEAVE.ease, fill: 'forwards' });
        if (hasHeat) heat.track(e, delay + LEAVE.dur + 50);
        last = Math.max(last, delay);
      });
    });
    setTimeout(() => { location.href = href; }, Math.max(opt.wait || 0, last + LEAVE.dur + 60));
  }
  window.gatherInto = gatherInto;
  window.leaveFold = leaveFold;                                              // 아티클 목차의 글 줄에서도 씀
  document.addEventListener('click', e => {
    const a = e.target.closest('a.box[href]');
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target === '_blank') return;
    const href = a.getAttribute('href'); if (!href || href.startsWith('#')) return;
    /* 11/7: 일반 박스는 아무것도 접히지 않고 바로 이동 (아티클 목차 줄·메뉴만 따로 움직임) */
  });
  /* 메뉴 (11/14): 누른 칸의 색이 메뉴 칸들을 덮은 뒤 이동 (메뉴는 접지 않음) */
  document.addEventListener('click', e => {
    const a = e.target.closest('#menu a[href]');
    if (!a || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault(); e.stopPropagation();
    if (a._leaving) return; a._leaving = true;
    /* 11/14 고침: 화면 전체가 아니라 메뉴 칸들(햄버거 칸 + 메뉴 칸)만 누른 칸 색으로 덮임 — 누른 칸에서 위아래로 번짐 */
    const cells = [document.getElementById('fab'), ...document.querySelectorAll('#menu a, #menu button')].filter(Boolean).map(x => x.getBoundingClientRect());
    const L = Math.min(...cells.map(q => q.left)), T = Math.min(...cells.map(q => q.top)), R = Math.max(...cells.map(q => q.right)), B = Math.max(...cells.map(q => q.bottom));
    const r = a.getBoundingClientRect();
    const c = document.createElement('div'); c.className = 'menu-cover';
    c.style.cssText = `position:fixed; left:${L}px; top:${T}px; width:${R - L}px; height:${B - T}px; z-index:1000; pointer-events:none; background:${getComputedStyle(a).backgroundColor}`;
    document.body.appendChild(c);
    c.animate([{ clipPath: `inset(${r.top - T}px 0px ${B - r.bottom}px 0px)` }, { clipPath: 'inset(0px 0px 0px 0px)' }],
              { duration: 380, easing: 'cubic-bezier(.4, 0, .2, 1)', fill: 'forwards' });
    setTimeout(() => { location.href = a.href; }, 460);
  }, true);
  addEventListener('pageshow', e => { if (e.persisted) document.querySelectorAll('.menu-cover').forEach(x => x.remove()); });
  addEventListener('pageshow', e => {                                         // 뒤로가기로 돌아왔을 때 접힌 채로 남지 않게
    if (!e.persisted) return;
    document.getAnimations().forEach(x => x.cancel());
    document.querySelectorAll('.tail').forEach(t => t.remove());
    document.querySelectorAll('a.box').forEach(b => { b._leaving = false; b.style.overflow = ''; if ('_z' in b) { b.style.zIndex = b._z; delete b._z; } });
    const m = document.getElementById('menu'), f = document.getElementById('fab');
    if (m) { m.classList.remove('on'); m.querySelectorAll('a').forEach(x => { x._leaving = false; x.style.visibility = ''; x.style.transform = ''; x.style.zIndex = ''; if (x._clone) { x._clone.remove(); x._clone = null; } }); } if (f) f.classList.remove('open');
  });
})();
</script>
<script>
/* ═════════ 박스로 이동 (11/7): 누른 박스 안만 비슷한 색 단색 면이 네 방향 중 하나에서 덮은 뒤 이동. 다른 박스·사진은 건드리지 않음 ═════════ */
(() => {
  const DUR = 380, EASE = 'cubic-bezier(.4, 0, .2, 1)';
  function cover(box, color) {
    const c = document.createElement('i');
    c.className = 'sweep';
    c.style.cssText = `position:absolute; inset:0; z-index:5; pointer-events:none; background:${color}`;
    if (getComputedStyle(box).position === 'static') box.style.position = 'relative';
    box.style.overflow = 'hidden';
    box.appendChild(c);
    return c;
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('a.box[href]');
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target === '_blank') return;
    const href = a.getAttribute('href'); if (!href || href.startsWith('#')) return;
    e.preventDefault();
    if (a._leaving) return; a._leaving = true;
    const c = cover(a, 'color-mix(in srgb, var(--bg) 45%, var(--fg))');   // 박스 색과 글자 색 사이 단색
    const from = ['inset(0 100% 0 0)', 'inset(0 0 0 100%)', 'inset(0 0 100% 0)', 'inset(100% 0 0 0)'][Math.floor(Math.random() * 4)];   // 왼쪽·오른쪽·위·아래 중 하나에서 덮음
    c.animate([{ clipPath: from }, { clipPath: 'inset(0 0 0 0)' }], { duration: DUR, easing: EASE, fill: 'forwards' });
    setTimeout(() => { location.href = a.href; }, DUR + 40);
  });
  addEventListener('pageshow', e => {
    if (!e.persisted) return;
    document.querySelectorAll('.sweep').forEach(s => s.remove());
    document.querySelectorAll('a.box').forEach(b => { b._leaving = false; });
  });
})();
</script>
<script>
/* 11/14: 메뉴의 '폼을 보아하니' → 메인으로 가서 개요가 저절로 열림 (표시만 남기고 이동은 메뉴 덮기가 함) */
document.addEventListener('click', e => { if (e.target.closest('#menu a:first-child')) { try { sessionStorage.setItem('ov-open', '1'); } catch (_) {} } }, true);
</script>
