<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아티클 — 해봐야 아는 것들</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --cols: 12;
    --cell: calc(100vw / var(--cols));
    --u: calc(100vw / 1920);
    --gut:      calc(var(--u) * 30);   /* 박스 안쪽 거터 30 */
    --pad:      calc(var(--u) * 40);   /* 글 블록 좌우 여백 40 */
    --fs-title: calc(var(--u) * 25);
    --fs-sub:   calc(var(--u) * 15);
    --fs-head:  calc(var(--u) * 20);   /* 아티클 번호·제목 20 */
    --fs-body:  calc(var(--u) * 15);   /* 본문 15 */
    --lh-body:  calc(var(--u) * 20);   /* 본문 행간 20 */
    --ease: cubic-bezier(.3, 0, .2, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; color: #fff; }
  body { font-family: "Pretendard", -apple-system, sans-serif; overflow-x: hidden; }

  /* ───────── 배경 사진 그리드 (홈과 같음: 단색 → 호버하면 원본) ───────── */
  .grid {
    position: relative;
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--cell));
    grid-auto-rows: var(--cell);
  }
  .cell { position: relative; contain: layout paint; }
  .cell::before, .cell::after { content: ''; position: absolute; inset: 0; }
  .cell::before { background: #111 var(--img) center / cover; }
  .cell::after  { background: var(--solid, #222); transition: opacity .6s ease-out; pointer-events: none; }
  .cell:hover::after { opacity: 0; transition: opacity .2s ease-out; }

  /* ───────── 고정 박스: 아티클(왼쪽 위 2×1) · 프로젝트 이름(오른쪽 위 2×2) ─────────
     스크롤해도 늘 같은 자리. 색만 들어올 때마다 팔레트에서 랜덤 */
  .nav {
    position: fixed; top: 0; z-index: 20;
    color: var(--box-fg);
    text-decoration: none;
  }
  .nav-in { position: absolute; inset: 0; background: var(--box-bg); }
  .nav-article { left: 0; width: calc(var(--cell) * 2); height: var(--cell); }
  .nav-name    { right: 0; width: calc(var(--cell) * 2); height: calc(var(--cell) * 2); cursor: pointer; }

  /* 아티클 박스: 첫 칸 가운데에 화살표, 둘째 칸 가운데에 '아티클' */
  .nav-article .arrows, .nav-article .title {
    position: absolute; top: 0; height: 100%; width: var(--cell);
    display: flex; align-items: center; justify-content: center;
  }
  .nav-article .arrows { left: 0; gap: calc(var(--u) * 8); }
  .nav-article .title  { left: var(--cell); font-size: var(--fs-title); line-height: 1; }
  .arrow {
    width: calc(var(--u) * 28); height: calc(var(--u) * 28);
    display: flex; align-items: center; justify-content: center;
    background: none; border: 0; color: inherit; cursor: pointer;
  }
  .arrow svg { width: calc(var(--u) * 9); height: calc(var(--u) * 16); }
  .arrow:disabled { opacity: .35; cursor: default; }   /* 이전·다음 글이 없을 때 */
  .arrow:not(:disabled):hover svg { transform: translateX(calc(var(--u) * var(--dir, 0) * 3)); }
  .arrow svg { transition: transform .2s var(--ease); }

  .nav-name .title { position: absolute; left: var(--gut); top: var(--gut); font-size: var(--fs-title); line-height: 1; white-space: nowrap; }
  .nav-name .sub   { position: absolute; right: var(--gut); bottom: var(--gut); font-size: var(--fs-sub); line-height: 1; white-space: nowrap; }

  /* ───────── 아티클 판 (가운데 8칸 × 필요한 만큼의 행, 검정) ───────── */
  .panel {
    position: absolute;
    left: calc(var(--cell) * 2); top: var(--cell);
    width: calc(var(--cell) * 8);
    height: calc(var(--cell) * var(--rows, 6));
    background: #000;
    z-index: 5;
    display: grid;
    grid-template-columns: repeat(8, var(--cell));
    grid-auto-rows: var(--cell);
  }
  .head {
    grid-column: 1 / span 8; grid-row: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--u) * 8);
    font-size: var(--fs-head); line-height: 1;
  }
  .blk-img { position: relative; overflow: hidden; background: #111; }
  .blk-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .blk-text {
    padding: 0 var(--pad);
    font-size: var(--fs-body); line-height: var(--lh-body);
    word-break: keep-all;
    align-self: start;               /* 높이는 글만큼 (행 수 계산용) */
  }
  .blk-text.right { text-align: right; }
  .soon { grid-column: 1 / span 8; grid-row: 2; align-self: center; text-align: center; font-size: var(--fs-body); opacity: .6; }
  .nav-article .title { cursor: pointer; color: inherit; text-decoration: none; }
  .blk-text p + p { margin-top: 0; }
  .blk-text p.gap { margin-top: var(--lh-body); }   /* 소제목 앞 한 줄 띄움 */

  /* ───────── 들어오고 나가기: 한 꼭짓점에서 커지고, 같은 꼭짓점으로 줄어듦 ───────── */
  @keyframes inTL  { from { clip-path: inset(0 100% 100% 0); } to { clip-path: inset(0); } }
  @keyframes inTR  { from { clip-path: inset(0 0 100% 100%); } to { clip-path: inset(0); } }
  @keyframes outTL { from { clip-path: inset(0); } to { clip-path: inset(0 100% 100% 0); } }
  @keyframes outTR { from { clip-path: inset(0); } to { clip-path: inset(0 0 100% 100%); } }
  @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
  .nav-article .nav-in, .panel { animation: inTL .8s var(--ease) both; }
  .nav-name .nav-in            { animation: inTR .8s var(--ease) .09s both; }
  .nav-article > :not(.nav-in), .nav-name > :not(.nav-in) { animation: fade .4s ease-out .6s both; }
  .panel > * { animation: fade .5s ease-out .7s both; }
  body.leaving .nav-article .nav-in, body.leaving .panel { animation: outTL .6s var(--ease) both; }
  body.leaving .nav-name .nav-in { animation: outTR .6s var(--ease) both; }
  body.leaving .nav > :not(.nav-in), body.leaving .panel > * { animation: fade .2s ease-out reverse both; }

  @media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; } }
</style>
</head>
<body>

<main class="grid" id="grid">
  <article class="panel" id="panel"></article>
</main>

<nav>
  <div class="nav nav-article" id="navArticle">
    <div class="nav-in"></div>
    <div class="arrows">
      <button class="arrow" id="prev" type="button" aria-label="이전 아티클" style="--dir:-1">
        <svg viewBox="0 0 9 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1 1 8l7 7"/></svg>
      </button>
      <button class="arrow" id="next" type="button" aria-label="다음 아티클" style="--dir:1">
        <svg viewBox="0 0 9 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m1 1 7 7-7 7"/></svg>
      </button>
    </div>
    <a class="title" id="toToc" href="articles.html" aria-label="아티클 목차">아티클</a>
  </div>
  <a class="nav nav-name" id="navName" href="index.html" aria-label="홈으로">
    <div class="nav-in"></div>
    <span class="title">해봐야 아는 것들</span>
    <span class="sub">interface archiving</span>
  </a>
</nav>

<script>
/* ───────── 설정 ───────── */
const CONFIG = {
  imageCount: 64,
  path: n => `images/A${String(n).padStart(4, '0')}.png`,
  home: 'index.html',                 // 프로젝트 이름을 누르면 가는 곳 (홈을 거치지 않고 바로 들어왔을 때)
  page: 'article.html',               // 이 파일 이름 (이전·다음 이동에 씀)
  extraRows: 2,                       // 아티클 판 아래로 더 보이는 사진 줄 수
};

/* ───────── 아티클 목록 ─────────
   blocks: 위에서부터 차례로 배치. 칸 번호는 가운데 판(8칸) 안에서 1~8
   - img:  { src, col, w, h }       사진: col번째 칸부터 w칸 × h행 (칸에 꽉 차게 잘림)
   - text: { col, w, align, paras } 글: col번째 칸부터 w칸. 높이는 글 길이에 맞춰 행 단위로 자동
   한 블록 안의 사진과 글은 같은 행에서 시작하고, 블록 사이엔 한 행을 비움 */
const ARTICLES = [
  { no: '01', title: '버튼의 탄생과 소멸', blocks: [] },
  { no: '02', title: '발로 조작하는 것들', blocks: [] },
  {
    no: '03',
    title: '트리거의 계보',
    blocks: [
      {
        img:  { src: 'images/t1.png', col: 2, w: 4, h: 3 },
        text: { col: 6, w: 3, align: 'left', paras: [
          '인간의 손가락은 참으로 간사하면서도 매혹적인 도구다. 무언가를 누르는 ‘버튼(Button)’이 이성적인 결정의 영역이라면, 손가락을 걸고 지그시 잡아당기는 ‘트리거(Trigger)’는 지극히 본능적이고 역동적인 행위의 영역에 가깝다.',
          '물건을 작동시키는 수많은 인터페이스 중에서도 ‘당기는 동작’에 최적화된 형태들은 오랜 시간 독자적인 진화를 거쳐왔다. 대표적인 세 선수, 총기의 방아쇠, 전동드릴, 그리고 분무기(스프레이 노즐)를 살펴보면 이들이 직업도, 족보도 다르면서 왜 하나같이 닮아 있는지 알 수 있다.',
          { gap: true, t: '원조의 매운맛: 총기의 방아쇠 (Firearm Trigger)' },
          '트리거라는 단어의 고향이자 ‘당김’의 미학을 완성한 원조다. 총기의 방아쇠는 검지손가락 마디에 착 감기는 완만한 곡선 형태를 띤다. 여기에 손가락이 미끄러지지 않도록 금속 표면에 미세한 톱니(Serrations)를 파놓기도 한다.',
          '무엇보다 방아쇠의 핵심은 주변을 감싸고 있는 ‘방아쇠 울(Trigger Guard)’에 있다. 의도치 않은 외력에 작동하는 것을 막아주는 이 조그만 울타리는, 사용자로 하여금 “오직 내 검지손가락만이 이 공간의 지배자”라는 묘한 통제감을 선사한다. 당기는 순간 느껴지는 적절한 장력과 ‘깍’ 하고 넘어가는 작동감(Break)은 인류가 만든 가장 치명적이면서도 정교한 촉각 피드백 중 하나다.',
        ] },
      },
      {
        text: { col: 1, w: 4, align: 'right', paras: [
          '현장의 마에스트로: 전동드릴의 건형 스위치 (Pistol Grip Switch)',
          '건축 현장이나 DIY 가구 조립 현장에서 만나는 전동드릴은 총기의 형태를 가장 적극적으로 오마주한 산업용 인터페이스다. 형태는 총기의 방아쇠와 판박이지만, 내부 메커니즘은 훨씬 다정해졌다.',
          '전동드릴의 트리거는 단순히 켜고 끄는(ON/OFF) 스위치가 아니다. 손가락을 살짝 당기면 나사가 천천히 돌고, 깊게 꽉 쥐어 당길수록 RPM이 가파르게 올라가는 ‘가변 속도 제어(Variable Speed Control)’ 역할을 한다. 묵직한 권총 손잡이(Pistol Grip)를 쥐고 검지 끝의 힘 조절만으로 모터의 출력을 자유자재로 지배할 때, 작업자는 순간적으로 유능한 마에스트로가 된 듯한 착각에 빠진다.',
        ] },
        img:  { src: 'images/t2.png', col: 5, w: 3, h: 2 },
      },
      {
        text: { col: 4, w: 4, align: 'left', paras: [
          '일상의 에이스: 스프레이 노즐 (Spray Trigger)',
          '집 안 구석구석 분무기나 청소용 세제에서 만나는 스프레이 노즐은 가장 대중적이고 친숙한 형태다. 총이나 드릴과 달리, 한두 손가락이 아닌 검지와 중지 두 손가락을 동시에 걸칠 수 있도록 길쭉하게 늘려놓은 트리거가 특징이다.',
          '액체를 피스톤으로 압축해 분사해야 하므로 제법 힘이 많이 들어가는 구조다. 따라서 손가락 하나의 힘에 의존하기보다, 두 손가락으로 레버를 통째로 움켜쥐듯 당기게 설계하여 지레의 원리를 극대화했다. 분무기를 칙칙 뿌릴 때의 경쾌한 반발력은 일상 속 반복 작업의 지루함을 덜어주는 의외의 청량감을 준다.',
        ] },
      },
    ],
  },
  { no: '04', title: '열쇠에서 얼굴까지', blocks: [] },
  { no: '05', title: '온도를 다루다',     blocks: [] },
];

/* 박스 색: 홈과 같은 팔레트에서 랜덤 */
const PALETTE = [
  '#414757', '#5a5047', '#7c454f', '#82643c', '#746d76', '#c66335',
  '#a9737d', '#8691a4', '#ad9275', '#d4bea5', '#cac9c8', '#fcefd8',
];
const SOLID_FALLBACK = { 1: '#4a3b35', 2: '#958676', 3: '#3c3126', 4: '#7f482b', 5: '#8a7a6b', 6: '#d3c2ad', 7: '#251d16', 8: '#443a2f', 9: '#27211d', 10: '#4a3b35', 11: '#b4a391', 12: '#cab59d', 13: '#ba9079', 14: '#ccbaa4', 15: '#c6ac86', 16: '#37262a', 17: '#201c1e', 18: '#c0a787', 19: '#181312', 20: '#a28b70', 21: '#29231d', 22: '#aba492', 23: '#b5987d', 24: '#7a7c80', 25: '#8b8e92', 26: '#6a5f5b', 27: '#4c4b4e', 28: '#857769', 29: '#524d51', 30: '#6e706c', 31: '#292521', 32: '#3a352f', 33: '#292520', 34: '#bfb19f', 35: '#7d746b', 36: '#251d16', 37: '#b0a08e', 38: '#958676', 39: '#3c3126', 40: '#b85a30', 41: '#7f482b', 42: '#8a7a6b', 43: '#4a3b35', 44: '#958676', 45: '#3c3126', 46: '#7f482b', 47: '#8a7a6b', 48: '#d3c2ad', 49: '#251d16', 50: '#443a2f', 51: '#27211d', 52: '#4a3b35', 53: '#b4a391', 54: '#cab59d', 55: '#ba9079', 56: '#ccbaa4', 57: '#c6ac86', 58: '#37262a', 59: '#201c1e', 60: '#c0a787', 61: '#181312', 62: '#a28b70', 63: '#29231d', 64: '#aba492' };

const rand = n => Math.floor(Math.random() * n);
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = rand(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const hexToRgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
function applyColor(el, hex) {
  const [r, g, b] = hexToRgb(hex);
  el.style.setProperty('--box-bg', hex);
  el.style.setProperty('--box-fg', (r * 299 + g * 587 + b * 114) / 1000 >= 150 ? '#000' : '#fff');
}

/* ───────── 어떤 아티클인지: article.html?a=03 (없으면 첫 번째) ───────── */
const params = new URLSearchParams(location.search);
let idx = Math.max(0, ARTICLES.findIndex(a => a.no === params.get('a')));
const art = ARTICLES[idx];
document.title = `${art.title} — 해봐야 아는 것들`;

/* ───────── 아티클 판 채우기 + 행 단위로 배치 ───────── */
const panel = document.getElementById('panel');
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
panel.innerHTML = `<header class="head"><span>${art.no}</span><span>${esc(art.title)}</span></header>`;
if (!art.blocks.length) panel.insertAdjacentHTML('beforeend', '<p class="soon">준비 중인 글이에요.</p>');
const parts = art.blocks.map(b => {
  const out = {};
  if (b.img) {
    const el = document.createElement('figure');
    el.className = 'blk-img';
    el.innerHTML = `<img src="${b.img.src}" alt="">`;
    el.style.gridColumn = `${b.img.col} / span ${b.img.w}`;
    panel.appendChild(el);
    out.img = el;
  }
  if (b.text) {
    const el = document.createElement('div');
    el.className = 'blk-text' + (b.text.align === 'right' ? ' right' : '');
    el.innerHTML = b.text.paras.map(p => typeof p === 'string' ? `<p>${esc(p)}</p>` : `<p class="gap">${esc(p.t)}</p>`).join('');
    el.style.gridColumn = `${b.text.col} / span ${b.text.w}`;
    panel.appendChild(el);
    out.text = el;
  }
  return out;
});

function layout() {
  const cell = innerWidth / 12;
  let row = 2;                                            // 1행은 번호·제목
  if (!art.blocks.length) row = 4;                        // 아직 글이 없으면 '준비 중' 한 줄만
  art.blocks.forEach((b, i) => {
    const p = parts[i];
    let span = b.img ? b.img.h : 1;
    if (p.text) {
      p.text.style.gridRow = `${row} / span 20`;          // 먼저 넉넉히 두고 실제 글 높이를 잼
      const need = Math.max(1, Math.ceil((p.text.offsetHeight - 1) / cell));
      span = Math.max(span, need);
      p.text.style.gridRow = `${row} / span ${need}`;
    }
    if (p.img) p.img.style.gridRow = `${row} / span ${b.img.h}`;
    row += span + 1;                                      // 블록 사이 한 행 비움
  });
  const rows = row - 1;                                   // 판의 행 수 (마지막 빈 행 포함)
  panel.style.setProperty('--rows', rows);
  fillCells(1 + rows + CONFIG.extraRows);
}

/* ───────── 배경 사진 칸 ───────── */
const grid = document.getElementById('grid');
let IMAGES = [], ORDER = [], made = 0, cellCount = 0;
function solidColor(img, n) {
  try {
    const cv = document.createElement('canvas'); cv.width = cv.height = 1;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    const iw = img.naturalWidth, ih = img.naturalHeight, s = Math.min(iw, ih);
    cx.drawImage(img, (iw - s) / 2, (ih - s) / 2, s, s, 0, 0, 1, 1);
    const [r, g, b] = cx.getImageData(0, 0, 1, 1).data;
    return `rgb(${r},${g},${b})`;
  } catch (e) { return SOLID_FALLBACK[n] || '#222'; }
}
const loadImage = src => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
function fillCells(totalRows) {
  if (!ORDER.length) return;
  const frag = document.createDocumentFragment();
  for (; made < totalRows; made++) {
    for (let c = 1; c <= 12; c++) {
      const cell = document.createElement('div');
      cell.className = `cell im-${ORDER[cellCount++ % ORDER.length]}`;
      cell.style.gridRow = made + 1; cell.style.gridColumn = c;
      frag.appendChild(cell);
    }
  }
  grid.appendChild(frag);
}

/* ───────── 이동: 박스·판이 들어왔던 꼭짓점으로 줄어든 뒤 다음 페이지로 ───────── */
function leave(url) {
  if (document.body.classList.contains('leaving')) return;
  document.body.classList.add('leaving');
  setTimeout(() => { location.href = url; }, 600);
}
const prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next');
prevBtn.disabled = idx === 0;
nextBtn.disabled = idx === ARTICLES.length - 1;
prevBtn.addEventListener('click', () => leave(`${CONFIG.page}?a=${ARTICLES[idx - 1].no}`));
nextBtn.addEventListener('click', () => leave(`${CONFIG.page}?a=${ARTICLES[idx + 1].no}`));
/* 홈: 들어오기 전에 있던 홈 파일로 (버전이 여러 개여도 출발한 홈으로 돌아감) */
function homeUrl() {
  try { const h = sessionStorage.getItem('haebwaya-home'); if (h) return h; } catch (e) {}
  return CONFIG.home;
}
document.getElementById('navName').href = homeUrl();
document.getElementById('navName').addEventListener('click', e => { e.preventDefault(); leave(homeUrl()); });
document.getElementById('toToc').addEventListener('click', e => { e.preventDefault(); leave('articles.html'); });
addEventListener('pageshow', e => { if (e.persisted) document.body.classList.remove('leaving'); });   // 뒤로가기로 돌아왔을 때

/* ───────── 시작 ───────── */
(async function init() {
  const [c1, c2] = shuffle([...PALETTE]);
  applyColor(document.getElementById('navArticle'), c1);
  applyColor(document.getElementById('navName'), c2);

  const imgs = await Promise.all(Array.from({ length: CONFIG.imageCount }, (_, i) => loadImage(CONFIG.path(i + 1))));
  let css = '';
  imgs.forEach((img, i) => {
    if (!img) return;
    IMAGES.push(i + 1);
    css += `.im-${i + 1}{--img:url(${img.src});--solid:${solidColor(img, i + 1)};}\n`;
  });
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  ORDER = shuffle(IMAGES.slice());

  await document.fonts.ready;
  layout();
  let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(layout, 100); });
})();
</script>
